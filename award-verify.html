<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상장 진위 확인 | 아세아항공직업전문학교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--primary:#0EA5E9;--primary-dk:#0284C7;--primary-lt:#E0F2FE;--bg:#F0F9FF;--text:#202124;--text-2:#5F6368;--border:#CBD5DF;--green:#1E8E3E;--green-lt:#E6F4EA;--red:#D93025;--red-lt:#FCE8E6;--r:12px}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;line-height:1.6}
.card{width:100%;max-width:440px;background:#fff;border-radius:var(--r);box-shadow:0 12px 40px rgba(60,64,67,.18);padding:28px 24px}
h1{font-size:19px;margin:0 0 4px}.muted{color:var(--text-2);font-size:13px}
input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;font:inherit;font-size:16px;letter-spacing:2px;text-transform:uppercase;margin:12px 0 10px}
input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
button{width:100%;min-height:44px;border:0;border-radius:var(--r);background:var(--primary);color:#fff;font:inherit;font-weight:500;cursor:pointer}button:hover{background:var(--primary-dk)}
.res{margin-top:16px;border-radius:var(--r);padding:14px 16px}.ok{background:var(--green-lt);color:var(--green)}.bad{background:var(--red-lt);color:var(--red)}
.res b{display:block;font-size:16px;margin-bottom:6px}dl{margin:8px 0 0;color:var(--text)}dt{font-size:12px;color:var(--text-2)}dd{margin:0 0 6px;font-weight:500}
</style>
</head>
<body>
<main class="card">
  <h1>상장 진위 확인</h1>
  <p class="muted">상장에 인쇄된 인증번호(또는 QR)로 발급 여부를 확인합니다.</p>
  <form id="f"><input id="c" maxlength="20" placeholder="인증번호 입력" autocomplete="off" aria-label="인증번호"><button type="submit">확인</button></form>
  <div id="r" role="status"></div>
</main>
<script>
(function () {
  var URL_ = 'https://zbpeyklwpotjyveipzxd.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
  var c = document.getElementById('c'), r = document.getElementById('r');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
  function check(code) {
    code = String(code || '').trim(); if (!code) return;
    r.innerHTML = '<p class="muted">확인 중…</p>';
    fetch(URL_ + '/rest/v1/rpc/award_verify', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }) })
      .then(function (x) { if (!x.ok) throw 0; return x.json(); })
      .then(function (d) {
        if (!d || !d.ok) r.innerHTML = '<div class="res bad"><b>확인되지 않는 번호입니다</b>인증번호를 다시 확인해 주십시오. 계속 확인되지 않으면 발급 기관에 문의하십시오.</div>';
        else if (d.revoked) r.innerHTML = '<div class="res bad"><b>폐기된 상장입니다</b>발급 기관에서 효력을 정지한 번호입니다.</div>';
        else r.innerHTML = '<div class="res ok"><b>정상 발급된 상장입니다</b><dl><dt>양식</dt><dd>' + esc(d.tpl) + '</dd><dt>발급번호</dt><dd>' + esc(d.serial) + '</dd><dt>수여자</dt><dd>' + esc(d.holder) + '</dd>' + (d.award ? '<dt>상명</dt><dd>' + esc(d.award) + '</dd>' : '') + '<dt>발급일</dt><dd>' + esc(String(d.issued_at).slice(0, 10)) + '</dd></dl></div>';
      }).catch(function () { r.innerHTML = '<div class="res bad"><b>확인하지 못했습니다</b>네트워크 상태를 확인한 뒤 다시 시도해 주십시오.</div>'; });
  }
  document.getElementById('f').onsubmit = function (e) { e.preventDefault(); check(c.value); };
  var q = new URLSearchParams(location.search).get('c'); if (q) { c.value = q; check(q); }
})();
</script>
</body>
</html>
