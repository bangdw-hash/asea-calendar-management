<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>시윤이의 그림 그리기</title>
<style>
:root {
  --primary: #1A73E8;
  --primary-dk: #1557B0;
  --primary-lt: #E8F0FE;
  --r: 12px;
  --sh: 0 2px 8px rgba(0,0,0,.10);
  --sh-md: 0 4px 16px rgba(0,0,0,.15);
  --sh-lg: 0 8px 32px rgba(0,0,0,.20);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f0f4ff;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;touch-action:none}

/* ── 화면 전환 ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;}
.screen.hidden{display:none}
.screen.enter{animation:fadeSlide .28s ease both}
@keyframes fadeSlide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ══════════════════════════════
   선택 화면
══════════════════════════════ */
#screen-select{background:linear-gradient(160deg,#e8f0fe 0%,#f3e8ff 100%);overflow-y:auto}

.sel-header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,#1A73E8,#7c3aed);
  color:#fff;
  border-radius:0 0 20px 20px;
  box-shadow:var(--sh-md);
  display:flex;align-items:center;gap:10px;
}
.sel-header-back{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  width:36px;height:36px;border-radius:50%;font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sel-title{font-size:20px;font-weight:900;flex:1}
.sel-sub{font-size:13px;opacity:.85;margin-top:2px}

/* 카테고리 그리드 */
#cat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}
@media(min-width:480px){#cat-grid{grid-template-columns:repeat(3,1fr)}}

.cat-card{
  background:#fff;border-radius:16px;
  padding:20px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;border:3px solid transparent;
  box-shadow:var(--sh);transition:all .18s;
  -webkit-tap-highlight-color:transparent;
}
.cat-card:active,.cat-card:hover{border-color:var(--primary);transform:scale(1.04);box-shadow:var(--sh-md)}
.cat-card .icon{font-size:44px;line-height:1}
.cat-card .name{font-size:16px;font-weight:800;color:#1a1a2e}
.cat-card .cnt{font-size:12px;color:#6b7280}

/* 이미지 그리드 */
#img-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:14px;
}
@media(min-width:480px){#img-grid{grid-template-columns:repeat(3,1fr)}}

.img-card{
  background:#fff;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:10px 8px 10px;
  cursor:pointer;border:3px solid transparent;
  box-shadow:var(--sh);transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.img-card:active,.img-card:hover{border-color:var(--primary);transform:scale(1.04)}
.img-card svg{width:100%;aspect-ratio:4/3;border-radius:8px;background:#fafafa}
.img-card .name{font-size:14px;font-weight:700;color:#1a1a2e}

/* ══════════════════════════════
   그림판 화면 (전체화면)
══════════════════════════════ */
#screen-draw{background:#1a1a2e}

/* portrait: 위=캔버스 아래=컨트롤 */
#draw-layout{
  display:flex;
  flex-direction:column;
  width:100%;height:100%;
}
@media(orientation:landscape){
  #draw-layout{flex-direction:row}
}

/* 캔버스 영역 */
#draw-canvas-area{
  flex:1;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
  padding:8px;
}
#drawing-board{
  position:relative;
  aspect-ratio:1/1;
  width:100%;
  max-width:min(calc(100vh - 200px), calc(100vw - 16px));
  background:#fff;
  border-radius:16px;
  box-shadow:var(--sh-lg);
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
@media(orientation:landscape){
  #drawing-board{
    max-width:min(calc(100vh - 16px), calc(100vw - 260px));
  }
}
#svg-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#svg-wrap svg{width:100%;height:100%}
#svg-wrap svg .cr{cursor:pointer;touch-action:none}
#svg-wrap svg .cr:active{filter:brightness(.88)}

/* 컨트롤 패널 */
#draw-controls{
  background:#fff;
  border-top:2px solid #e0e7ff;
  display:flex;flex-direction:column;
  flex-shrink:0;
  max-height:46vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
@media(orientation:landscape){
  #draw-controls{
    width:248px;min-width:220px;max-height:100vh;
    border-top:none;border-left:2px solid #e0e7ff;
  }
}

/* 진행률 */
#prog-row{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
#prog-track{flex:1;height:12px;background:#e0e7ff;border-radius:99px;overflow:hidden}
#prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#a78bfa);border-radius:99px;transition:width .4s}
#prog-pct{font-size:13px;font-weight:700;color:var(--primary);min-width:34px;text-align:right}

/* 툴바 */
#draw-toolbar{
  padding:4px 8px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.tbtn{
  display:flex;align-items:center;gap:3px;
  padding:6px 9px;border:2px solid #e0e7ff;border-radius:10px;
  background:#fff;font-size:12px;font-weight:700;color:#1a1a2e;
  cursor:pointer;transition:all .14s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.tbtn:active,.tbtn:hover{background:var(--primary-lt);border-color:var(--primary)}
.tbtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.red.active{background:#dc2626;border-color:#dc2626}
.tbtn.green.active{background:#16a34a;border-color:#16a34a}
#btn-back-sel{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 6px}

/* 팔레트 */
#palette-wrap{padding:5px 10px 8px}
#palette-label{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:5px}
#palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media(orientation:landscape){#palette{grid-template-columns:repeat(4,1fr)}}
.cbtn{
  width:100%;aspect-ratio:1/1;border-radius:9px;
  border:3px solid transparent;cursor:pointer;
  box-shadow:var(--sh);transition:transform .12s,border-color .12s;
  -webkit-tap-highlight-color:transparent;
}
.cbtn:active,.cbtn:hover{transform:scale(1.14)}
.cbtn.active{border-color:#1a1a2e;transform:scale(1.2);box-shadow:0 0 0 3px rgba(26,115,232,.4)}

/* 갤러리 (그림판 내) */
#draw-gallery-section{padding:6px 10px 8px;border-top:1px solid #e0e7ff}
#draw-gallery-label{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:5px}
#draw-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:80px;overflow-y:auto}
@media(orientation:landscape){#draw-gallery{grid-template-columns:repeat(2,1fr);max-height:120px}}
.gitem{cursor:pointer;border-radius:6px;overflow:hidden;border:2px solid #e0e7ff}
.gitem:hover{border-color:var(--primary)}
.gitem img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}

/* 완성 모달 */
#completion-modal{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#completion-modal.show{opacity:1;pointer-events:auto}
#completion-box{
  background:#fff;border-radius:24px;padding:36px 28px;
  text-align:center;max-width:320px;width:90%;
  box-shadow:var(--sh-lg);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.cm-emoji{font-size:72px;line-height:1;margin-bottom:10px}
.cm-title{font-size:26px;font-weight:900;color:var(--primary);margin-bottom:6px}
.cm-sub{font-size:15px;color:#6b7280;margin-bottom:22px}
.cm-btns{display:flex;gap:10px;margin-top:18px}
#modal-save{
  flex:1;background:#16a34a;
  color:#fff;border:none;border-radius:14px;
  padding:13px;font-size:16px;font-weight:800;
  cursor:pointer;transition:opacity .15s}
#modal-save:hover{opacity:.88}
#modal-next{
  flex:1;background:linear-gradient(135deg,var(--primary),#a78bfa);
  color:#fff;border:none;border-radius:14px;
  padding:13px;font-size:16px;font-weight:800;
  cursor:pointer;width:100%;box-shadow:var(--sh-md);
}

/* 부모 설정 */
#parent-modal{
  position:fixed;inset:0;z-index:600;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#parent-modal.show{opacity:1;pointer-events:auto}
#parent-box{
  background:#fff;border-radius:20px;padding:22px;
  max-width:340px;width:92%;box-shadow:var(--sh-lg);
}
#parent-box h3{font-size:19px;font-weight:800;margin-bottom:14px}
.srow{margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.srow label{font-size:12px;font-weight:700;color:#6b7280}
.srow input[type=text],.srow input[type=range]{
  width:100%;padding:8px 11px;border:2px solid #e0e7ff;border-radius:10px;font-size:15px}
.srow input[type=range]{padding:3px 0}
.srow .trow{display:flex;align-items:center;justify-content:space-between}
.pactions{display:flex;gap:8px;margin-top:14px}
.pactions button{flex:1;padding:11px;border-radius:11px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.pbtn-cancel{background:#f1f5f9;color:#1a1a2e}
.pbtn-save{background:var(--primary);color:#fff}

/* 파티클 */
#particle-canvas{
  position:fixed;inset:0;z-index:999;
  pointer-events:none;display:none;
}

/* trace canvas */
#trace-canvas{
  position:absolute;inset:0;
  cursor:crosshair;display:none;z-index:10;
}

/* 펜 설정 패널 */
#pen-panel{padding:5px 10px 8px;border-top:1px solid #e0e7ff}
.pen-label{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:4px}
#pen-type-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#pen-size-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.penbtn{
  padding:6px 2px;border:2px solid #e0e7ff;border-radius:9px;
  background:#fff;font-size:10px;font-weight:700;color:#1a1a2e;
  cursor:pointer;transition:all .13s;text-align:center;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
.penbtn .p-icon{display:block;font-size:18px;line-height:1}
.penbtn:active,.penbtn:hover{background:var(--primary-lt);border-color:var(--primary)}
.penbtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sizebtn{
  padding:7px 4px;border:2px solid #e0e7ff;border-radius:9px;
  background:#fff;cursor:pointer;transition:all .13s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-tap-highlight-color:transparent;
}
.sizebtn .s-dot{border-radius:50%;background:#1a1a2e}
.sizebtn .s-label{font-size:9px;font-weight:700;color:#6b7280}
.sizebtn:active,.sizebtn:hover{background:var(--primary-lt);border-color:var(--primary)}
.sizebtn.active{background:var(--primary);border-color:var(--primary)}
.sizebtn.active .s-dot{background:#fff}
.sizebtn.active .s-label{color:rgba(255,255,255,.85)}
</style>
</head>
<body>

<!-- ══ 선택 화면 ══ -->
<div id="screen-select" class="screen">
  <div class="sel-header" id="sel-header">
    <button class="sel-header-back hidden" id="btn-back-cat" onclick="DrawingApp.showCategories()">←</button>
    <div>
      <div class="sel-title" id="sel-title">🎨 시윤이의 그림 그리기</div>
      <div class="sel-sub" id="sel-sub">어떤 그림을 그릴까요?</div>
    </div>
    <button class="tbtn" onclick="DrawingApp.openParentModal()" style="margin-left:auto">⚙️</button>
  </div>

  <!-- 카테고리 그리드 -->
  <div id="cat-grid"></div>
  <!-- 이미지 그리드 (카테고리 선택 후) -->
  <div id="img-grid" class="hidden" style="display:none"></div>
</div>

<!-- ══ 그림판 화면 ══ -->
<div id="screen-draw" class="screen hidden">
  <div id="draw-layout">
    <!-- 캔버스 영역 -->
    <div id="draw-canvas-area">
      <div id="drawing-board">
        <div id="svg-wrap"></div>
        <canvas id="trace-canvas"></canvas>
      </div>
    </div>

    <!-- 컨트롤 패널 -->
    <div id="draw-controls">
      <!-- 진행률 + 툴바 -->
      <div id="prog-row">
        <button id="btn-back-sel" onclick="DrawingApp.goToSelect()" title="그림 다시 고르기">🔙</button>
        <div id="prog-track"><div id="prog-bar"></div></div>
        <span id="prog-pct">0%</span>
      </div>

      <div id="draw-toolbar">
        <button class="tbtn active" id="btn-mode-color" onclick="DrawingApp.setMode('color')">✏️ 색칠</button>
        <button class="tbtn green" id="btn-mode-trace" onclick="DrawingApp.setMode('trace')">〰️ 따라그리기</button>
        <button class="tbtn" onclick="DrawingApp.undo()" title="되돌리기">↩️</button>
        <button class="tbtn" onclick="DrawingApp.showHint()" title="힌트">💡</button>
        <button class="tbtn" onclick="DrawingApp.saveAsPNG()" title="저장">💾</button>
        <button class="tbtn" onclick="DrawingApp.printDrawing()" title="인쇄">🖨️</button>
        <button class="tbtn" id="btn-bgm" onclick="DrawingApp.toggleBGM()">🎵</button>
      </div>

      <!-- 팔레트 -->
      <div id="palette-wrap">
        <div id="palette-label">🎨 색상 선택</div>
        <div id="palette"></div>
      </div>

      <!-- 펜 설정 -->
      <div id="pen-panel">
        <div class="pen-label">🖊️ 펜 종류</div>
        <div id="pen-type-row">
          <button id="ptype-pencil" class="penbtn active" onclick="DrawingApp.setPenType('pencil')">
            <span class="p-icon">✏️</span>연필
          </button>
          <button id="ptype-brush" class="penbtn" onclick="DrawingApp.setPenType('brush')">
            <span class="p-icon">🖌️</span>붓
          </button>
          <button id="ptype-marker" class="penbtn" onclick="DrawingApp.setPenType('marker')">
            <span class="p-icon">🖊️</span>마커
          </button>
          <button id="ptype-crayon" class="penbtn" onclick="DrawingApp.setPenType('crayon')">
            <span class="p-icon">🖍️</span>크레용
          </button>
        </div>
        <div class="pen-label" style="margin-top:6px">두께</div>
        <div id="pen-size-row">
          <button id="psize-S" class="sizebtn" onclick="DrawingApp.setPenSize('S')">
            <span class="s-dot" style="width:5px;height:5px"></span>
            <span class="s-label">얇게</span>
          </button>
          <button id="psize-M" class="sizebtn active" onclick="DrawingApp.setPenSize('M')">
            <span class="s-dot" style="width:9px;height:9px"></span>
            <span class="s-label">보통</span>
          </button>
          <button id="psize-L" class="sizebtn" onclick="DrawingApp.setPenSize('L')">
            <span class="s-dot" style="width:14px;height:14px"></span>
            <span class="s-label">굵게</span>
          </button>
        </div>
      </div>

      <!-- 인라인 갤러리 -->
      <div id="draw-gallery-section">
        <div id="draw-gallery-label">🖼 내 그림들</div>
        <div id="draw-gallery"></div>
      </div>
    </div>
  </div>
</div>

<!-- 완성 모달 -->
<div id="completion-modal">
  <div id="completion-box">
    <div class="cm-emoji">🎉</div>
    <div class="cm-title">완성!</div>
    <div class="cm-sub" id="cm-sub">참 잘했어요!</div>
    <div class="cm-btns">
      <button id="modal-save" onclick="DrawingApp.onSave()">💾 저장하기</button>
      <button id="modal-next" onclick="DrawingApp.onNext()">🎨 다음 그림</button>
    </div>
  </div>
</div>

<!-- 부모 설정 -->
<div id="parent-modal">
  <div id="parent-box">
    <h3>⚙️ 설정</h3>
    <div class="srow">
      <label>아이 이름</label>
      <input type="text" id="setting-name" placeholder="이름">
    </div>
    <div class="srow">
      <label>배경음 볼륨</label>
      <input type="range" id="setting-vol" min="0" max="100" value="12">
    </div>
    <div class="srow">
      <div class="trow">
        <label>음성 안내</label>
        <input type="checkbox" id="setting-voice" checked>
      </div>
    </div>
    <div class="pactions">
      <button class="pbtn-cancel" onclick="DrawingApp.closeParentModal()">취소</button>
      <button class="pbtn-save" onclick="DrawingApp.saveParentSettings()">저장</button>
    </div>
  </div>
</div>

<canvas id="particle-canvas"></canvas>

<script src="drawing-data.js"></script>
<script src="drawing-app.js"></script>
</body>
</html>
