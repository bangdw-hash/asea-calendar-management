<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ASEA 관리실 포털</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    /* ── 기본 초기화 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #F0F4F8;
      --color-card: #ffffff;
      --color-accent: #0288D1;
      --color-accent-hover: #0277BD;
      --color-text: #202124;
      --color-text-secondary: #5F6368;
      --color-border: #E0E4EA;
      --color-success: #34A853;
      --color-warning: #F57C00;
      --color-error: #EA4335;
      --shadow-sm: 0 1px 3px rgba(60,64,67,.10);
      --shadow-md: 0 2px 8px rgba(60,64,67,.14);
      --r-md: 8px;
      --r-lg: 12px;
    }
    body { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: 14px; }

    /* ── 로그인 ── */
    #login-overlay {
      position: fixed; inset: 0; background: var(--color-bg);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .login-card {
      background: var(--color-card); border-radius: var(--r-lg);
      padding: 40px 32px; text-align: center; box-shadow: var(--shadow-md);
      width: min(380px, 94vw);
    }
    .login-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 24px; }
    .btn-login {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      width: 100%; padding: 12px 20px; border-radius: var(--r-md);
      background: #1A73E8; color: #fff; font-size: 15px; font-weight: 600;
      transition: background .15s;
    }
    .btn-login:hover { background: #1557B0; }
    .login-notice { font-size: 11px; color: var(--color-text-secondary); margin-top: 12px; }

    /* ── 헤더 ── */
    .app-header {
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 17px; font-weight: 700; flex: 1; }
    .header-user { font-size: 12px; opacity: .85; }
    .btn-logout {
      background: rgba(255,255,255,.2); color: #fff; border-radius: 6px;
      padding: 5px 12px; font-size: 12px; font-weight: 500; margin-left: 8px;
    }
    .btn-logout:hover { background: rgba(255,255,255,.35); }

    /* ── 탭 ── */
    .tab-nav {
      display: flex; background: #fff; border-bottom: 2px solid var(--color-border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 10px 18px; font-size: 12px; font-weight: 500;
      color: var(--color-text-secondary); white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn .tab-icon { font-size: 18px; }
    .tab-btn.active { color: var(--color-accent); border-bottom-color: var(--color-accent); }
    .tab-badge {
      background: var(--color-error); color: #fff; border-radius: 99px;
      font-size: 10px; padding: 0 5px; min-width: 16px; text-align: center; line-height: 16px;
    }

    /* ── 탭 패널 ── */
    .tab-panel { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
    .tab-panel.active { display: block; }

    /* ── 카드 ── */
    .card {
      background: var(--color-card); border-radius: var(--r-md);
      box-shadow: var(--shadow-sm); padding: 18px; margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .section-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

    /* ── 작업지시 ── */
    .wo-toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .wo-filters { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
    select.form-select {
      border: 1px solid var(--color-border); border-radius: 6px;
      padding: 6px 10px; font-size: 13px; background: #fff;
    }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: background .15s; }
    .btn-primary { background: var(--color-accent); color: #fff; }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-secondary { background: #f1f3f4; color: var(--color-text); }
    .btn-secondary:hover { background: #e3e6ea; }
    .btn-ghost { background: transparent; color: var(--color-text-secondary); }
    .btn-ghost:hover { background: #f1f3f4; }
    .btn-danger { background: #FCE8E6; color: var(--color-error); }
    .btn-danger:hover { background: #FCCCCB; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-xs { padding: 3px 8px; font-size: 11px; }

    .wo-card {
      background: var(--color-card); border-radius: var(--r-md);
      box-shadow: var(--shadow-sm); padding: 14px 16px; margin-bottom: 10px;
      border-left: 4px solid #ccc; transition: box-shadow .15s;
    }
    .wo-card:hover { box-shadow: var(--shadow-md); }
    .wo-card[data-priority="긴급"] { border-left-color: #EA4335; }
    .wo-card[data-priority="높음"]  { border-left-color: #FBBC05; }
    .wo-card[data-priority="보통"]  { border-left-color: #4285F4; }
    .wo-card[data-priority="낮음"]  { border-left-color: #9AA0A6; }
    .wo-card-header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
    .wo-badge { color: #fff; border-radius: 4px; font-size: 11px; padding: 2px 7px; font-weight: 600; }
    .wo-dept { font-size: 11px; color: var(--color-text-secondary); background: #f1f3f4; border-radius: 4px; padding: 2px 6px; }
    .wo-date { font-size: 11px; color: var(--color-text-secondary); margin-left: auto; }
    .wo-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .wo-card-meta { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
    .wo-card-content { font-size: 13px; color: var(--color-text); background: #f8f9fb; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
    .wo-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--color-text-secondary); }

    /* ── 모달 ── */
    .modal { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; }
    .modal[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
    .modal-dialog {
      position: relative; background: var(--color-card); border-radius: var(--r-lg);
      box-shadow: 0 12px 40px rgba(0,0,0,.2); width: min(520px, 96vw);
      max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--color-border);
      font-size: 16px; font-weight: 700;
    }
    .modal-close { font-size: 18px; color: var(--color-text-secondary); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--color-border); }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--color-text-secondary); }
    .form-input, .form-select, .form-textarea {
      width: 100%; border: 1px solid var(--color-border); border-radius: 6px;
      padding: 8px 10px; font-size: 13px; background: #fff;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(2,136,209,.12);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* ── 캘린더 뷰 ── */
    .cal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .cal-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--color-border); border-radius: var(--r-md); overflow: hidden; }
    .cal-weekday { text-align: center; font-size: 12px; font-weight: 600; padding: 8px 4px; background: #f8f9fb; color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border); }
    .cal-weekday.sun { color: #EA4335; }
    .cal-weekday.sat { color: #1A73E8; }
    .cal-cell { min-height: 90px; border-right: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); padding: 4px; position: relative; background: #fff; }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.other-month { background: #fafafa; }
    .cal-cell.today { background: #E3F2FD; }
    .cal-day-num { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); padding: 2px 4px; }
    .cal-cell.today .cal-day-num { background: var(--color-accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .cal-event { font-size: 10px; border-radius: 3px; padding: 1px 4px; margin-bottom: 1px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* ── 토스트 ── */
    #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: #333; color: #fff; border-radius: 6px; padding: 10px 16px; font-size: 13px; box-shadow: var(--shadow-md); max-width: 320px; }
    .toast-success { background: var(--color-success); }
    .toast-error { background: var(--color-error); }
    .toast-warning { background: var(--color-warning); }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .tab-btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- 로그인 -->
  <div id="login-overlay">
    <div class="login-card">
      <span class="login-icon">🏢</span>
      <h1 class="login-title">ASEA 관리실 포털</h1>
      <p class="login-sub">작업지시 · 시설관리 · 당직 업무 시스템</p>
      <button id="login-btn" class="btn-login">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google로 로그인
      </button>
      <p class="login-notice">관리실 전용 Google 계정으로 로그인하세요</p>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app" hidden>
    <header class="app-header">
      <span class="header-icon">🏢</span>
      <span class="header-title">ASEA 관리실 포털</span>
      <span id="user-email" class="header-user"></span>
      <button id="logout-btn" class="btn-logout">로그아웃</button>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="workorder">
        <span class="tab-icon">📋</span>
        <span>작업지시</span>
        <span id="wo-badge" class="tab-badge" hidden>0</span>
      </button>
      <button class="tab-btn" data-tab="calendar">
        <span class="tab-icon">📅</span>
        <span>업무 캘린더</span>
      </button>
      <button class="tab-btn" data-tab="staff">
        <span class="tab-icon">👥</span>
        <span>당직 인원</span>
      </button>
      <button class="tab-btn" data-tab="spaces">
        <span class="tab-icon">🚪</span>
        <span>공간관리</span>
      </button>
      <button class="tab-btn" data-tab="checkin">
        <span class="tab-icon">📊</span>
        <span>입출입현황</span>
        <span id="checkin-badge" class="tab-badge" hidden>●</span>
      </button>
    </nav>

    <main>
      <!-- ══ 작업지시 탭 ══ -->
      <div id="tab-workorder" class="tab-panel active">
        <h2 class="section-title">📋 작업지시</h2>

        <div class="wo-toolbar">
          <div class="wo-filters">
            <select id="wo-filter-status" class="form-select">
              <option value="all">전체 상태</option>
              <option value="대기">대기</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
              <option value="취소">취소</option>
            </select>
            <select id="wo-filter-priority" class="form-select">
              <option value="all">전체 우선순위</option>
              <option value="긴급">긴급</option>
              <option value="높음">높음</option>
              <option value="보통">보통</option>
              <option value="낮음">낮음</option>
            </select>
          </div>
          <button id="wo-add-btn" class="btn btn-primary btn-sm">+ 작업지시 등록</button>
          <button id="wo-refresh-btn" class="btn btn-secondary btn-sm">🔄</button>
        </div>

        <div id="wo-list"><p class="empty-state">불러오는 중...</p></div>
      </div>

      <!-- ══ 업무 캘린더 탭 ══ -->
      <div id="tab-calendar" class="tab-panel">
        <h2 class="section-title">📅 업무 캘린더</h2>

        <div class="cal-toolbar">
          <button id="cal-prev" class="btn btn-secondary btn-sm">‹</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="btn btn-secondary btn-sm">›</button>
        </div>

        <div style="background:#fff; border-radius:var(--r-md); box-shadow:var(--shadow-sm); overflow:hidden;">
          <div class="cal-grid" id="cal-weekdays">
            <div class="cal-weekday sun">일</div>
            <div class="cal-weekday">월</div>
            <div class="cal-weekday">화</div>
            <div class="cal-weekday">수</div>
            <div class="cal-weekday">목</div>
            <div class="cal-weekday">금</div>
            <div class="cal-weekday sat">토</div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

      <!-- ══ 당직 인원 탭 ══ -->
      <div id="tab-staff" class="tab-panel">
        <h2 class="section-title">👥 당직 인원 관리</h2>
        <div id="staff-list"><p class="empty-state">불러오는 중...</p></div>
      </div>

      <!-- ══ 공간관리 탭 ══ -->
      <div id="tab-spaces" class="tab-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px">
          <h2 class="section-title" style="margin-bottom:0">🚪 공간 관리</h2>
          <div style="display:flex;gap:8px">
            <button id="sp-add-btn" class="btn btn-primary btn-sm">+ 공간 등록</button>
            <button id="sp-refresh-btn" class="btn btn-secondary btn-sm">🔄</button>
          </div>
        </div>
        <p style="font-size:13px;color:#5f6368;margin-bottom:16px">
          공간을 등록하면 QR 코드가 자동 생성됩니다. QR 코드를 출력하여 해당 공간에 부착하세요.
        </p>
        <div id="sp-list"><p class="empty-state">불러오는 중...</p></div>

        <!-- 공간 등록 모달 -->
        <div id="sp-modal" class="modal" hidden>
          <div class="modal-backdrop" id="sp-modal-backdrop"></div>
          <div class="modal-dialog">
            <div class="modal-header">
              <span id="sp-modal-title">공간 등록</span>
              <button class="modal-close" id="sp-modal-close">✕</button>
            </div>
            <div class="modal-body">
              <div>
                <label class="form-label">공간 이름 *</label>
                <input id="sp-name-input" type="text" class="form-input" placeholder="예: A320 시뮬레이터실">
              </div>
              <div>
                <label class="form-label">위치</label>
                <input id="sp-location-input" type="text" class="form-input" placeholder="예: 항공관 3층 302호">
              </div>
              <div>
                <label class="form-label">설명</label>
                <input id="sp-desc-input" type="text" class="form-input" placeholder="용도, 주의사항 등">
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" id="sp-modal-cancel">취소</button>
              <button class="btn btn-primary" id="sp-modal-save">등록</button>
            </div>
          </div>
        </div>

        <!-- QR 코드 보기 모달 -->
        <div id="qr-modal" class="modal" hidden>
          <div class="modal-backdrop" id="qr-modal-backdrop"></div>
          <div class="modal-dialog" style="max-width:380px;text-align:center">
            <div class="modal-header">
              <span id="qr-modal-title">QR 코드</span>
              <button class="modal-close" id="qr-modal-close">✕</button>
            </div>
            <div class="modal-body" style="align-items:center;padding:24px">
              <img id="qr-img" src="" alt="QR Code" style="width:260px;height:260px;border:8px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.15);border-radius:8px">
              <div id="qr-room-name" style="font-size:16px;font-weight:700;margin-top:14px"></div>
              <div id="qr-room-location" style="font-size:13px;color:#5f6368;margin-top:4px"></div>
              <a id="qr-checkin-link" href="#" target="_blank" style="font-size:12px;color:#1a73e8;margin-top:8px;word-break:break-all;display:block"></a>
              <button id="qr-print-btn" class="btn btn-primary" style="margin-top:16px;width:100%">🖨️ 인쇄 / PDF 저장</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ 입출입현황 탭 ══ -->
      <div id="tab-checkin" class="tab-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px">
          <h2 class="section-title" style="margin-bottom:0">📊 입출입 현황</h2>
          <button id="ci-refresh-btn" class="btn btn-secondary btn-sm">🔄 새로고침</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
          <select id="ci-filter-room" class="form-select" style="min-width:140px">
            <option value="all">전체 공간</option>
          </select>
          <select id="ci-filter-type" class="form-select" style="min-width:100px">
            <option value="all">전체</option>
            <option value="입실">입실</option>
            <option value="퇴실">퇴실</option>
          </select>
          <input id="ci-filter-date" type="date" class="form-select" style="min-width:140px">
        </div>
        <div id="ci-summary" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px"></div>
        <div id="ci-list"><p class="empty-state">필터를 설정하고 새로고침 버튼을 누르세요.</p></div>
      </div>
    </main>
  </div>

  <!-- 작업지시 등록/수정 모달 -->
  <div id="wo-modal" class="modal" hidden>
    <div class="modal-backdrop" id="wo-modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <span id="wo-modal-title">작업지시 등록</span>
        <button class="modal-close" id="wo-modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label class="form-label">제목 *</label>
          <input id="wo-title-input" type="text" class="form-input" placeholder="작업 제목">
        </div>
        <div>
          <label class="form-label">내용</label>
          <textarea id="wo-content-input" class="form-textarea" placeholder="상세 내용을 입력하세요"></textarea>
        </div>
        <div class="form-row">
          <div>
            <label class="form-label">우선순위</label>
            <select id="wo-priority-select" class="form-select">
              <option value="보통">보통</option>
              <option value="긴급">긴급</option>
              <option value="높음">높음</option>
              <option value="낮음">낮음</option>
            </select>
          </div>
          <div>
            <label class="form-label">기한</label>
            <input id="wo-due-input" type="date" class="form-input">
          </div>
        </div>
        <div>
          <label class="form-label">부서/위치</label>
          <input id="wo-dept-input" type="text" class="form-input" placeholder="예: 기숙사 3동, 본관 1층">
        </div>
        <div>
          <label class="form-label">비고</label>
          <input id="wo-note-input" type="text" class="form-input" placeholder="추가 메모">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="wo-modal-cancel">취소</button>
        <button class="btn btn-primary" id="wo-modal-save">저장</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
