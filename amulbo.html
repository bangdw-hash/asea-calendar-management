<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아물보 — 아세아항공직업전문학교</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1D4ED8;
    --primary-mid: #2563EB;
    --primary-light: #3B82F6;
    --primary-bg: #EFF6FF;
    --primary-border: #BFDBFE;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --success: #16A34A;
    --success-light: #DCFCE7;
    --danger: #DC2626;
    --danger-light: #FEE2E2;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);
  }

  body {
    font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--gray-100);
    color: var(--gray-900);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .site-header {
    background: linear-gradient(135deg, #1D4ED8 0%, #3B82F6 100%);
    color: #fff;
    padding: 36px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .header-emoji {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.2));
  }
  .site-header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .site-header p {
    font-size: 0.95rem;
    opacity: 0.85;
    font-weight: 400;
  }

  /* ── Service unavailable overlay ── */
  #unavailableScreen {
    display: none;
    flex: 1;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 40px 24px;
    text-align: center;
  }
  #unavailableScreen .unavail-icon { font-size: 64px; }
  #unavailableScreen h2 { font-size: 1.4rem; color: var(--gray-700); }
  #unavailableScreen p { color: var(--gray-500); font-size: 0.95rem; }

  /* ── Loading overlay ── */
  #loadingScreen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 40px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid var(--primary-border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main content ── */
  #mainContent {
    display: none;
    flex: 1;
    flex-direction: column;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 40px;
    gap: 20px;
  }

  /* ── User type selector ── */
  .user-type-section {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .user-type-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .user-type-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .user-type-btn {
    padding: 16px 12px;
    border: 2px solid var(--gray-200);
    border-radius: 12px;
    background: var(--gray-50);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gray-700);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .user-type-btn:hover {
    border-color: var(--primary-light);
    background: var(--primary-bg);
    color: var(--primary);
  }
  .user-type-btn.selected {
    border-color: var(--primary);
    background: var(--primary-bg);
    color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .user-type-btn .btn-emoji { font-size: 1.4rem; }

  /* ── Q&A History ── */
  #qaHistory {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .qa-item {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .qa-question {
    background: var(--primary-bg);
    border-bottom: 1px solid var(--primary-border);
    padding: 16px 20px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--primary);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .qa-question .q-badge {
    background: var(--primary);
    color: #fff;
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .qa-answer {
    padding: 20px;
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--gray-700);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .qa-answer .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--primary);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .qa-answer.thinking {
    color: var(--gray-400);
    font-style: italic;
  }

  .qa-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--gray-100);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .feedback-btns { display: flex; gap: 8px; }
  .feedback-btn {
    padding: 6px 14px;
    border: 1.5px solid var(--gray-200);
    border-radius: 20px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--gray-600);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .feedback-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .feedback-btn.voted-good { border-color: var(--success); color: var(--success); background: var(--success-light); }
  .feedback-btn.voted-bad  { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
  .qa-meta { font-size: 0.78rem; color: var(--gray-400); }

  /* ── Input area ── */
  .input-card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .input-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #questionInput {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.6;
    resize: none;
    min-height: 80px;
    max-height: 240px;
    overflow-y: auto;
    color: var(--gray-900);
    transition: border-color 0.15s;
    outline: none;
  }
  #questionInput:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
  }
  #questionInput::placeholder { color: var(--gray-400); }
  #questionInput:disabled { background: var(--gray-50); }

  .input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .input-hint { font-size: 0.8rem; color: var(--gray-400); }

  #sendBtn {
    padding: 12px 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
    min-width: 100px;
    justify-content: center;
  }
  #sendBtn:hover:not(:disabled) { background: var(--primary-mid); }
  #sendBtn:active:not(:disabled) { transform: scale(0.97); }
  #sendBtn:disabled { background: var(--gray-300); cursor: not-allowed; }

  .send-spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* ── Disclaimer ── */
  .disclaimer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--gray-400);
    padding: 4px 0;
    line-height: 1.5;
  }

  /* ── Session counter ── */
  .session-counter {
    text-align: center;
    font-size: 0.82rem;
    color: var(--gray-500);
    padding: 4px 0;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .site-header { padding: 28px 16px 24px; }
    .header-emoji { font-size: 44px; }
    .site-header h1 { font-size: 1.6rem; }
    #mainContent { padding: 16px 12px 32px; gap: 16px; }
    .user-type-buttons { grid-template-columns: 1fr 1fr; gap: 10px; }
    .user-type-btn { padding: 14px 8px; font-size: 0.95rem; }
    #sendBtn { padding: 12px 20px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <span class="header-emoji">🙏</span>
  <h1>아물보</h1>
  <p>아세아항공직업전문학교 무엇이든 물어보세요</p>
</header>

<!-- Loading screen -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <p style="color:var(--gray-500);font-size:.95rem;">서비스 초기화 중...</p>
</div>

<!-- Unavailable screen -->
<div id="unavailableScreen">
  <span class="unavail-icon">🔧</span>
  <h2>서비스 준비 중입니다</h2>
  <p>곧 이용하실 수 있습니다. 잠시 후 다시 시도해 주세요.</p>
</div>

<!-- Main content -->
<div id="mainContent">

  <!-- User type selector -->
  <div class="user-type-section">
    <div class="user-type-label">나는...</div>
    <div class="user-type-buttons">
      <button class="user-type-btn selected" id="btnStudent" onclick="selectUserType('student')">
        <span class="btn-emoji">🎓</span> 학생
      </button>
      <button class="user-type-btn" id="btnStaff" onclick="selectUserType('staff')">
        <span class="btn-emoji">👔</span> 교직원
      </button>
    </div>
  </div>

  <!-- Q&A history -->
  <div id="qaHistory"></div>

  <!-- Input card -->
  <div class="input-card">
    <div class="input-label">질문하기</div>
    <textarea
      id="questionInput"
      placeholder="궁금한 점을 자유롭게 입력하세요..."
      rows="3"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <div class="input-row">
      <span class="input-hint">Enter: 전송 &nbsp;·&nbsp; Shift+Enter: 줄바꿈</span>
      <button id="sendBtn" onclick="sendQuestion()">
        <span id="sendBtnIcon">✈️</span>
        <span id="sendBtnText">전송</span>
      </button>
    </div>
  </div>

  <!-- Disclaimer -->
  <p class="disclaimer">⚠️ AI 안내는 참고용이며, 정확한 내용은 담당부서에 문의하세요.</p>

  <!-- Session counter -->
  <p class="session-counter" id="sessionCounter" style="display:none;"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloudforms.js?v=20260617cf1"></script>
<script src="config.js?v=20260623ai2"></script>
<script>
// ── Constants ──────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyZuuQpuc-0KWaaHmwJUTvnAc83liMcUcC5XxcdR-EFQCFC2AJ0LpFS3R1gS_JXI3Fykg/exec';

// ── XOR helpers ─────────────────────────────────────────────
function _xorKey(str, seed) {
  if (!str) return str;
  var k = seed || 'asea-xor-2024';
  var out = '';
  for (var i = 0; i < str.length; i++) {
    out += String.fromCharCode(str.charCodeAt(i) ^ k.charCodeAt(i % k.length));
  }
  return out;
}
function _decodeKey(encoded) {
  if (!encoded) return '';
  try { return _xorKey(atob(encoded)); } catch(e) { return encoded; }
}

// ── State ────────────────────────────────────────────────────
let _apiKey = '';
let _baseUrl = '';
let _knowledge = '';
let _knowledgeP = null;   // 지식 로딩 Promise(백그라운드) — 전송 시 필요하면 대기
let _userType = 'student';
let _sessionCount = 0;
let _isSending = false;

// ── Init ─────────────────────────────────────────────────────
async function init() {
  // 설정과 지식을 동시에 요청(병렬) — Apps Script 왕복 지연을 한 번으로 단축
  const cfgP = fetch(`${GAS_URL}?action=getAmulboConfig`).then(r => r.json());
  _knowledgeP = fetch(`${GAS_URL}?action=getAmulboKnowledge`)
    .then(r => r.json())
    .then(kn => { if (kn && kn.ok && kn.knowledge) _knowledge = kn.knowledge; return _knowledge; })
    .catch(() => '');   // 지식은 선택사항

  try {
    const cfg = await cfgP;
    if (!cfg.ok || !cfg.enabled) { showUnavailable(); return; }

    // 공용 AI 제공자(클라우드) 설정 로드 — 메인 앱과 동일한 API 사용
    try { if (window.loadAIProvidersFromCloud) await window.loadAIProvidersFromCloud(); } catch (e) {}

    // 설정이 확인되면 지식 로딩을 기다리지 않고 즉시 화면 표시
    showMain();
  } catch (e) {
    console.error('Init failed:', e);
    showUnavailable();
  }
}

function showUnavailable() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('unavailableScreen').style.display = 'flex';
}

function showMain() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('mainContent').style.display = 'flex';
  document.getElementById('questionInput').focus();
}

// ── User type ────────────────────────────────────────────────
function selectUserType(type) {
  _userType = type;
  document.getElementById('btnStudent').classList.toggle('selected', type === 'student');
  document.getElementById('btnStaff').classList.toggle('selected', type === 'staff');
}

// ── Textarea auto-resize ──────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 240) + 'px';
}

// ── Key handler ───────────────────────────────────────────────
function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
}

// ── Send question ─────────────────────────────────────────────
async function sendQuestion() {
  if (_isSending) return;

  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) {
    input.focus();
    return;
  }

  _isSending = true;
  setSendingUI(true);

  const startMs = Date.now();

  // 지식이 백그라운드 로딩 중이면 잠깐 대기(이미 끝났으면 즉시 통과)
  if (!_knowledge && _knowledgeP) { try { await _knowledgeP; } catch (e) {} }

  // Create Q&A item
  const qaEl = createQAItem(question);
  document.getElementById('qaHistory').appendChild(qaEl);
  qaEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Clear input
  input.value = '';
  input.style.height = 'auto';

  try {
    let systemPrompt = `당신은 아세아항공직업전문학교(ASEA) 안내 도우미 "아물보"입니다.
학생과 교직원의 질문에 친절하고 명확하게 한국어로 답변하세요.
마크다운 기호(**, ##, -, \` 등) 사용 금지. 순수 텍스트만.
모르는 내용은 솔직히 모른다 하고 해당 부서 문의를 안내하세요.`;

    if (_knowledge) {
      systemPrompt += '\n\n[학교 지식기반]\n' + _knowledge;
    }

    const userMsg = (_userType === 'staff' ? '[교직원 문의] ' : '[학생 문의] ') + question;

    const body = {
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMsg }]
    };

    // 공용 AI 제공자(서버 프록시/공식/Flow) 경유 — 메인 앱과 동일 API
    const _call = window.claudeFetch
      ? window.claudeFetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      : fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const res = await _call;

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`API 오류 (${res.status}): ${errText}`);
    }

    const data = await res.json();
    const answerText = data.content?.[0]?.text || '답변을 받지 못했습니다.';
    const inputTokens  = data.usage?.input_tokens  || 0;
    const outputTokens = data.usage?.output_tokens || 0;
    const elapsedMs = Date.now() - startMs;

    // Typing effect
    await typeAnswer(qaEl, answerText);

    // Show feedback buttons
    showFeedback(qaEl);

    // Session counter
    _sessionCount++;
    updateCounter();

    // Log (fire-and-forget)
    logUsage({ userType: _userType, question, inputTokens, outputTokens, elapsedMs });

  } catch(e) {
    console.error('API error:', e);
    setAnswerText(qaEl, '⚠️ 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.\n(' + e.message + ')');
    showFeedback(qaEl);
  }

  setSendingUI(false);
  _isSending = false;
  input.focus();
}

// ── UI helpers ────────────────────────────────────────────────
function setSendingUI(loading) {
  const btn  = document.getElementById('sendBtn');
  const icon = document.getElementById('sendBtnIcon');
  const text = document.getElementById('sendBtnText');
  const input = document.getElementById('questionInput');

  btn.disabled  = loading;
  input.disabled = loading;

  if (loading) {
    icon.outerHTML = '<span class="send-spinner" id="sendBtnIcon"></span>';
    text.textContent = '답변 중...';
  } else {
    document.getElementById('sendBtnIcon').outerHTML = '<span id="sendBtnIcon">✈️</span>';
    text.textContent = '전송';
  }
}

function createQAItem(question) {
  const div = document.createElement('div');
  div.className = 'qa-item';

  const typeLabel = _userType === 'staff' ? '👔 교직원' : '🎓 학생';

  div.innerHTML = `
    <div class="qa-question">
      <span class="q-badge">${typeLabel}</span>
      <span>${escapeHtml(question)}</span>
    </div>
    <div class="qa-answer thinking" id="answer-${Date.now()}">생각하는 중... ✨</div>
    <div class="qa-footer" style="display:none;"></div>
  `;
  return div;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setAnswerText(qaEl, text) {
  const ansEl = qaEl.querySelector('.qa-answer');
  ansEl.classList.remove('thinking');
  ansEl.textContent = text;
}

async function typeAnswer(qaEl, fullText) {
  const ansEl = qaEl.querySelector('.qa-answer');
  ansEl.classList.remove('thinking');
  ansEl.textContent = '';

  // Add blinking cursor
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  ansEl.appendChild(cursor);

  let i = 0;
  const CHUNK = 3;
  const DELAY = 20;

  await new Promise(resolve => {
    const interval = setInterval(() => {
      if (i >= fullText.length) {
        clearInterval(interval);
        cursor.remove();
        ansEl.textContent = fullText;
        resolve();
        return;
      }
      const slice = fullText.slice(0, i + CHUNK);
      ansEl.textContent = slice;
      ansEl.appendChild(cursor);
      i += CHUNK;

      // Auto scroll
      qaEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, DELAY);
  });
}

function showFeedback(qaEl) {
  const footer = qaEl.querySelector('.qa-footer');
  footer.style.display = 'flex';

  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

  footer.innerHTML = `
    <div class="feedback-btns">
      <button class="feedback-btn" onclick="vote(this,'good')">👍 도움돼요</button>
      <button class="feedback-btn" onclick="vote(this,'bad')">👎 부족해요</button>
    </div>
    <span class="qa-meta">${timeStr}</span>
  `;
}

function vote(btn, type) {
  const container = btn.closest('.feedback-btns');
  container.querySelectorAll('.feedback-btn').forEach(b => {
    b.classList.remove('voted-good', 'voted-bad');
    b.disabled = false;
  });
  btn.classList.add(type === 'good' ? 'voted-good' : 'voted-bad');
  container.querySelectorAll('.feedback-btn').forEach(b => b.disabled = true);
}

function updateCounter() {
  const el = document.getElementById('sessionCounter');
  el.style.display = 'block';
  el.textContent = `이 화면에서 ${_sessionCount}건 질문`;
}

// ── Usage log ─────────────────────────────────────────────────
function logUsage({ userType, question, inputTokens, outputTokens, elapsedMs }) {
  try {
    const costUSD = (inputTokens * 0.80 + outputTokens * 4.00) / 1_000_000;
    const payload = {
      userType,
      question: question.slice(0, 100),
      inputTokens,
      outputTokens,
      costUSD: +costUSD.toFixed(8),
      elapsedMs
    };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    fetch(`${GAS_URL}?action=amulboLog&d=${encodeURIComponent(encoded)}`, { mode: 'no-cors' })
      .catch(() => {});
  } catch(e) { /* ignore */ }
}

// ── Start ─────────────────────────────────────────────────────
init();
</script>
