<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>입출입 체크인 — ASEA</title>
  <link rel="stylesheet" href="checkin.css">
</head>
<body>

  <!-- 오프라인 알림 -->
  <div id="offline-notice" class="offline-notice">
    📶 네트워크 연결이 끊겼습니다. 인터넷 연결 후 다시 시도해 주세요.
  </div>

  <!-- 페이지 헤더 -->
  <header class="page-header">
    <div class="page-logo">🏫 ASEA 입출입 관리</div>
    <div id="room-name" class="room-name">로딩 중...</div>
    <div id="room-location" class="room-location"></div>
  </header>

  <!-- ── 로딩 ── -->
  <div id="screen-loading">
    <div class="card loading">
      <div class="spinner"></div>
      공간 정보를 불러오는 중입니다...
    </div>
  </div>

  <!-- ── 공간 오류 ── -->
  <div id="screen-error-room" hidden>
    <div class="card" style="text-align:center;padding:32px 20px">
      <div style="font-size:48px;margin-bottom:12px">⚠️</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">공간을 찾을 수 없습니다</div>
      <div id="err-room-msg" style="font-size:14px;color:#5f6368">QR코드를 다시 스캔해 주세요.</div>
    </div>
  </div>

  <!-- ── 동의 + 정보입력 ── -->
  <div id="screen-consent" hidden>

    <!-- 동의 섹션 -->
    <div id="consent-section" class="card">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">👤 개인정보 수집 동의</div>
      <div style="font-size:13px;color:#5f6368;margin-bottom:14px">
        입출입 기록을 위해 개인정보 수집에 동의해 주세요.
      </div>

      <div class="consent-box" id="consent-text" style="white-space:pre-line"></div>

      <label class="consent-check-row">
        <input type="checkbox" id="consent-check">
        <span class="consent-check-label">
          위 개인정보 수집·이용에 <strong>동의합니다</strong> (필수)
        </span>
      </label>

      <button id="btn-consent-next" class="btn btn-primary" disabled>
        동의하고 계속 →
      </button>
    </div>

    <!-- 정보 입력 섹션 (동의 후 표시) -->
    <div id="info-section" class="card" hidden>
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">✏️ 정보 입력</div>
      <div style="font-size:13px;color:#5f6368;margin-bottom:18px">
        이 기기에 1회만 입력합니다. 이후에는 자동으로 인식됩니다.
      </div>

      <div id="error-msg" class="error-msg"></div>

      <div class="form-group">
        <label class="form-label" for="input-name">이름 <span class="req">*</span></label>
        <input id="input-name" type="text" class="form-input" placeholder="홍길동" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="input-phone">전화번호 <span class="req">*</span></label>
        <input id="input-phone" type="tel" class="form-input" placeholder="010-1234-5678" autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label" for="input-affil">소속 <span class="req">*</span></label>
        <input id="input-affil" type="text" class="form-input" placeholder="예: 항공정비계열 2학년" autocomplete="organization">
      </div>

      <button id="btn-info-submit" class="btn btn-primary">입력 완료 →</button>
    </div>

  </div>

  <!-- ── 입실/퇴실 ── -->
  <div id="screen-checkin" hidden>
    <div class="card">
      <div id="ci-user-name" class="user-greeting"></div>
      <div id="ci-user-sub" class="user-sub"></div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">
        <span id="ci-last-status" class="status-badge none">-</span>
        <span id="ci-last-time" style="font-size:13px;color:#5f6368"></span>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button id="btn-checkin"  class="btn btn-checkin">✅ 입실</button>
      <button id="btn-checkout" class="btn btn-checkout" hidden>🚪 퇴실</button>

      <button id="btn-change-user" class="btn btn-ghost" style="margin-top:16px;font-size:13px;color:#9e9e9e;border-color:#eeeeee">
        다른 사람으로 변경
      </button>
    </div>
  </div>

  <!-- ── 완료 결과 ── -->
  <div id="screen-result" hidden>
    <div class="card" style="text-align:center;padding:32px 20px">
      <div id="res-icon" class="result-icon"></div>
      <div id="res-title" class="result-title"></div>
      <div class="result-time" id="res-time"></div>
      <div class="result-sub">
        <strong id="res-room"></strong><br>
        <span id="res-user"></span>
      </div>
      <div style="margin-top:20px;font-size:13px;color:#bdbdbd">잠시 후 자동으로 이동합니다...</div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="page-footer">
    개인정보 처리방침 적용 중 · 수집 목적 외 사용 금지<br>
    문의: 관리실 내선 (담당자 확인)
  </footer>

  <script src="config.js?v=20260608s"></script>
  <script src="checkin.js?v=20260608s"></script>
</body>
</html>
