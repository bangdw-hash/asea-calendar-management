<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아세아 생활관 베타 현황판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F9FF;--card:#fff;--accent:#0EA5E9;--accent-dk:#0284C7;--accent-lt:#E0F2FE;--accent-text:#0369A1;
  --border:#BAE6FD;--text:#1e293b;--muted:#64748b;--ok:#16a34a;--warn:#ea580c;--danger:#dc2626;
  --r:6px;--sh:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 12px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--card);border-bottom:2px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-title{font-weight:700;font-size:15px;color:var(--accent-dk)}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px}
.badge-live{background:#dcfce7;color:#15803d;border:1px solid #86efac;padding:2px 10px;border-radius:var(--r);font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.live-dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.ftab{padding:6px 14px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:.15s}
.ftab.active{background:var(--accent-lt);color:var(--accent-text);border-color:var(--accent)}
.ftab:hover:not(.active){background:var(--bg)}
.search-box{padding:7px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;outline:none;font-family:inherit;flex:1;min-width:160px}
.search-box:focus{border-color:var(--accent)}
.sort-sel{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;outline:none;font-family:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.fb-item{padding:16px 18px;border-bottom:1px solid #f1f5f9;transition:.15s}
.fb-item:last-child{border-bottom:none}
.fb-item:hover{background:#f8fbff}
.fb-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.fb-label{font-weight:600;font-size:14px;flex:1;line-height:1.4}
.fb-desc{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;background:var(--bg);border-radius:var(--r);padding:10px 12px;margin:8px 0}
.fb-meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r);font-size:11px;font-weight:700;white-space:nowrap}
.badge-ok{background:#dcfce7;color:var(--ok)}
.badge-warn{background:#ffedd5;color:var(--warn)}
.badge-danger{background:#fee2e2;color:var(--danger)}
.badge-info{background:var(--accent-lt);color:var(--accent-text)}
.badge-gray{background:#f1f5f9;color:var(--muted)}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;line-height:2}
.refresh-bar{background:var(--accent-lt);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--accent-text);display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.refresh-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}
.progress-bar{background:var(--border);border-radius:4px;height:4px;overflow:hidden;margin-top:20px}
.progress-fill{background:var(--accent);height:100%;transition:width .5s;border-radius:4px}
.type-chart{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.type-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;flex:1;min-width:140px;box-shadow:var(--sh)}
.type-bar-fill{height:6px;border-radius:3px;margin-top:8px;transition:width .6s}
.link-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-decoration:none}
.link-back:hover{color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="white"><path d="M4 16V9l6-5 6 5v7h-4v-5H8v5z"/></svg></div>
    <div>
      <div class="logo-title">아세아 생활관 베타 현황판</div>
      <div class="logo-sub">Beta Feedback Dashboard — 누구나 열람 가능</div>
    </div>
  </div>
  <div class="badge-live"><div class="live-dot"></div>LIVE</div>
</div>

<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
    <div class="page-title">개발 피드백 이력</div>
    <a href="staff.html?demo=1" class="link-back">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M10 3L5 8l5 5"/></svg>관리 포털로
    </a>
  </div>
  <div class="page-desc">직원·테스터가 우클릭으로 등록한 피드백을 실시간으로 확인할 수 있습니다. 30초마다 자동 새로고침됩니다.</div>

  <div id="stats-row" class="stats-row"></div>
  <div id="type-chart" class="type-chart"></div>

  <div class="refresh-bar">
    <span id="refresh-txt">마지막 업데이트: 불러오는 중…</span>
    <button class="refresh-btn" onclick="load()">↺ 지금 새로고침</button>
  </div>

  <div class="filters">
    <div class="ftab active" data-f="all" onclick="setFilter('all',this)">전체</div>
    <div class="ftab" data-f="open" onclick="setFilter('open',this)">접수</div>
    <div class="ftab" data-f="planned" onclick="setFilter('planned',this)">예정</div>
    <div class="ftab" data-f="done" onclick="setFilter('done',this)">완료</div>
    <div class="ftab" data-f="restrict" onclick="setTypeFilter('restrict',this)">기능 제한</div>
    <div class="ftab" data-f="inconvenient" onclick="setTypeFilter('inconvenient',this)">불편</div>
    <div class="ftab" data-f="improve" onclick="setTypeFilter('improve',this)">개선 요청</div>
    <div class="spacer" style="flex:1"></div>
    <input class="search-box" id="search" type="text" placeholder="키워드 검색…" oninput="render()">
    <select class="sort-sel" id="sort-sel" onchange="render()">
      <option value="newest">최신순</option>
      <option value="oldest">오래된순</option>
      <option value="type">유형순</option>
    </select>
  </div>

  <div class="card" id="fb-list"></div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:100%"></div></div>
  <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--muted)">
    피드백은 <b>아세아 생활관 통합관리 포털</b>에서 우클릭으로 등록합니다. 등록 후 이 페이지에 즉시 반영됩니다.
  </div>
</div>

<script>
'use strict';
const SB='https://zbpeyklwpotjyveipzxd.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
const FTYPE={restrict:{cls:'badge-danger',lbl:'기능 제한',color:'#dc2626'},inconvenient:{cls:'badge-warn',lbl:'불편',color:'#ea580c'},improve:{cls:'badge-info',lbl:'개선 요청',color:'#0EA5E9'}};
const FSTATUS={open:{cls:'badge-warn',lbl:'접수'},planned:{cls:'badge-info',lbl:'예정'},done:{cls:'badge-ok',lbl:'완료'},wontfix:{cls:'badge-gray',lbl:'보류'}};

let ALL=[];let curStatus='all';let curType='all';let PROG_IV;

async function rpc(fn,p={}){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
    body:JSON.stringify(p)});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

async function load(){
  try{
    const d=await rpc('dorm_list_feedback',{p_status:null});
    ALL=Array.isArray(d)?d:[];
  }catch(e){
    ALL=[];
  }
  document.getElementById('refresh-txt').textContent='마지막 업데이트: '+new Date().toLocaleTimeString('ko-KR');
  renderStats();
  render();
  resetProgress();
}

function renderStats(){
  const total=ALL.length;
  const byType={restrict:0,inconvenient:0,improve:0};
  const byStatus={open:0,planned:0,done:0,wontfix:0};
  ALL.forEach(f=>{byType[f.type]=(byType[f.type]||0)+1;byStatus[f.status]=(byStatus[f.status]||0)+1;});
  document.getElementById('stats-row').innerHTML=`
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">전체 피드백</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--warn)">${byStatus.open||0}</div><div class="stat-lbl">접수 대기</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--accent)">${byStatus.planned||0}</div><div class="stat-lbl">개발 예정</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--ok)">${byStatus.done||0}</div><div class="stat-lbl">완료</div></div>
  `;
  document.getElementById('type-chart').innerHTML=Object.entries(FTYPE).map(([k,v])=>{
    const n=byType[k]||0;const pct=total?Math.round(n/total*100):0;
    return`<div class="type-bar"><div style="font-size:12px;font-weight:700;color:${v.color}">${v.lbl}</div>
      <div style="font-size:20px;font-weight:700;margin:2px 0">${n}<span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:4px">(${pct}%)</span></div>
      <div class="type-bar-fill" style="background:${v.color};width:${pct}%"></div>
    </div>`;
  }).join('');
}

function setFilter(f,el){
  curStatus=f;curType='all';
  document.querySelectorAll('.ftab').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');render();
}
function setTypeFilter(f,el){
  curType=f;curStatus='all';
  document.querySelectorAll('.ftab').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');render();
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const sort=document.getElementById('sort-sel').value;
  let list=[...ALL];
  if(curStatus!=='all')list=list.filter(f=>f.status===curStatus);
  if(curType!=='all')list=list.filter(f=>f.type===curType);
  if(q)list=list.filter(f=>`${f.label||''} ${f.description||''} ${f.page||''}`.toLowerCase().includes(q));
  if(sort==='oldest')list.reverse();
  else if(sort==='type')list.sort((a,b)=>a.type.localeCompare(b.type));
  const el=document.getElementById('fb-list');
  if(!list.length){el.innerHTML='<div class="empty">등록된 피드백이 없습니다.<br>관리 포털에서 메뉴·버튼을 우클릭하면 등록됩니다.</div>';return;}
  el.innerHTML=list.map(f=>{
    const ft=FTYPE[f.type]||{cls:'badge-gray',lbl:f.type};
    const fs=FSTATUS[f.status]||{cls:'badge-gray',lbl:f.status};
    const dt=new Date(f.created_at);
    const dtStr=`${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    return`<div class="fb-item">
      <div class="fb-hdr">
        <span class="badge ${ft.cls}">${ft.lbl}</span>
        <span class="fb-label">${esc(f.label)}</span>
        <span class="badge ${fs.cls}">${fs.lbl}</span>
      </div>
      ${f.description?`<div class="fb-desc">${esc(f.description)}</div>`:'<div style="font-size:12px;color:var(--muted);margin:4px 0 6px;font-style:italic">설명 없음</div>'}
      <div class="fb-meta">
        <span>📍 ${esc(f.page||'—')}</span>
        <span>🕐 ${dtStr}</span>
        <span>#${f.id}</span>
      </div>
    </div>`;
  }).join('');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let progVal=100;
function resetProgress(){
  clearInterval(PROG_IV);
  progVal=100;
  document.getElementById('prog').style.width='100%';
  PROG_IV=setInterval(()=>{
    progVal-=(100/30);
    document.getElementById('prog').style.width=Math.max(0,progVal)+'%';
    if(progVal<=0){load();}
  },1000);
}

load();
</script>
</body>
</html>
