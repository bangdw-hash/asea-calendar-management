<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>생활관 입소자 포털</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: light;
  --navy: #1a3a5c;
  --navy-dk: #122845;
  --bg: #F0F9FF;
  --primary: #1A73E8;
  --primary-lt: #E8F0FE;
  --green: #16a34a;
  --green-lt: #dcfce7;
  --orange: #ea580c;
  --orange-lt: #ffedd5;
  --red: #dc2626;
  --red-lt: #fee2e2;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --r: 6px;
  --sh: 0 1px 3px rgba(0,0,0,.10);
  --sh-md: 0 4px 12px rgba(0,0,0,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--primary); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* ── Header ── */
.hd {
  background: var(--navy);
  color: #fff;
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.hd-title { font-size: 15px; font-weight: 700; flex: 1; }
.hd-badge {
  background: rgba(255,255,255,.18);
  border-radius: var(--r);
  padding: 3px 9px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.hd-logout {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--r);
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 600;
}
.hd-logout:hover { background: rgba(255,255,255,.25); }

/* ── Main container ── */
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 14px 60px;
}

/* ── Card ── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--sh);
}

/* ── Feature card grid ── */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media(min-width:520px) { .card-grid { grid-template-columns: 1fr 1fr 1fr; } }
.feat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  box-shadow: var(--sh);
  transition: box-shadow .15s, transform .12s;
  position: relative;
}
.feat-card:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
.feat-card:active { transform: translateY(0); }
.feat-card .icon-wrap {
  width: 40px; height: 40px;
  border-radius: var(--r);
  background: var(--primary-lt);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.feat-card .icon-wrap.green { background: var(--green-lt); }
.feat-card .icon-wrap.orange { background: var(--orange-lt); }
.feat-card .icon-wrap.red { background: var(--red-lt); }
.feat-card .icon-wrap.navy { background: #e8eef4; }
.feat-card h3 { font-size: 13px; font-weight: 700; color: var(--text); }
.feat-card p { font-size: 11px; color: var(--muted); line-height: 1.4; }
.feat-card .arrow {
  position: absolute; top: 12px; right: 12px;
  color: var(--muted);
}

/* ── Section header ── */
.sec-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.back-btn {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  display: flex; align-items: center; gap: 5px;
}
.sec-title { font-size: 16px; font-weight: 700; color: var(--navy); }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid #eef1f4; padding: 8px 9px; text-align: left; }
th { background: #f8fafc; color: #475569; font-size: 12px; font-weight: 600; }
tr:last-child td { border-bottom: none; }

/* ── Badge ── */
.badge {
  display: inline-block;
  font-size: 11px; font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--r);
  background: var(--primary-lt);
  color: var(--primary);
}
.badge.green { background: var(--green-lt); color: var(--green); }
.badge.orange { background: var(--orange-lt); color: var(--orange); }
.badge.red { background: var(--red-lt); color: var(--red); }
.badge.navy { background: #e8eef4; color: var(--navy); }

/* ── Form ── */
label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin: 12px 0 4px; }
label:first-child { margin-top: 0; }
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #d1d5db;
  border-radius: var(--r);
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: #fff;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
}
textarea { resize: vertical; min-height: 90px; }

/* ── Buttons ── */
.btn {
  display: block;
  width: 100%;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  margin-top: 14px;
}
.btn:hover { background: var(--navy-dk); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); }
.btn.primary:hover { background: #1557B0; }
.btn.danger { background: var(--red); }
.btn.sec {
  background: #fff;
  color: var(--navy);
  border: 1.5px solid #cdd9e6;
}

/* ── Error / muted ── */
.err { color: var(--red); font-size: 13px; margin-top: 8px; }
.muted { font-size: 12px; color: var(--muted); line-height: 1.6; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

/* ── Login ── */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px 14px;
  background: var(--bg);
}
.login-box {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px 22px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--sh-md);
}
.login-logo {
  background: var(--navy);
  border-radius: var(--r);
  padding: 16px;
  text-align: center;
  color: #fff;
  margin-bottom: 20px;
}
.login-logo h1 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.login-logo p { font-size: 12px; opacity: .8; }

/* ── Notice accordion ── */
.notice-item {
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.notice-item:last-child { border-bottom: none; }
.notice-hd {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  cursor: pointer;
  gap: 10px;
}
.notice-hd h3 { font-size: 13px; font-weight: 600; flex: 1; }
.notice-hd .nd { font-size: 11px; color: var(--muted); white-space: nowrap; }
.notice-body { display: none; margin-top: 8px; font-size: 13px; white-space: pre-wrap; color: #374151; line-height: 1.7; }
.notice-body.open { display: block; }

/* ── Info rows ── */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
  gap: 8px;
}
.info-row:last-child { border-bottom: none; }
.info-row .lbl { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.info-row .val { font-weight: 600; text-align: right; }

/* ── Success screen ── */
.success-box { text-align: center; padding: 28px 0; }
.success-box svg { color: var(--green); margin-bottom: 10px; }
.success-box h2 { font-size: 16px; color: var(--navy); margin-bottom: 6px; }
.success-box p { font-size: 13px; color: var(--muted); }
.success-ticket { font-size: 22px; font-weight: 700; color: var(--primary); margin: 10px 0; }

/* ── Confirm dialog ── */
.confirm-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: #fff;
  border-radius: var(--r);
  padding: 24px 20px;
  max-width: 340px;
  width: 100%;
  box-shadow: var(--sh-md);
}
.confirm-box h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--navy); }
.confirm-box p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.confirm-btns { display: flex; gap: 8px; }
.confirm-btns button { flex: 1; padding: 11px; border-radius: var(--r); font-size: 14px; font-weight: 700; border: none; }
.confirm-btns .cancel { background: #f1f5f9; color: var(--text); }
.confirm-btns .ok { background: var(--navy); color: #fff; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>생활관 입소자 포털</h1>
      <p>아세아항공직업전문학교 기숙사</p>
    </div>
    <label>학번 / 사번</label>
    <input type="text" id="li-sno" placeholder="학번 또는 사번을 입력하세요" autocomplete="off">
    <label>성명</label>
    <input type="text" id="li-name" placeholder="이름을 입력하세요">
    <div class="err" id="li-err" style="display:none"></div>
    <button class="btn primary" id="li-btn" style="margin-top:16px">확인</button>
    <p class="muted" style="margin-top:12px;text-align:center">등록된 학번과 성명으로 본인 계약·납부·고지서를 조회합니다.</p>
  </div>
</div>

<!-- Main Portal (hidden until login) -->
<div id="portal" style="display:none">
  <header class="hd">
    <span class="hd-title">생활관 입소자 포털</span>
    <span class="hd-badge" id="hd-room"></span>
    <button class="hd-logout" id="hd-logout">로그아웃</button>
  </header>
  <div class="wrap" id="main-wrap"></div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="cancel" id="confirm-cancel">취소</button>
      <button class="ok" id="confirm-ok">확인</button>
    </div>
  </div>
</div>

<script>
'use strict';
var SUPA_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
var db = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;

var ME = null; // resident data

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function won(n) { return (Number(n)||0).toLocaleString('ko-KR'); }
function fmtDate(s) { return s ? String(s).slice(0,10) : '-'; }

// ── Confirm dialog ──
function confirm(title, msg) {
  return new Promise(function(resolve) {
    var ov = document.getElementById('confirm-overlay');
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    ov.classList.add('open');
    function cleanup() { ov.classList.remove('open'); }
    document.getElementById('confirm-ok').onclick = function() { cleanup(); resolve(true); };
    document.getElementById('confirm-cancel').onclick = function() { cleanup(); resolve(false); };
  });
}

// ── Init ──
(async function init() {
  if (!db) { showErr('Supabase 연결 실패. 관리자에게 문의하세요.'); return; }

  // Check URL token auto-login
  var params = new URLSearchParams(location.search);
  var rt = params.get('rt');
  if (rt) {
    try {
      var r = await db.rpc('dorm_resident_token_login', { p_token: rt });
      if (!r.error && r.data) {
        ME = r.data;
        showPortal();
        return;
      }
    } catch(e) {}
  }

  // Check sessionStorage
  try {
    var stored = sessionStorage.getItem('dorm_resident');
    if (stored) { ME = JSON.parse(stored); showPortal(); return; }
  } catch(e) {}

  // Show login
  document.getElementById('login-screen').style.display = 'flex';
  setupLogin();
})();

function showErr(msg) {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('li-err').textContent = msg;
  document.getElementById('li-err').style.display = 'block';
}

function setupLogin() {
  document.getElementById('li-btn').addEventListener('click', async function() {
    var sno = (document.getElementById('li-sno').value || '').trim();
    var name = (document.getElementById('li-name').value || '').trim();
    var errEl = document.getElementById('li-err');
    errEl.style.display = 'none';
    if (!sno || !name) { errEl.textContent = '학번과 성명을 입력하세요.'; errEl.style.display = 'block'; return; }
    this.disabled = true; this.textContent = '조회 중…';
    try {
      var r = await db.rpc('dorm_resident_lookup_v2', { p_student_no: sno, p_name: name });
      if (r.error) throw new Error(r.error.message);
      if (!r.data) { errEl.textContent = '일치하는 정보가 없습니다. 학번과 성명을 확인하세요.'; errEl.style.display = 'block'; return; }
      ME = r.data;
      try { sessionStorage.setItem('dorm_resident', JSON.stringify(ME)); } catch(e) {}
      showPortal();
    } catch(e) {
      errEl.textContent = '조회 실패: ' + e.message;
      errEl.style.display = 'block';
    } finally {
      this.disabled = false; this.textContent = '확인';
    }
  });

  ['li-sno','li-name'].forEach(function(id) {
    document.getElementById(id).addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('li-btn').click();
    });
  });
}

function showPortal() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  var room = (ME.building || '') + (ME.room ? ' ' + ME.room + '호' : '');
  document.getElementById('hd-room').textContent = (ME.name || '') + (room ? ' · ' + room : '');
  document.getElementById('hd-logout').addEventListener('click', function() {
    try { sessionStorage.removeItem('dorm_resident'); } catch(e) {}
    ME = null;
    document.getElementById('portal').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('li-sno').value = '';
    document.getElementById('li-name').value = '';
    setupLogin();
  });
  renderHome();
}

// ── SVG Icons ──
var ICONS = {
  contract: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>',
  payment: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
  bill: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9,11 12,14 22,4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  complaint: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  notice: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  moveout: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  sign: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  penalty: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15,18 9,12 15,6"/></svg>',
  arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9,18 15,12 9,6"/></svg>'
};

// ── Home (card grid) ──
function renderHome() {
  var w = document.getElementById('main-wrap');
  var cards = [
    { id:'contract', icon:'contract', iconColor:'', title:'내 계약 정보', desc:'입소 계약 및 호실 확인' },
    { id:'payment',  icon:'payment',  iconColor:'', title:'납부 내역',    desc:'기숙사비 납부 현황' },
    { id:'bill',     icon:'bill',     iconColor:'green', title:'고지서',  desc:'납부 고지서 조회' },
    { id:'complaint',icon:'complaint',iconColor:'orange', title:'민원 접수', desc:'시설·생활 민원 신청' },
    { id:'notice',   icon:'notice',   iconColor:'', title:'공지사항',    desc:'생활관 공지 확인' },
    { id:'moveout',  icon:'moveout',  iconColor:'orange', title:'퇴실 신청', desc:'퇴실 일자 및 사유 신청' },
    { id:'sign',     icon:'sign',     iconColor:'navy', title:'계약서 서명', desc:'전자서명 계약 체결' },
    { id:'penalty',  icon:'penalty',  iconColor:'red', title:'벌점 내역',   desc:'누적 벌점 조회' }
  ];
  w.innerHTML = '<div class="card-grid">' +
    cards.map(function(c) {
      return '<div class="feat-card" data-sec="' + c.id + '">' +
        '<div class="icon-wrap ' + c.iconColor + '">' + ICONS[c.icon] + '</div>' +
        '<h3>' + esc(c.title) + '</h3>' +
        '<p>' + esc(c.desc) + '</p>' +
        '<span class="arrow">' + ICONS.arrow + '</span>' +
      '</div>';
    }).join('') +
  '</div>';

  w.querySelectorAll('.feat-card').forEach(function(el) {
    el.addEventListener('click', function() {
      var sec = this.dataset.sec;
      SECTIONS[sec] && SECTIONS[sec]();
    });
  });
}

function secHeader(title) {
  return '<div class="sec-hd"><button class="back-btn" id="back-btn">' + ICONS.back + ' 홈</button><span class="sec-title">' + esc(title) + '</span></div>';
}
function setWrap(html) {
  var w = document.getElementById('main-wrap');
  w.innerHTML = html;
  var bb = document.getElementById('back-btn');
  if (bb) bb.addEventListener('click', renderHome);
}

// ── Sections ──
var SECTIONS = {

  contract: function() {
    var cs = (ME.contracts) || [];
    var rows = cs.length ? cs.map(function(c) {
      var statusMap = {active:'<span class="badge green">입소 중</span>', ended:'<span class="badge navy">퇴실</span>', pending:'<span class="badge orange">대기</span>'};
      var badge = statusMap[c.status] || '<span class="badge">' + esc(c.status||'-') + '</span>';
      return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
          '<b style="font-size:15px">' + esc((c.building||'') + ' ' + (c.room||'') + '호') + '</b>' + badge +
        '</div>' +
        '<div class="info-row"><span class="lbl">입소 기간</span><span class="val">' + fmtDate(c.start) + ' ~ ' + fmtDate(c.end) + '</span></div>' +
        '<div class="info-row"><span class="lbl">계약 유형</span><span class="val">' + esc(c.type||'-') + '</span></div>' +
        '<div class="info-row"><span class="lbl">월 기숙사비</span><span class="val">' + won(c.unit_price) + '원</span></div>' +
        (c.deposit ? '<div class="info-row"><span class="lbl">보증금</span><span class="val">' + won(c.deposit) + '원</span></div>' : '') +
        (c.attachment ? '<div style="margin-top:10px"><a href="' + esc(c.attachment) + '" target="_blank" style="font-size:13px;color:var(--primary)">계약서 보기 →</a></div>' : '') +
      '</div>';
    }).join('') : '<div class="card"><p class="empty">등록된 계약 정보가 없습니다.</p></div>';
    setWrap(secHeader('내 계약 정보') + rows);
  },

  payment: function() {
    var ps = (ME.payments) || [];
    var today = new Date().toISOString().slice(0,10);
    var rows = ps.length ? ps.map(function(p) {
      var od = p.status !== 'paid' && p.due_date && p.due_date < today;
      var badge = p.status === 'paid'
        ? '<span class="badge green">완납</span>'
        : (od ? '<span class="badge red">연체</span>' : '<span class="badge">미납</span>');
      return '<tr><td>' + esc(p.period||'-') + '</td><td>' + won(p.amount) + '원</td><td>' + fmtDate(p.due_date) + '</td><td>' + badge + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">납부 내역이 없습니다.</td></tr>';
    setWrap(secHeader('납부 내역') +
      '<div class="card"><div class="tbl-wrap"><table>' +
        '<thead><tr><th>기간</th><th>금액</th><th>납부기한</th><th>상태</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div></div>');
  },

  bill: function() {
    var bs = (ME.utility_bills) || (ME.notices_bill) || [];
    var rows = bs.length ? bs.map(function(b) {
      var badge = b.status === 'paid' ? '<span class="badge green">완납</span>' : '<span class="badge">미납</span>';
      return '<tr><td>' + esc(b.notice_no||'-') + '</td><td>' + esc(b.semester||'-') + '</td><td>' + won(b.amount) + '원</td><td>' + fmtDate(b.due_date) + '</td><td>' + badge + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">발행된 고지서가 없습니다.</td></tr>';
    setWrap(secHeader('고지서') +
      '<div class="card"><div class="tbl-wrap"><table>' +
        '<thead><tr><th>고지번호</th><th>학기</th><th>금액</th><th>마감</th><th>상태</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div></div>');
  },

  complaint: function() {
    setWrap(secHeader('민원 접수') +
      '<div class="card" id="complaint-wrap">' +
        '<label>분류</label>' +
        '<select id="mc-cat">' +
          '<option>시설 하자(누수·파손·고장)</option>' +
          '<option>생활 환경(냄새·소음·위생)</option>' +
          '<option>냉·난방</option>' +
          '<option>인터넷·전기</option>' +
          '<option>동료 입소자 관련</option>' +
          '<option>기타</option>' +
        '</select>' +
        '<label>제목</label><input id="mc-title" placeholder="민원 제목을 입력하세요">' +
        '<label>내용</label><textarea id="mc-content" placeholder="구체적인 상황을 입력하세요 (최대 500자)" maxlength="500"></textarea>' +
        '<div class="err" id="mc-err" style="display:none"></div>' +
        '<button class="btn primary" id="mc-btn">접수하기</button>' +
      '</div>');

    document.getElementById('mc-btn').addEventListener('click', async function() {
      var title = (document.getElementById('mc-title').value||'').trim();
      var content = (document.getElementById('mc-content').value||'').trim();
      var errEl = document.getElementById('mc-err');
      errEl.style.display = 'none';
      if (!title || !content) { errEl.textContent = '제목과 내용을 모두 입력하세요.'; errEl.style.display = 'block'; return; }
      this.disabled = true; this.textContent = '접수 중…';
      try {
        var r = await db.rpc('dorm_complaint_submit', {
          p_resident_id: ME.resident_id,
          p_category: document.getElementById('mc-cat').value,
          p_title: title,
          p_content: content
        });
        if (r.error) throw new Error(r.error.message);
        var ticket = r.data && (r.data.ticket_no || r.data);
        document.getElementById('complaint-wrap').innerHTML =
          '<div class="success-box">' +
            '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
            '<h2>민원이 접수되었습니다</h2>' +
            (ticket ? '<div class="success-ticket">접수번호: ' + esc(ticket) + '</div>' : '') +
            '<p>처리 현황은 담당자가 확인 후 연락드립니다.</p>' +
          '</div>';
      } catch(e) {
        errEl.textContent = '접수 실패: ' + e.message;
        errEl.style.display = 'block';
        this.disabled = false; this.textContent = '접수하기';
      }
    });
  },

  notice: async function() {
    setWrap(secHeader('공지사항') + '<div class="card" id="notice-list"><p class="muted">불러오는 중…</p></div>');
    try {
      var r = await db.from('dorm.notices').select('id,title,content,created_at').order('created_at', {ascending:false}).limit(20);
      var list = document.getElementById('notice-list');
      if (r.error) throw new Error(r.error.message);
      var items = r.data || [];
      if (!items.length) { list.innerHTML = '<p class="empty">등록된 공지사항이 없습니다.</p>'; return; }
      list.innerHTML = items.map(function(n, i) {
        return '<div class="notice-item">' +
          '<div class="notice-hd" data-i="' + i + '">' +
            '<h3>' + esc(n.title) + '</h3>' +
            '<span class="nd">' + fmtDate(n.created_at) + '</span>' +
          '</div>' +
          '<div class="notice-body" id="nb-' + i + '">' + esc(n.content||'') + '</div>' +
        '</div>';
      }).join('');
      list.querySelectorAll('.notice-hd').forEach(function(hd) {
        hd.addEventListener('click', function() {
          var b = document.getElementById('nb-' + this.dataset.i);
          if (b) b.classList.toggle('open');
        });
      });
    } catch(e) {
      document.getElementById('notice-list').innerHTML = '<p class="err">불러오기 실패: ' + esc(e.message) + '</p>';
    }
  },

  moveout: function() {
    setWrap(secHeader('퇴실 신청') +
      '<div class="card">' +
        '<p class="muted" style="margin-bottom:14px">희망 퇴실일과 사유를 입력하면 관리자 검토 후 처리됩니다.</p>' +
        '<label>희망 퇴실일</label><input type="date" id="mo-date">' +
        '<label>사유</label><textarea id="mo-reason" placeholder="퇴실 사유를 입력하세요" maxlength="500"></textarea>' +
        '<div class="err" id="mo-err" style="display:none"></div>' +
        '<button class="btn danger" id="mo-btn" style="margin-top:16px">퇴실 신청</button>' +
      '</div>');

    document.getElementById('mo-btn').addEventListener('click', async function() {
      var date = document.getElementById('mo-date').value;
      var reason = (document.getElementById('mo-reason').value||'').trim();
      var errEl = document.getElementById('mo-err');
      errEl.style.display = 'none';
      if (!date) { errEl.textContent = '희망 퇴실일을 선택하세요.'; errEl.style.display = 'block'; return; }
      var ok = await confirm('퇴실 신청 확인', '희망 퇴실일 ' + date + '로 퇴실을 신청하시겠습니까? 관리자 승인 후 처리됩니다.');
      if (!ok) return;
      this.disabled = true; this.textContent = '신청 중…';
      try {
        var r = await db.rpc('dorm_complaint_submit', {
          p_resident_id: ME.resident_id,
          p_category: '퇴실신청',
          p_title: '퇴실 신청 (' + date + ')',
          p_content: '희망 퇴실일: ' + date + '\n사유: ' + (reason||'(미입력)')
        });
        if (r.error) throw new Error(r.error.message);
        var ticket = r.data && (r.data.ticket_no || r.data);
        document.querySelector('#main-wrap .card').innerHTML =
          '<div class="success-box">' +
            '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
            '<h2>퇴실 신청 완료</h2>' +
            (ticket ? '<div class="success-ticket">접수번호: ' + esc(ticket) + '</div>' : '') +
            '<p>관리자 승인 후 처리됩니다. 이의가 있을 경우 담당자에게 문의하세요.</p>' +
          '</div>';
      } catch(e) {
        errEl.textContent = '신청 실패: ' + e.message;
        errEl.style.display = 'block';
        this.disabled = false; this.textContent = '퇴실 신청';
      }
    });
  },

  sign: function() {
    var signToken = ME.sign_token;
    var signStatus = ME.sign_status;
    var html = secHeader('계약서 서명');
    if (signStatus === 'signed') {
      html += '<div class="card"><div class="success-box">' +
        '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
        '<h2>서명이 완료되었습니다</h2>' +
        '<p>입소 계약서 전자서명이 정상 처리되었습니다.</p>' +
      '</div></div>';
    } else if (signToken) {
      var signUrl = 'contract-sign.html?t=' + encodeURIComponent(signToken);
      html += '<div class="card">' +
        '<p style="margin-bottom:14px">입소 계약서 전자서명이 필요합니다. 아래 버튼을 눌러 서명을 완료하세요.</p>' +
        '<a href="' + esc(signUrl) + '" class="btn primary" style="display:block;text-align:center;text-decoration:none;line-height:1.5;padding:13px">계약서 서명하기</a>' +
      '</div>';
    } else {
      html += '<div class="card"><p class="empty">서명 대기 중인 계약서가 없습니다.<br>관리자에게 문의하세요.</p></div>';
    }
    setWrap(html);
  },

  penalty: function() {
    var ps = (ME.penalties) || [];
    var total = ps.reduce(function(s, p) { return s + (Number(p.points)||0); }, 0);
    var rows = ps.length ? ps.map(function(p) {
      return '<tr><td>' + fmtDate(p.date||p.created_at) + '</td><td>' + esc(p.rule||p.description||'-') + '</td><td style="color:var(--red);font-weight:700">+' + esc(p.points||0) + '점</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">벌점 내역이 없습니다.</td></tr>';
    setWrap(secHeader('벌점 내역') +
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
          '<span class="muted">누적 벌점</span>' +
          '<span style="font-size:22px;font-weight:700;color:' + (total >= 10 ? 'var(--red)' : total >= 5 ? 'var(--orange)' : 'var(--text)') + '">' + total + '점</span>' +
        '</div>' +
        '<div class="tbl-wrap"><table>' +
          '<thead><tr><th>일자</th><th>규칙</th><th>점수</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>' +
      '</div>');
  }
};
</script>
</body>
</html>
