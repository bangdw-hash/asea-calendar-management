<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>주간업무보고서 · ASEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!--
  ── Supabase 초기 설정 SQL (최초 1회 실행) ──────────────────────
  Supabase 대시보드 → SQL Editor에서 아래 SQL을 실행하세요.

  CREATE TABLE IF NOT EXISTS weekly_dept_members (
    id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    email TEXT NOT NULL UNIQUE,
    dept  TEXT NOT NULL,
    display_name TEXT,
    created_at TIMESTAMPTZ DEFAULT NOW()
  );

  CREATE TABLE IF NOT EXISTS weekly_reports (
    id         BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    dept       TEXT NOT NULL,
    week_key   TEXT NOT NULL,
    week_start DATE NOT NULL,
    week_end   DATE NOT NULL,
    report_data JSONB NOT NULL DEFAULT '{}',
    created_by  TEXT,
    updated_by  TEXT,
    created_at  TIMESTAMPTZ DEFAULT NOW(),
    updated_at  TIMESTAMPTZ DEFAULT NOW(),
    UNIQUE(dept, week_key)
  );

  ALTER TABLE weekly_dept_members ENABLE ROW LEVEL SECURITY;
  ALTER TABLE weekly_reports      ENABLE ROW LEVEL SECURITY;

  CREATE POLICY "anon_all_dm" ON weekly_dept_members FOR ALL TO anon USING (true) WITH CHECK (true);
  CREATE POLICY "anon_all_wr" ON weekly_reports      FOR ALL TO anon USING (true) WITH CHECK (true);

  -- Storage bucket 생성 (Supabase Storage 탭 → New bucket → weekly-images, Public)
  ────────────────────────────────────────────────────────────────
-->

<style>
/*──── Reset & Variables ────*/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --primary:#1A73E8;--primary-dk:#1557B0;--primary-lt:#E8F0FE;
  --green:#16a34a;--green-lt:#dcfce7;
  --orange:#ea580c;--orange-lt:#ffedd5;
  --red:#dc2626;--red-lt:#fee2e2;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g700:#374151;--g900:#111827;
  --r:6px;
  --sh:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --sh-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --sh-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --font:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;
  --header-h:52px;
}
html,body{min-height:100%;font-family:var(--font);font-size:14px;background:#F0F9FF;color:var(--g900);-webkit-font-smoothing:antialiased;line-height:1.55}

/*──── Header ────*/
.hdr{height:var(--header-h);background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.hdr-logo{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.hdr-sub{font-size:11px;color:var(--g500);white-space:nowrap}
.hdr-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.user-badge{font-size:11px;color:var(--g500);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/*──── Buttons ────*/
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background .15s;text-decoration:none;white-space:nowrap;font-family:var(--font)}
.btn:active{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover:not(:disabled){background:var(--primary-dk)}
.btn-ghost{background:transparent;color:var(--g500);border-color:var(--g200)}
.btn-ghost:hover{background:var(--g100);color:var(--g700)}
.btn-danger{background:var(--red-lt);color:var(--red);border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--r)}

/*──── Views ────*/
.view{display:none}.view.active{display:block}
#app-wrap{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

/*──── Login View ────*/
#v-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - var(--header-h));padding:32px 16px}
.login-card{background:#fff;border-radius:12px;padding:40px 32px;box-shadow:var(--sh-lg);text-align:center;max-width:420px;width:100%}
.login-logo{font-size:42px;margin-bottom:16px}
.login-title{font-size:20px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--g500);margin-bottom:28px;line-height:1.7}
.g-signin-wrap{display:flex;justify-content:center}

/*──── Dept View ────*/
#v-dept{max-width:700px;margin:0 auto;padding:24px 16px}
.section-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--g900)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dept-card{background:#fff;border:2px solid var(--g200);border-radius:var(--r);padding:14px 12px;cursor:pointer;transition:all .15s;text-align:center;font-weight:500;font-size:13px}
.dept-card:hover{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
.dept-card.locked{background:var(--primary-lt);border-color:var(--primary);color:var(--primary);cursor:default}
.dept-card.locked::after{content:"내 부서";display:block;font-size:10px;font-weight:400;color:var(--primary);margin-top:3px}
.admin-entry{margin-top:20px;padding-top:20px;border-top:1px solid var(--g200)}

/*──── Week View ────*/
#v-week{max-width:540px;margin:0 auto;padding:24px 16px}
.week-list{display:flex;flex-direction:column;gap:8px}
.week-item{background:#fff;border:2px solid var(--g200);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
.week-item:hover{border-color:var(--primary);background:var(--primary-lt)}
.week-item.current{border-color:var(--green);background:var(--green-lt)}
.week-item .wk-label{font-weight:600;font-size:14px}
.week-item .wk-range{font-size:12px;color:var(--g500)}
.week-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--green);color:#fff}
.week-item.has-data .wk-range::after{content:" ·저장됨";color:var(--primary)}

/*──── Form View ────*/
#v-form{max-width:960px;margin:0 auto;padding:16px}
.form-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.form-toolbar-left{display:flex;gap:8px;align-items:center;flex:1;min-width:0;overflow:hidden}
.dept-label{font-weight:700;font-size:15px;color:var(--g900);white-space:nowrap}
.week-label{font-size:13px;color:var(--g500)}
.save-indicator{font-size:11px;color:var(--g400);margin-left:auto}
.save-indicator.saving{color:var(--orange)}
.save-indicator.saved{color:var(--green)}
.save-indicator.error{color:var(--red)}

/*──── Report Sheet ────*/
.report-sheet{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:0;overflow:hidden}
.report-header{background:var(--g900);color:#fff;padding:12px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.report-title{font-size:16px;font-weight:700;letter-spacing:.5px}
.report-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:rgba(255,255,255,.75)}
.report-meta span{white-space:nowrap}
.meta-val{color:#fff;font-weight:500}

.report-body{padding:0}
.report-section{border-bottom:1px solid var(--g200)}
.report-section:last-child{border-bottom:none}
.sec-title{background:var(--g100);padding:8px 16px;font-size:12px;font-weight:700;color:var(--g700);border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:center;letter-spacing:.3px}

/*──── Editable Table ────*/
.rpt-table{width:100%;border-collapse:collapse;font-size:13px}
.rpt-table th,.rpt-table td{border:1px solid var(--g200);padding:8px 10px;vertical-align:top}
.rpt-table th{background:var(--g50);font-weight:600;font-size:12px;color:var(--g700);white-space:nowrap;text-align:center}
.rpt-table td.no-col{width:36px;text-align:center;color:var(--g500);font-size:12px;background:var(--g50);white-space:nowrap}
.rpt-table td.status-col{width:80px;text-align:center}
.rpt-table td.note-col{width:120px}
.rpt-table td.content-col{min-width:200px}
.rpt-table td[contenteditable]{outline:none;cursor:text;min-height:36px}
.rpt-table td[contenteditable]:focus{background:var(--primary-lt);outline:2px solid var(--primary);outline-offset:-1px}
.rpt-table tr:hover td.no-col .row-del{opacity:1}

/*──── Status Select ────*/
.status-select{width:100%;border:none;background:transparent;font-size:12px;font-family:var(--font);text-align:center;cursor:pointer;color:var(--g700);padding:0;outline:none}
.status-select option{text-align:left}

/*──── Free Text Area ────*/
.free-area{min-height:72px;padding:10px 14px;font-size:13px;font-family:var(--font);outline:none;line-height:1.7;color:var(--g900)}
.free-area:focus{background:var(--primary-lt)}
.free-area:empty::before{content:attr(data-placeholder);color:var(--g400);pointer-events:none}

/*──── Row Actions ────*/
.row-del{opacity:0;background:none;border:none;cursor:pointer;color:var(--red);padding:2px 4px;border-radius:4px;font-size:13px;transition:opacity .15s}
.row-del:hover{background:var(--red-lt)}
.row-actions{padding:6px 10px;background:var(--g50);border-top:1px solid var(--g200);display:flex;gap:6px}

/*──── Formatting Toolbar ────*/
.fmt-bar{display:flex;gap:2px;padding:4px 10px;background:var(--g50);border-bottom:1px solid var(--g200);flex-wrap:wrap}
.fmt-btn{background:none;border:none;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:12px;font-family:var(--font);color:var(--g700);transition:background .1s}
.fmt-btn:hover{background:var(--g200)}
.fmt-btn.active{background:var(--primary-lt);color:var(--primary)}
.fmt-sep{width:1px;background:var(--g300);margin:2px 3px;align-self:stretch}

/*──── Author Row ────*/
.author-row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--g200);flex-wrap:wrap;align-items:center}
.author-field{display:flex;align-items:center;gap:6px;font-size:13px}
.author-field label{color:var(--g500);font-size:12px;white-space:nowrap}
.author-field input{border:1px solid var(--g200);border-radius:var(--r);padding:4px 8px;font-size:13px;font-family:var(--font);background:#fff;width:120px;outline:none}
.author-field input:focus{border-color:var(--primary)}

/*──── Admin View ────*/
#v-admin{max-width:1100px;margin:0 auto;padding:16px}
.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.admin-title{font-size:17px;font-weight:700;flex:1}
.week-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.wf-btn{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--g200);background:#fff;color:var(--g700);white-space:nowrap;transition:all .15s}
.wf-btn:hover,.wf-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.admin-reports{display:flex;flex-direction:column;gap:0}
.admin-report-block{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:20px;background:#fff}
.admin-report-block .report-header{cursor:default}

/*──── Dept Members Manager ────*/
.dm-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.dm-table th,.dm-table td{border:1px solid var(--g200);padding:8px 10px}
.dm-table th{background:var(--g50);font-weight:600}
.dm-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dm-form input,.dm-form select{border:1px solid var(--g200);border-radius:var(--r);padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;background:#fff}
.dm-form input{flex:1;min-width:160px}
.dm-form select{width:160px}
.dm-form input:focus,.dm-form select:focus{border-color:var(--primary)}

/*──── Toast ────*/
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--g900);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--red)}

/*──── Spinner ────*/
.spinner{width:20px;height:20px;border:2px solid var(--g200);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/*──── Breadcrumb ────*/
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--g500);margin-bottom:14px;flex-wrap:wrap}
.breadcrumb a{color:var(--primary);cursor:pointer;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb-sep{color:var(--g300)}

/*──── Responsive ────*/
@media(max-width:600px){
  .dept-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .report-header{grid-template-columns:1fr}
  .report-meta{gap:6px}
  .author-row{flex-direction:column;gap:8px}
  .form-toolbar{flex-direction:column;align-items:stretch}
  .form-toolbar .btn{justify-content:center}
  .rpt-table td.note-col{width:80px}
  .rpt-table td.status-col{width:60px}
  .admin-toolbar{flex-direction:column;align-items:stretch}
}

/*──── Print Styles ────*/
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;font-size:9pt;margin:0;padding:0}
  .hdr,.form-toolbar,.fmt-bar,.row-actions,.breadcrumb,.btn,
  #v-login,#v-dept,#v-week,.admin-toolbar,.week-filter,.admin-entry,
  .hdr-right,.save-indicator,#toast{display:none!important}
  #v-form,#v-admin{padding:0;max-width:100%!important}
  .report-sheet,.admin-report-block{box-shadow:none!important;border:1px solid #999;margin-bottom:0;border-radius:0!important}
  .admin-report-block{page-break-after:always;break-after:page;margin-bottom:0!important}
  .admin-report-block:last-child{page-break-after:avoid}
  .report-header{background:#1a1a1a!important;color:#fff!important;padding:8pt 14pt;-webkit-print-color-adjust:exact}
  .report-title{font-size:13pt!important}
  .sec-title{background:#f0f0f0!important;padding:4pt 10pt;font-size:9pt}
  .rpt-table th,.rpt-table td{padding:4pt 6pt;font-size:8pt}
  .rpt-table th{background:#f0f0f0!important}
  .free-area{padding:6pt 10pt;min-height:40pt}
  .author-row{padding:6pt 10pt}
  .no-print{display:none!important}
  .row-del{display:none!important}
  @page{size:A4 portrait;margin:10mm 12mm}
}
</style>
</head>

<body id="app-wrap">

<!-- ──── Header ──── -->
<header class="hdr">
  <div class="hdr-left">
    <div>
      <div class="hdr-logo">ASEA 주간업무보고서</div>
    </div>
  </div>
  <div class="hdr-right">
    <span class="user-badge" id="user-badge" hidden></span>
    <button class="btn btn-ghost btn-sm" id="logout-btn" hidden onclick="App.logout()">로그아웃</button>
  </div>
</header>

<!-- ──── Login View ──── -->
<div id="v-login" class="view active">
  <div class="login-card">
    <div class="login-logo">📋</div>
    <div class="login-title">주간업무보고서</div>
    <div class="login-sub">아세아항공직업전문학교 부서별 주간업무보고서 시스템입니다.<br>Google 계정으로 로그인하여 이용하세요.</div>
    <div class="g-signin-wrap" id="g-signin-btn"></div>
  </div>
</div>

<!-- ──── Dept View ──── -->
<div id="v-dept" class="view">
  <div class="breadcrumb">
    <span>홈</span>
  </div>
  <div class="section-title">부서를 선택하세요</div>
  <div class="dept-grid" id="dept-grid"></div>
  <div class="admin-entry" id="admin-entry" hidden>
    <div class="section-title" style="font-size:14px;color:var(--g500);margin-bottom:10px">관리자 기능</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="App.showAdmin()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        전체 보고서 조회 / 관리자 모드
      </button>
    </div>
  </div>
</div>

<!-- ──── Week View ──── -->
<div id="v-week" class="view">
  <div class="breadcrumb">
    <a onclick="App.showDept()">부서 선택</a>
    <span class="breadcrumb-sep">›</span>
    <span id="bc-dept"></span>
  </div>
  <div class="section-title" id="week-title">주차를 선택하세요</div>
  <div class="week-list" id="week-list"></div>
</div>

<!-- ──── Form View ──── -->
<div id="v-form" class="view">
  <div class="form-toolbar no-print">
    <div class="form-toolbar-left">
      <div class="breadcrumb" style="margin-bottom:0">
        <a onclick="App.showDept()">부서 선택</a>
        <span class="breadcrumb-sep">›</span>
        <a id="bc-dept2" onclick="App.showWeek()"></a>
        <span class="breadcrumb-sep">›</span>
        <span id="bc-week"></span>
      </div>
    </div>
    <span class="save-indicator" id="save-ind">자동저장 대기</span>
    <button class="btn btn-ghost btn-sm" id="load-prev-btn" onclick="App.loadPrevWeek()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      지난 주 자료 불러오기
    </button>
    <button class="btn btn-primary btn-sm" onclick="App.saveReport()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      저장
    </button>
    <button class="btn btn-ghost btn-sm no-print" onclick="window.print()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      인쇄/PDF
    </button>
  </div>

  <div class="report-sheet" id="report-sheet">
    <!-- Report Header -->
    <div class="report-header">
      <div class="report-title">아세아항공직업전문학교 주간업무보고서</div>
      <div class="report-meta">
        <span>부서 <span class="meta-val" id="rh-dept"></span></span>
        <span>보고기간 <span class="meta-val" id="rh-period"></span></span>
        <span>작성일 <span class="meta-val" id="rh-date"></span></span>
      </div>
    </div>

    <!-- Author Row -->
    <div class="author-row">
      <div class="author-field">
        <label>작성자</label>
        <input type="text" id="f-author" placeholder="성명" oninput="App.scheduleAutoSave()">
      </div>
      <div class="author-field">
        <label>직위</label>
        <input type="text" id="f-rank" placeholder="직위/직급" oninput="App.scheduleAutoSave()">
      </div>
    </div>

    <!-- 포맷 툴바 -->
    <div class="fmt-bar no-print" id="fmt-bar">
      <button class="fmt-btn" title="굵게" onmousedown="e=>e.preventDefault()" onclick="fmt('bold')"><b>B</b></button>
      <button class="fmt-btn" title="기울임" onclick="fmt('italic')"><i>I</i></button>
      <button class="fmt-btn" title="밑줄" onclick="fmt('underline')"><u>U</u></button>

/* ═══════════════════════════════════════════════════
   Week Utilities
═══════════════════════════════════════════════════ */
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const y = d.getFullYear();
  const jan1 = new Date(y, 0, 1);
  const wk = Math.ceil((((d - jan1) / 86400000) + 1) / 7);
  return { year: y, week: wk };
}

function getWeekKey(date) {
  const { year, week } = getISOWeek(date);
  return `${year}-W${String(week).padStart(2,'0')}`;
}

function getWeekBounds(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  const mon = new Date(d); mon.setDate(d.getDate() - day + 1); mon.setHours(0,0,0,0);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  return { start: mon, end: fri };
}

function fmtDate(d, short) {
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return short ? `${m}/${dd}` : `${d.getFullYear()}.${m}.${dd}`;
}

function getWeekOptions(count = 8) {
  const opts = [];
  const today = new Date();
  for (let i = 0; i < count; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i * 7);
    const { start, end } = getWeekBounds(d);
    const key = getWeekKey(d);
    const { year, week } = getISOWeek(d);
    opts.push({ key, start, end, year, week, isCurrent: i === 0 });
  }
  return opts;
}

function weekLabel(opt) {
  const m = opt.start.getMonth() + 1;
  const wInMonth = Math.ceil(opt.start.getDate() / 7);
  return `${opt.year}년 ${m}월 ${wInMonth}주 (제${opt.week}주)`;
}

let _toastTimer = null;
function toast(msg, type, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type === 'error' ? ' error' : '');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.className = '', dur);
}

function initGSI() {
  if (typeof google === 'undefined' || !google.accounts) {
    setTimeout(initGSI, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: GCLIENT_ID,
    callback: handleCredential,
    auto_select: true,
    cancel_on_tap_outside: false
  });
  google.accounts.id.renderButton(
    document.getElementById('g-signin-btn'),
    { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko', width: 280 }
  );
  google.accounts.id.prompt();
}

function handleCredential(resp) {
  try {
    const payload = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    S.userEmail = payload.email;
    S.userName  = payload.name || payload.email.split('@')[0];
    S.isAdmin   = S.userEmail === ADMIN_EMAIL;
    document.getElementById('user-badge').textContent = S.userName;
    document.getElementById('user-badge').hidden = false;
    document.getElementById('logout-btn').hidden = false;
    afterLogin();
  } catch(e) {
    toast('로그인 처리 중 오류가 발생했습니다.', 'error');
  }
}

    if (!confirm('지난 주 자료를 불러오면 현재 입력 중인 내용이 대체됩니다. 계속하시겠습니까?')) return;
    const opts = getWeekOptions(10);
    const curIdx = opts.findIndex(o => o.key === S.selWeek.key);
    const prevOpt = opts[curIdx + 1];
    if (!prevOpt) { toast('지난 주 데이터가 없습니다.'); return; }

    try {
      const { data } = await sb.from('weekly_reports')
        .select('report_data')
        .eq('dept', S.selDept)
        .eq('week_key', prevOpt.key)
        .single();

      if (data && data.report_data) {
        App.initRows();
        App.fillForm(data.report_data);
        toast('지난 주 자료를 불러왔습니다. 확인 후 수정하세요.');
        App.scheduleAutoSave();
      } else {
        toast('지난 주 저장된 데이터가 없습니다.');
      }
    } catch(e) {
      toast('불러오기 실패: ' + (e.message || e), 'error');
    }
  },

  /* ── Collect Form Data ── */
  collectData() {
    const thisRows = [], nextRows = [];

    document.querySelectorAll('#tbody-this tr').forEach(tr => {
      const cells = tr.querySelectorAll('[contenteditable]');
      const sel   = tr.querySelector('.status-select');
      thisRows.push({
        content: cells[0] ? cells[0].innerHTML.trim() : '',
        status:  sel      ? sel.value : '',
        note:    cells[1] ? cells[1].innerHTML.trim() : ''
      });
    });

    document.querySelectorAll('#tbody-next tr').forEach(tr => {
      const cells = tr.querySelectorAll('[contenteditable]');
      nextRows.push({
        content: cells[0] ? cells[0].innerHTML.trim() : '',
        note:    cells[1] ? cells[1].innerHTML.trim() : ''
      });
    });

    return {
      author:      document.getElementById('f-author').value.trim(),
      rank:        document.getElementById('f-rank').value.trim(),
      this_week:   thisRows,
      next_week:   nextRows,
      suggestions: document.getElementById('f-suggestions').innerHTML.trim(),
      special:     document.getElementById('f-special').innerHTML.trim()
    };
  },

  /* ── Save Report ── */
  async saveReport(silent = false) {
    const data = App.collectData();
    setSaveInd('저장 중…', 'saving');
    try {
      const payload = {
        dept:        S.selDept,
        week_key:    S.selWeek.key,
        week_start:  S.selWeek.start.toISOString().split('T')[0],
        week_end:    S.selWeek.end.toISOString().split('T')[0],
        report_data: data,
        created_by:  S.userEmail,
        updated_by:  S.userEmail,
        updated_at:  new Date().toISOString()
      };

      // Conflict check
      if (S.updatedAt) {
        const { data: cur } = await sb.from('weekly_reports')
          .select('updated_at')
          .eq('dept', S.selDept)
          .eq('week_key', S.selWeek.key)
          .single();

        if (cur && cur.updated_at && cur.updated_at !== S.updatedAt) {
          const ok = confirm('다른 사용자가 이 보고서를 수정했습니다. 그래도 덮어쓰시겠습니까?');
          if (!ok) { setSaveInd('저장 취소', 'error'); return; }
        }
      }

      const { data: saved, error } = await sb.from('weekly_reports')
        .upsert(payload, { onConflict: 'dept,week_key', ignoreDuplicates: false })
        .select('id,updated_at')
        .single();

      if (error) throw error;
      S.reportId  = saved.id;
      S.updatedAt = saved.updated_at;
      setSaveInd('저장됨', 'saved');
      if (!silent) toast('저장되었습니다.');
    } catch(e) {
      setSaveInd('저장 실패', 'error');
      if (!silent) toast('저장 실패: ' + (e.message || e), 'error');
    }
  },

  scheduleAutoSave() {
    if (S.autoSaveTimer) clearTimeout(S.autoSaveTimer);
    setSaveInd('편집 중…', 'saving');
    S.autoSaveTimer = setTimeout(() => App.saveReport(true), 2000);
  },

  /* ── Admin View ── */
  async showAdmin() {
    if (!S.isAdmin) { toast('관리자만 접근 가능합니다.', 'error'); return; }
    showView('v-admin');
    App.loadDeptMembers();

    // Populate dept select in dm form
    const sel = document.getElementById('dm-dept');
    if (!sel.options.length) {
      DEPARTMENTS.forEach(d => {
        const o = document.createElement('option');
        o.value = o.textContent = d;
        sel.appendChild(o);
      });
    }

    // Build week filter
    const opts = getWeekOptions(12);
    const filter = document.getElementById('admin-week-filter');
    filter.innerHTML = '';
    opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'wf-btn' + (i === 0 ? ' on' : '');
      btn.dataset.key = opt.key;
      btn.textContent = weekLabel(opt);
      btn.onclick = () => {
        filter.querySelectorAll('.wf-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        App.loadAdminReports(opt);
      };
      filter.appendChild(btn);
    });

    App.loadAdminReports(opts[0]);
  },

  async loadAdminReports(weekOpt) {
    const area = document.getElementById('admin-reports-area');
    area.innerHTML = '<div style="padding:24px;text-align:center"><span class="spinner"></span> 불러오는 중…</div>';

    try {
      const { data, error } = await sb.from('weekly_reports')
        .select('*')
        .eq('week_key', weekOpt.key)
        .order('dept');
      if (error) throw error;

      // Build map
      const reportMap = {};
      (data || []).forEach(r => reportMap[r.dept] = r);

      area.innerHTML = '';
      DEPARTMENTS.forEach(dept => {
        const r = reportMap[dept];
        const block = document.createElement('div');
        block.className = 'admin-report-block';
        block.dataset.dept = dept;

        const d = r ? r.report_data : null;
        const color = DEPT_COLORS[dept] || '#333';
        block.innerHTML = buildReportHTML(dept, weekOpt, d, r ? r.updated_by : null, true);
        area.appendChild(block);
      });
    } catch(e) {
      area.innerHTML = `<p style="color:var(--red);padding:16px">오류: ${e.message||e}</p>`;
    }
  },

  /* ── Dept Members ── */
  async loadDeptMembers() {
    const tbody = document.getElementById('dm-tbody');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--g400)">불러오는 중…</td></tr>';
    const { data } = await sb.from('weekly_dept_members').select('*').order('dept');
    if (!data || !data.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--g400)">등록된 부서원이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    data.forEach(m => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${m.email}</td><td>${m.display_name||''}</td><td>${m.dept}</td>
        <td class="no-print"><button class="btn btn-danger btn-sm" onclick="App.delDeptMember('${m.id}','${m.email}')">삭제</button></td>`;
      tbody.appendChild(tr);
    });
  },

  async addDeptMember() {
    const email = document.getElementById('dm-email').value.trim();
    const name  = document.getElementById('dm-name').value.trim();
    const dept  = document.getElementById('dm-dept').value;
    if (!email || !dept) { toast('이메일과 부서를 입력하세요.', 'error'); return; }

    const { error } = await sb.from('weekly_dept_members')
      .upsert({ email, dept, display_name: name }, { onConflict: 'email' });
    if (error) { toast('등록 실패: ' + error.message, 'error'); return; }

    toast('등록되었습니다.');
    document.getElementById('dm-email').value = '';
    document.getElementById('dm-name').value  = '';
    App.loadDeptMembers();
  },

  async delDeptMember(id, email) {
    if (!confirm(`${email} 을(를) 삭제하시겠습니까?`)) return;
    const { error } = await sb.from('weekly_dept_members').delete().eq('id', id);
    if (error) { toast('삭제 실패', 'error'); return; }
    toast('삭제되었습니다.');
    App.loadDeptMembers();
  },

  logout() {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.revoke(S.userEmail, () => {});
      google.accounts.id.disableAutoSelect();
    }
    S.userEmail = null; S.userName = null; S.userDept = null; S.isAdmin = false;
    document.getElementById('user-badge').hidden = true;
    document.getElementById('logout-btn').hidden = true;
    showView('v-login');
    google.accounts.id.prompt();
  }
};

/* ═══════════════════════════════════════════════════
   Report HTML Builder (for Admin View + Print)
═══════════════════════════════════════════════════ */
function buildReportHTML(dept, weekOpt, d, updatedBy, isAdmin) {
  const author = d ? (d.author || '—') : '—';
  const rank   = d ? (d.rank   || '') : '';
  const color  = DEPT_COLORS[dept] || '#333';

  const thisRows = d && d.this_week && d.this_week.length
    ? d.this_week.map((r,i) => `
      <tr>
        <td class="no-col">${i+1}</td>
        <td class="content-col" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}>${r.content||''}</td>
        <td class="status-col"><select class="status-select" ${isAdmin ? `onchange="adminCellInput(this,'${dept}','${weekOpt.key}')"` : 'disabled'}>
          <option value="">—</option>
          ${['완료','진행중','예정','보류'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
        <td class="note-col" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}>${r.note||''}</td>
      </tr>`).join('')
    : '<tr><td class="no-col">—</td><td colspan="3" style="color:var(--g400);font-style:italic">입력된 내용이 없습니다.</td></tr>';

  const nextRows = d && d.next_week && d.next_week.length
    ? d.next_week.map((r,i) => `
      <tr>
        <td class="no-col">${i+1}</td>
        <td class="content-col" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}>${r.content||''}</td>
        <td class="note-col" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}>${r.note||''}</td>
      </tr>`).join('')
    : '<tr><td class="no-col">—</td><td colspan="2" style="color:var(--g400);font-style:italic">입력된 내용이 없습니다.</td></tr>';

  const period = `${fmtDate(weekOpt.start)} ~ ${fmtDate(weekOpt.end)}`;
  const lastBy = updatedBy ? `최종수정: ${updatedBy}` : '미작성';

  return `
    <div class="report-header" style="background:${color}">
      <div class="report-title">아세아항공직업전문학교 주간업무보고서</div>
      <div class="report-meta">
        <span>부서 <span class="meta-val">${dept}</span></span>
        <span>보고기간 <span class="meta-val">${period}</span></span>
        <span>작성자 <span class="meta-val">${rank ? rank+' '+author : author}</span></span>
        <span class="no-print" style="opacity:.7">${lastBy}</span>
      </div>
    </div>
    <div class="report-section">
      <div class="sec-title">1. 이번 주 주요업무 추진현황</div>
      <table class="rpt-table">
        <thead><tr><th style="width:36px">번호</th><th>업무 내용</th><th style="width:80px">진행상황</th><th style="width:120px">비고</th></tr></thead>
        <tbody>${thisRows}</tbody>
      </table>
    </div>
    <div class="report-section">
      <div class="sec-title">2. 다음 주 업무 계획</div>
      <table class="rpt-table">
        <thead><tr><th style="width:36px">번호</th><th>업무 내용</th><th style="width:120px">비고</th></tr></thead>
        <tbody>${nextRows}</tbody>
      </table>
    </div>
    <div class="report-section">
      <div class="sec-title">3. 건의 / 협조 사항</div>
      <div class="free-area" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}
           data-placeholder="없음">${d&&d.suggestions ? d.suggestions : ''}</div>
    </div>
    <div class="report-section">
      <div class="sec-title">4. 특이사항</div>
      <div class="free-area" ${isAdmin ? `contenteditable="true" onpaste="handlePaste(event,this)" oninput="adminCellInput(this,'${dept}','${weekOpt.key}')" onfocus="S.activeFocus=this"` : ''}
           data-placeholder="없음">${d&&d.special ? d.special : ''}</div>
    </div>`;
}

/* Admin inline edit debounce */
const _adminSaveTimers = {};
async function adminCellInput(el, dept, weekKey) {
  const key = dept + weekKey;
  if (_adminSaveTimers[key]) clearTimeout(_adminSaveTimers[key]);
  _adminSaveTimers[key] = setTimeout(() => adminSaveBlock(dept, weekKey), 2500);
}

async function adminSaveBlock(dept, weekKey) {
  // Re-collect data from admin block DOM
  const block = document.querySelector(`[data-dept="${dept}"]`);
  if (!block) return;

  const thisRows = [], nextRows = [];
  block.querySelectorAll('.report-section')[0].querySelectorAll('tbody tr').forEach((tr,i) => {
    const cells = tr.querySelectorAll('[contenteditable]');
    const sel = tr.querySelector('.status-select');
    thisRows.push({ content: cells[0]?cells[0].innerHTML.trim():'', status: sel?sel.value:'', note: cells[1]?cells[1].innerHTML.trim():'' });
  });
  block.querySelectorAll('.report-section')[1].querySelectorAll('tbody tr').forEach(tr => {
    const cells = tr.querySelectorAll('[contenteditable]');
    nextRows.push({ content: cells[0]?cells[0].innerHTML.trim():'', note: cells[1]?cells[1].innerHTML.trim():'' });
  });
  const freeAreas = block.querySelectorAll('.free-area');
  const weekOpts = getWeekOptions(12);
  const weekOpt  = weekOpts.find(o => o.key === weekKey);
  if (!weekOpt) return;

  const payload = {
    dept, week_key: weekKey,
    week_start: weekOpt.start.toISOString().split('T')[0],
    week_end:   weekOpt.end.toISOString().split('T')[0],
    report_data: { this_week: thisRows, next_week: nextRows,
      suggestions: freeAreas[0]?freeAreas[0].innerHTML.trim():'',
      special:     freeAreas[1]?freeAreas[1].innerHTML.trim():'' },
    updated_by: S.userEmail, updated_at: new Date().toISOString()
  };

  const { error } = await sb.from('weekly_reports').upsert(payload, { onConflict: 'dept,week_key' });
  if (!error) toast(`${dept} 저장됨`);
}

/* ═══════════════════════════════════════════════════
   Rich Text Helpers
═══════════════════════════════════════════════════ */
function fmt(cmd) {
  document.execCommand(cmd, false, null);
}

function fmtLink() {
  const url = prompt('링크 URL을 입력하세요:');
  if (url) document.execCommand('createLink', false, url.startsWith('http') ? url : 'https://' + url);
}

function fmtImage() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    await insertImage(file);
  };
  input.click();
}

async function insertImage(file) {
  toast('이미지 업로드 중…', '', 10000);
  try {
    const ext  = file.name.split('.').pop() || 'png';
    const path = `reports/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if (upErr) throw upErr;
    const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
    const url = urlData.publicUrl;
    document.execCommand('insertImage', false, url);
    toast('이미지 삽입 완료');
    App.scheduleAutoSave();
  } catch(e) {
    // Fallback: base64 (small images only)
    const reader = new FileReader();
    reader.onload = () => {
      document.execCommand('insertImage', false, reader.result);
      toast('이미지 삽입 완료 (로컬)');
      App.scheduleAutoSave();
    };
    reader.readAsDataURL(file);
  }
}

function handlePaste(e, el) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!S.activeFocus) S.activeFocus = el;
      // Restore focus then insert
      el.focus();
      if (file) insertImage(file);
      return;
    }
  }
  // Auto-link URLs on paste
  setTimeout(() => autoLink(el), 50);
  App.scheduleAutoSave();
}

function autoLink(el) {
  if (!el) return;
  // Replace bare URLs with <a> links in textContent
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const urlRe = /https?:\/\/[^\s<>"']+/g;
  nodes.forEach(node => {
    if (urlRe.test(node.textContent) && node.parentElement && node.parentElement.tagName !== 'A') {
      const span = document.createElement('span');
      span.innerHTML = node.textContent.replace(urlRe, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
      node.parentElement.replaceChild(span, node);
      App.scheduleAutoSave();
    }
  });
}

function onCellInput(el) {
  App.scheduleAutoSave();
}

/* ═══════════════════════════════════════════════════
   Save Indicator
═══════════════════════════════════════════════════ */
function setSaveInd(msg, type) {
  const el = document.getElementById('save-ind');
  if (!el) return;
  el.textContent = type === 'saving' ? '● ' + msg : type === 'saved' ? '✓ ' + msg : type === 'error' ? '✕ ' + msg : msg;
  el.className = 'save-indicator' + (type ? ' ' + type : '');
}

/* ═══════════════════════════════════════════════════
   Admin Panel Toggle
═══════════════════════════════════════════════════ */
function toggleDmPanel() {
  const body   = document.getElementById('dm-body');
  const chev   = document.getElementById('dm-chevron');
  const hidden = body.hidden;
  body.hidden  = !hidden;
  chev.style.transform = hidden ? 'rotate(180deg)' : '';

/* ═══════════════════════════════════════════════════
   Init
═══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function() {
  // Wait for Supabase to load
  function tryInit() {
    if (typeof supabase === 'undefined') { setTimeout(tryInit, 200); return; }
    sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
    });
    // Try cached login
    const cached = sessionStorage.getItem('weekly_user');
    if (cached) {
      try {
        const u = JSON.parse(cached);
        S.userEmail = u.email; S.userName = u.name; S.isAdmin = u.email === ADMIN_EMAIL;
        document.getElementById('user-badge').textContent = u.name;
        document.getElementById('user-badge').hidden = false;
        document.getElementById('logout-btn').hidden = false;
        afterLogin();
        return;
      } catch(e) {}
    }
    initGSI();
  }
  tryInit();
});

// Cache user session on credential receipt
const _origHandle = handleCredential;
window.handleCredential = function(resp) {
  const payload = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  try { sessionStorage.setItem('weekly_user', JSON.stringify({ email: payload.email, name: payload.name||payload.email.split('@')[0] })); } catch(e) {}
  _origHandle(resp);
};

// Logout clears cache
const _origLogout = App.logout.bind(App);
App.logout = function() {
  try { sessionStorage.removeItem('weekly_user'); } catch(e) {}
  _origLogout();
};
