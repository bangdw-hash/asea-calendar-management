<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>아세아 길찾기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --c:#1a3a5c; }
  *{ box-sizing:border-box; }
  body{ font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; margin:0; background:#eef3f8; color:#1f2937; }
  .wrap{ max-width:620px; margin:0 auto; padding:14px 12px 60px; }
  .hd{ background:var(--c); color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .hd h1{ font-size:17px; margin:0 0 2px; } .hd p{ font-size:12px; margin:0; opacity:.85; }
  .card{ background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:14px; margin-bottom:12px; }
  label{ display:block; font-size:12px; font-weight:600; color:#374151; margin:8px 0 4px; }
  select,input{ width:100%; padding:11px 12px; border:1.5px solid #d1d5db; border-radius:9px; font-size:15px; }
  .btn{ width:100%; background:var(--c); color:#fff; border:none; border-radius:10px; padding:13px; font-size:16px; font-weight:700; cursor:pointer; margin-top:12px; }
  .muted{ font-size:12px; color:#6b7280; line-height:1.6; }
  .err{ color:#dc2626; font-size:13px; }
  h2{ font-size:15px; color:var(--c); margin:0 0 8px; }
  .stage{ position:relative; width:100%; background:#f1f5f9; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; }
  .stage img{ display:block; width:100%; height:auto; }
  .stage svg{ position:absolute; inset:0; width:100%; height:100%; }
  .floorttl{ font-weight:700; color:var(--c); margin:4px 0 6px; }
  .trans{ background:#eef4fb; border:1px solid #cfe0f3; border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0; color:#1a3a5c; }
  .steps{ font-size:13px; line-height:1.8; }
  .dot{ position:absolute; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .dot.s{ background:#16a34a; } .dot.e{ background:#dc2626; }
  .pin{ position:absolute; transform:translate(-50%,-110%); font-size:11px; font-weight:700; background:#111; color:#fff; padding:2px 6px; border-radius:6px; white-space:nowrap; }
  .destlist{ max-height:260px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:10px; margin-top:6px; padding:4px; }
  .dgrp{ font-size:11px; font-weight:700; color:#64748b; padding:6px 8px 2px; }
  .destbtn{ width:100%; text-align:left; background:#fff; border:1px solid #eef1f4; border-radius:8px; padding:10px 12px; margin:3px 0; font-size:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .destbtn.on{ background:var(--c); color:#fff; border-color:var(--c); }
  .dty{ font-size:11px; opacity:.7; }
  .destbtn.on .dty{ opacity:.9; }
  .modes{ display:flex; gap:10px; margin:4px 0; }
  .mode{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:1.5px solid #d1d5db; border-radius:9px; padding:10px; font-size:14px; cursor:pointer; }
  .mode input{ width:auto; }
  .simdot{ position:absolute; transform:translate(-50%,-50%); width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 4px rgba(37,99,235,.35); animation:simpulse 1.1s infinite; }
  @keyframes simpulse{ 0%{box-shadow:0 0 0 0 rgba(37,99,235,.5);} 100%{box-shadow:0 0 0 11px rgba(37,99,235,0);} }
  .simctl{ display:flex; gap:8px; margin-top:10px; }
  .simctl button{ flex:1; padding:11px; border:1.5px solid #cfe0f3; background:#fff; color:var(--c); border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; }
  .simctl button:disabled{ opacity:.4; cursor:default; }
  #sim-play{ background:var(--c); color:#fff; border-color:var(--c); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>🧭 아세아 길찾기</h1><p>QR을 찍은 지점이 현재 위치로 설정됩니다.</p></div>
  <div id="app"><div class="card"><p class="muted">불러오는 중…</p></div></div>
</div>
<script>
var DEF_URL='https://zbpeyklwpotjyveipzxd.supabase.co';
var DEF_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var db=window.supabase?window.supabase.createClient(DEF_URL,DEF_KEY):null;
var app=document.getElementById('app');
var _qs=new URLSearchParams(location.search);
var DATA={floors:[],nodes:[],edges:[]}, FROM=_qs.get('from')||'';
var TOQ=_qs.get('to')||'', MODEQ=_qs.get('mode')||'', AUTOQ=_qs.get('auto')==='1';
var FMAP={}, NMAP={};

if(!db){ app.innerHTML='<div class="card"><p class="err">연결 정보를 불러올 수 없습니다.</p></div>'; }
else load();

async function load(){
  var d=await db.from('wayfind_data').select('data').eq('id','main').limit(1);
  if(d.error){ app.innerHTML='<div class="card"><p class="err">데이터 조회 실패: '+esc(d.error.message)+'</p></div>'; return; }
  DATA=(d.data&&d.data[0]&&d.data[0].data)||{floors:[],nodes:[],edges:[]};
  DATA.floors=DATA.floors||[]; DATA.nodes=DATA.nodes||[]; DATA.edges=DATA.edges||[];
  DATA.floors.forEach(function(f){ FMAP[f.id]=f; });
  DATA.nodes.forEach(function(n){ NMAP[n.id]=n; });
  if(!DATA.nodes.length){ app.innerHTML='<div class="card"><p class="muted">아직 등록된 안내도가 없습니다. 관리자에게 문의하세요.</p></div>'; return; }
  renderForm();
}

function nodeOptions(selId){
  // 층별 그룹
  return DATA.floors.map(function(f){
    var ns=DATA.nodes.filter(function(n){return n.floor===f.id && n.name;});
    if(!ns.length) return '';
    return '<optgroup label="'+esc(f.name)+'">'+ns.map(function(n){ return '<option value="'+n.id+'"'+(n.id===selId?' selected':'')+'>'+esc(n.name)+'</option>'; }).join('')+'</optgroup>';
  }).join('');
}
var SELDEST='';
function destNodes(){ return DATA.nodes.filter(function(n){ return n.name; }); }
function renderDestList(q){
  q=(q||'').toLowerCase().trim();
  var el=document.getElementById('wf-dest'); if(!el) return;
  var html=DATA.floors.map(function(f){
    var ns=destNodes().filter(function(n){ return n.floor===f.id && (n.name+' '+(n.type||'')).toLowerCase().indexOf(q)!==-1; });
    if(!ns.length) return '';
    return '<div class="dgrp">'+esc(f.name)+'</div>'+ns.map(function(n){
      return '<button type="button" class="destbtn'+(SELDEST===n.id?' on':'')+'" data-id="'+n.id+'">'+esc(n.name)+'<span class="dty">'+esc(n.type||'')+'</span></button>'; }).join('');
  }).join('');
  el.innerHTML=html||'<p class="muted" style="padding:6px">검색 결과가 없습니다.</p>';
  el.querySelectorAll('.destbtn').forEach(function(b){ b.addEventListener('click',function(){ SELDEST=this.dataset.id; renderDestList(document.getElementById('wf-q').value); }); });
}
function renderForm(){
  var fromName=NMAP[FROM]?NMAP[FROM].name:'';
  app.innerHTML='<div class="card"><h2>현재 위치</h2>'+
    (FROM&&NMAP[FROM]? '<p style="font-size:15px"><b>📍 '+esc(fromName)+'</b> <span class="muted">('+esc((FMAP[NMAP[FROM].floor]||{}).name||'')+')</span></p>'
      : '<label>현재 위치 선택</label><select id="wf-from">'+nodeOptions(FROM)+'</select>')+
    '<label>이동수단</label><div class="modes">'+
      '<label class="mode"><input type="radio" name="wf-mode" value="walk" checked> 🚶 도보(계단)</label>'+
      '<label class="mode"><input type="radio" name="wf-mode" value="elevator"> 🛗 엘리베이터</label>'+
    '</div>'+
    '<label>목적지 검색 (예: 교수실, 여자화장실, 휴게실)</label><input id="wf-q" placeholder="이름으로 검색…">'+
    '<div id="wf-dest" class="destlist"></div>'+
    '<div class="err" id="wf-err" style="display:none"></div>'+
    '<button class="btn" id="wf-go">길찾기</button>'+
    '<button class="btn" id="wf-evac" style="background:#dc2626;margin-top:8px">🔥 가장 빠른 대피 경로</button></div>'+
    '<div id="wf-out"></div>';
  document.getElementById('wf-q').addEventListener('input',function(){ renderDestList(this.value); });
  document.getElementById('wf-go').addEventListener('click', go);
  document.getElementById('wf-evac').addEventListener('click', evac);
  // URL 파라미터(시뮬레이션/QR 미리보기)로 목적지·이동수단 사전 지정 + 자동 실행
  if(MODEQ){ var mr=document.querySelector('input[name=wf-mode][value="'+(MODEQ==='elevator'?'elevator':'walk')+'"]'); if(mr) mr.checked=true; }
  if(TOQ&&NMAP[TOQ]) SELDEST=TOQ;
  renderDestList('');
  if(AUTOQ&&FROM&&NMAP[FROM]&&SELDEST){ go(); }
}

function buildGraph(mode){
  // mode: 'walk'(계단) | 'elevator'(엘리베이터) — 층간 이동수단 선택
  var connType = mode==='elevator' ? '엘리베이터' : '계단';
  var adj={}; DATA.nodes.forEach(function(n){ adj[n.id]=[]; });
  function add(a,b,w){ if(adj[a]&&adj[b]){ adj[a].push({to:b,w:w}); adj[b].push({to:a,w:w}); } }
  DATA.edges.forEach(function(e){ var a=NMAP[e[0]],b=NMAP[e[1]]; if(!a||!b) return;
    if(a.floor===b.floor){ var dx=a.x-b.x,dy=a.y-b.y; add(a.id,b.id,Math.sqrt(dx*dx+dy*dy)); }
    else if(a.type===connType||b.type===connType){ add(a.id,b.id,40); } });   // 층간 명시 간선은 선택 이동수단만
  // 같은 이름 층간 입출입(계단)/엘리베이터 자동 연결 (선택 이동수단만)
  var grp={};
  DATA.nodes.forEach(function(n){ if(n.type===connType){ var k=n.type+'|'+(n.name||''); (grp[k]=grp[k]||[]).push(n); } });
  Object.keys(grp).forEach(function(k){ var arr=grp[k]; for(var i=0;i<arr.length;i++) for(var j=i+1;j<arr.length;j++){ if(arr[i].floor!==arr[j].floor) add(arr[i].id,arr[j].id,40); } });
  return adj;
}
function pathLen(p){ var s=0; for(var i=1;i<p.length;i++){ var a=NMAP[p[i-1]],b=NMAP[p[i]]; if(!a||!b) continue; s+= a.floor===b.floor ? Math.hypot(a.x-b.x,a.y-b.y) : 40; } return s; }
function nearestExitPath(adj,s){
  var exits=DATA.nodes.filter(function(n){return n.exit;}).map(function(n){return n.id;});
  if(!exits.length) return {err:'등록된 출입구(대피 출구)가 없습니다. 관리자에게 문의하세요.'};
  var best=null;
  exits.forEach(function(t){ if(t===s){ best={path:[s],d:0}; return; } var p=dijkstra(adj,s,t); if(p){ var d=pathLen(p); if(!best||d<best.d) best={path:p,d:d}; } });
  return best?{path:best.path}:{err:'대피 경로를 찾을 수 없습니다. (지점이 출입구까지 연결되어 있는지 확인)'};
}
function dijkstra(adj,s,t){
  var dist={},prev={},done={},pq=[];
  Object.keys(adj).forEach(function(k){ dist[k]=Infinity; }); dist[s]=0; pq.push(s);
  while(pq.length){ // simple: pick min
    var u=null,best=Infinity; pq.forEach(function(x){ if(!done[x]&&dist[x]<best){best=dist[x];u=x;} });
    if(u==null) break; if(u===t) break; done[u]=true; pq=pq.filter(function(x){return x!==u;});
    (adj[u]||[]).forEach(function(e){ var nd=dist[u]+e.w; if(nd<dist[e.to]){ dist[e.to]=nd; prev[e.to]=u; if(!done[e.to]) pq.push(e.to); } });
  }
  if(dist[t]===Infinity) return null;
  var path=[],c=t; while(c!=null){ path.unshift(c); c=prev[c]; } return path;
}

function curMode(){ var r=document.querySelector('input[name=wf-mode]:checked'); return r?r.value:'walk'; }
function curFrom(){ return FROM&&NMAP[FROM]?FROM:(document.getElementById('wf-from')?document.getElementById('wf-from').value:''); }
function go(){
  var err=document.getElementById('wf-err'); err.style.display='none';
  var from=curFrom(); var to=SELDEST; var mode=curMode();
  if(!from){ err.textContent='현재 위치를 선택하세요.'; err.style.display='block'; return; }
  if(!to){ err.textContent='목적지를 검색·선택하세요.'; err.style.display='block'; return; }
  if(from===to){ err.textContent='현재 위치와 목적지가 같습니다.'; err.style.display='block'; return; }
  var adj=buildGraph(mode);
  var path=dijkstra(adj,from,to);
  if(!path){ err.textContent='경로를 찾을 수 없습니다. '+(mode==='elevator'?'(엘리베이터로 연결된 경로가 없으면 도보를 선택해 보세요)':'(지점이 서로 연결되어 있는지 관리자에게 문의)'); err.style.display='block'; return; }
  renderRoute(path,false);
}
function evac(){
  var err=document.getElementById('wf-err'); err.style.display='none';
  var from=curFrom();
  if(!from){ err.textContent='현재 위치를 선택하세요.'; err.style.display='block'; return; }
  var res=nearestExitPath(buildGraph('walk'),from);   // 대피는 도보(계단) 기준
  if(res.err){ err.textContent=res.err; err.style.display='block'; return; }
  if(res.path.length<2){ err.textContent='현재 위치가 이미 출입구입니다.'; err.style.display='block'; return; }
  renderRoute(res.path,true);
}

function renderRoute(path,isEvac){
  // 층별 구간으로 분할
  var segs=[], cur=null;
  path.forEach(function(id){ var n=NMAP[id]; if(!cur||cur.floor!==n.floor){ cur={floor:n.floor,ids:[]}; segs.push(cur); } cur.ids.push(id); });
  var endName=esc(NMAP[path[path.length-1]].name);
  var html='<div id="wf-sim"></div>'+
    '<div class="card"><h2>'+(isEvac?'🔥 대피 경로 안내':'경로 안내')+'</h2><p class="muted">📍 '+esc(NMAP[path[0]].name)+' → '+(isEvac?'🚪 '+endName+' (출구)':'🏁 '+endName)+'</p></div>';
  segs.forEach(function(seg,si){
    var f=FMAP[seg.floor]||{};
    var pts=seg.ids.map(function(id){ return NMAP[id]; });
    var poly=pts.map(function(p){ return p.x+','+p.y; }).join(' ');
    html+='<div class="card"><div class="floorttl">'+esc(f.name||'')+'</div>';
    if(f.image){
      var dots='';
      if(si===0) dots+='<div class="dot s" style="left:'+pts[0].x+'%;top:'+pts[0].y+'%"></div><div class="pin" style="left:'+pts[0].x+'%;top:'+pts[0].y+'%">출발</div>';
      if(si===segs.length-1){ var le=pts[pts.length-1]; dots+='<div class="dot e" style="left:'+le.x+'%;top:'+le.y+'%"></div><div class="pin" style="left:'+le.x+'%;top:'+le.y+'%">'+(isEvac?'🚪 대피구':'도착')+'</div>'; }
      html+='<div class="stage"><img src="'+f.image+'">'+
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="ar'+si+'" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker></defs>'+
        '<polyline points="'+poly+'" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar'+si+')"/></svg>'+
        dots+'</div>';
    } else {
      html+='<p class="muted">이 층 도면 이미지가 없습니다. 경로: '+pts.map(function(p){return esc(p.name);}).join(' → ')+'</p>';
    }
    html+='<div class="steps">'+pts.map(function(p,i){ return (i+1)+'. '+esc(p.name); }).join('<br>')+'</div></div>';
    // 다음 구간으로의 층 이동 안내
    if(si<segs.length-1){
      var lastNode=NMAP[seg.ids[seg.ids.length-1]];
      var nextFloor=FMAP[segs[si+1].floor]||{};
      html+='<div class="trans">🔁 <b>'+esc(lastNode.name)+'</b>('+esc(lastNode.type)+')에서 <b>'+esc(nextFloor.name)+'</b>(으)로 이동하세요.</div>';
    }
  });
  document.getElementById('wf-out').innerHTML=html;
  startSim(path,isEvac);
  document.getElementById('wf-out').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ── 이동 시뮬레이션 재생(이전/다음/재생·일시정지) ── */
var PLAY=null;
function startSim(path,isEvac){ simStop(); PLAY={path:path,idx:0,timer:null,isEvac:!!isEvac}; renderSim(); }
function simStop(){ if(PLAY&&PLAY.timer){ clearInterval(PLAY.timer); PLAY.timer=null; } }
function simTogglePlay(){ if(!PLAY) return; if(PLAY.timer){ simStop(); renderSim(); return; }
  if(PLAY.idx>=PLAY.path.length-1) PLAY.idx=0;
  PLAY.timer=setInterval(function(){ if(PLAY.idx>=PLAY.path.length-1){ simStop(); renderSim(); return; } PLAY.idx++; renderSim(); },1000);
  renderSim();
}
function simNext(){ if(PLAY&&PLAY.idx<PLAY.path.length-1){ simStop(); PLAY.idx++; renderSim(); } }
function simPrev(){ if(PLAY&&PLAY.idx>0){ simStop(); PLAY.idx--; renderSim(); } }
function renderSim(){
  var el=document.getElementById('wf-sim'); if(!el||!PLAY) return;
  var path=PLAY.path, idx=PLAY.idx, len=path.length, cur=NMAP[path[idx]], f=FMAP[cur.floor]||{};
  var onFloor=[]; path.forEach(function(id,i){ var n=NMAP[id]; if(n&&n.floor===cur.floor) onFloor.push({i:i,n:n}); });
  var full=onFloor.map(function(o){return o.n.x+','+o.n.y;}).join(' ');
  var done=onFloor.filter(function(o){return o.i<=idx;}).map(function(o){return o.n.x+','+o.n.y;}).join(' ');
  var playing=!!PLAY.timer, stage='';
  if(f.image){
    stage='<div class="stage"><img src="'+f.image+'"><svg viewBox="0 0 100 100" preserveAspectRatio="none">'+
      '<polyline points="'+full+'" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>'+
      (done?'<polyline points="'+done+'" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+
      '</svg><div class="simdot" style="left:'+cur.x+'%;top:'+cur.y+'%"></div>'+
      '<div class="pin" style="left:'+cur.x+'%;top:'+cur.y+'%">'+esc(cur.name||'경유')+'</div></div>';
  } else { stage='<p class="muted">이 층 도면 이미지가 없습니다. ('+esc(f.name||'')+')</p>'; }
  var hint='';
  if(idx<len-1){ var nx=NMAP[path[idx+1]]; if(nx&&nx.floor!==cur.floor) hint='<div class="trans">🔁 <b>'+esc(cur.name)+'</b>('+esc(cur.type||'')+')에서 <b>'+esc((FMAP[nx.floor]||{}).name||'')+'</b>(으)로 이동</div>'; }
  else hint='<div class="trans" style="background:#ecfdf5;border-color:#a7f3d0;color:#065f46">'+(PLAY.isEvac?'🚪 대피 완료':'🏁 목적지 도착')+'</div>';
  el.innerHTML='<div class="card"><h2>🧭 이동 시뮬레이션</h2><div class="floorttl">'+esc(f.name||'')+' · 단계 '+(idx+1)+' / '+len+'</div>'+stage+
    '<p style="font-size:15px;margin:8px 0 2px"><b>📍 '+esc(cur.name||'경유점')+'</b></p>'+hint+
    '<div class="simctl"><button id="sim-prev"'+(idx===0?' disabled':'')+'>◀ 이전</button><button id="sim-play">'+(playing?'⏸ 일시정지':'▶ 재생')+'</button><button id="sim-next"'+(idx>=len-1?' disabled':'')+'>다음 ▶</button></div></div>';
  document.getElementById('sim-prev').addEventListener('click',simPrev);
  document.getElementById('sim-play').addEventListener('click',simTogglePlay);
  document.getElementById('sim-next').addEventListener('click',simNext);
}
</script>
</body>
</html>
