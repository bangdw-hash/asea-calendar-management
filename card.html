<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>연락처 공유</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #EFF6FF 0%, #F0F9FF 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 36px 28px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 12px 48px rgba(29,78,216,.12), 0 2px 8px rgba(0,0,0,.06);
    text-align: center;
  }
  .logo-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 16px;
    background: #EFF6FF; color: #1D4ED8;
    border-radius: 20px; font-size: 12px; font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: .02em;
  }
  .avatar {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #1D4ED8, #3B82F6);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #fff;
    margin: 0 auto 16px;
  }
  .name { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 4px; }
  .meta { font-size: 14px; color: #6b7280; margin-bottom: 6px; }
  .org  { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }
  .divider { height: 1px; background: #f3f4f6; margin: 0 -4px 16px; }
  .info-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid #f9fafb;
    text-align: left;
  }
  .info-row:last-of-type { border-bottom: none; }
  .info-icon { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
  .info-text { font-size: 14px; color: #374151; }
  .info-text a { color: #374151; text-decoration: none; }
  .info-text a:hover { color: #1D4ED8; }
  .btn-save {
    display: block; width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #1D4ED8, #2563EB);
    color: #fff; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 4px 16px rgba(29,78,216,.3);
    transition: transform .1s, box-shadow .1s;
  }
  .btn-save:active { transform: scale(.98); box-shadow: 0 2px 8px rgba(29,78,216,.2); }
  .footer { font-size: 11px; color: #d1d5db; margin-top: 16px; }
  .empty { color: #9ca3af; font-size: 15px; padding: 40px 0; }
</style>
</head>
<body>
<div class="card" id="card-root">
  <div class="empty">불러오는 중…</div>
</div>
<script>
(function () {
  var root = document.getElementById('card-root');

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var params = new URLSearchParams(window.location.search);
  var v = params.get('v');

  if (!v) {
    root.innerHTML = '<div class="empty">⚠️ 잘못된 링크입니다.</div>';
    return;
  }

  var c;
  try {
    c = JSON.parse(decodeURIComponent(escape(atob(v))));
  } catch (e) {
    root.innerHTML = '<div class="empty">⚠️ 링크가 만료되었거나 올바르지 않습니다.</div>';
    return;
  }

  var meta = [c.title, c.dept].filter(Boolean).join(' · ');
  var initial = (c.name || '?').charAt(0).toUpperCase();

  var rows = '';
  if (c.mobile)    rows += '<div class="info-row"><span class="info-icon">📱</span><span class="info-text"><a href="tel:' + esc(c.mobile)    + '">' + esc(c.mobile)    + '</a></span></div>';
  if (c.workPhone) rows += '<div class="info-row"><span class="info-icon">☎️</span><span class="info-text"><a href="tel:' + esc(c.workPhone) + '">' + esc(c.workPhone) + '</a></span></div>';
  if (c.email)     rows += '<div class="info-row"><span class="info-icon">✉️</span><span class="info-text"><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a></span></div>';
  if (c.address)   rows += '<div class="info-row"><span class="info-icon">📍</span><span class="info-text">' + esc(c.address) + '</span></div>';

  document.title = (c.name || '') + ' 연락처';

  root.innerHTML =
    '<div class="logo-badge">🏫 아세아항공직업전문학교</div>' +
    '<div class="avatar">' + esc(initial) + '</div>' +
    '<div class="name">' + esc(c.name || '') + '</div>' +
    (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
    (c.org ? '<div class="org">' + esc(c.org) + '</div>' : '') +
    '<div class="divider"></div>' +
    (rows || '<div style="color:#9ca3af;font-size:13px;padding:12px 0">연락처 정보 없음</div>') +
    '<button class="btn-save" onclick="saveVcf()">📱 연락처 저장</button>' +
    '<div class="footer">ASEA 업무관리 시스템 · 아세아항공직업전문학교</div>';

  window.saveVcf = function () {
    function esc2(s) { return (s || '').replace(/[,;\\]/g, '\\$&'); }
    var lines = ['BEGIN:VCARD', 'VERSION:3.0',
      'N:' + esc2(c.name) + ';;;;',
      'FN:' + esc2(c.name)];
    if (c.org || c.dept) lines.push('ORG:' + esc2(c.org) + ';' + esc2(c.dept));
    if (c.title)      lines.push('TITLE:'               + esc2(c.title));
    if (c.mobile)     lines.push('TEL;TYPE=CELL,VOICE:' + c.mobile);
    if (c.workPhone)  lines.push('TEL;TYPE=WORK,VOICE:' + c.workPhone);
    if (c.email)      lines.push('EMAIL;TYPE=INTERNET:' + c.email);
    if (c.address)    lines.push('ADR:;;' + esc2(c.address) + ';;;;');
    lines.push('END:VCARD');
    var blob = new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = (c.name || 'contact') + '.vcf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };
})();
</script>
<script src="monoicons.js"></script>
</body>
</html>
