<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 창공제 노래 콘테스트 결과 발표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:#000;}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:#000;color:#fff;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

/* ── 16:9 stage ── */
.stage-wrap{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.stage-16x9{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  max-height:100vh;
  max-width:calc(100vh * 16/9);
  overflow:hidden;
}

/* ── Animated starfield BG ── */
canvas.starfield{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
.bg-glow{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 80% at 20% 50%, rgba(0,40,120,.55) 0%, transparent 65%),
    radial-gradient(ellipse 50% 60% at 80% 50%, rgba(40,0,100,.4) 0%, transparent 65%),
    radial-gradient(ellipse 100% 40% at 50% 100%, rgba(0,212,255,.12) 0%, transparent 60%);
}

/* ── Header strip ── */
.r-header{
  position:absolute;top:0;left:0;right:0;
  padding:1.6% 3% 1%;
  display:flex;align-items:center;justify-content:space-between;
  z-index:10;
  background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%);
}
.r-logo{
  font-size:clamp(11px,1.3vw,18px);font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(0,212,255,.75);
}
.r-title{
  font-size:clamp(14px,1.8vw,24px);font-weight:900;letter-spacing:-.01em;
  background:linear-gradient(135deg,#fff 30%,rgba(0,212,255,.85));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.r-phase{
  font-size:clamp(10px,1.1vw,15px);font-weight:700;letter-spacing:.12em;
  color:rgba(255,255,255,.4);text-align:right;
}

/* ── Main layout: left card + right list ── */
.r-body{
  position:absolute;
  top:12%;bottom:14%;left:3%;right:3%;
  z-index:10;
  display:grid;
  grid-template-columns:1fr 340px;
  gap:2%;
  align-items:center;
}
@media (max-width:900px){.r-body{grid-template-columns:1fr;}}

/* ── Current award: big center card ── */
.award-stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;
}
.award-type-label{
  font-size:clamp(10px,1.1vw,15px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  opacity:.65;margin-bottom:1.2%;text-align:center;
}
.award-main-card{
  width:100%;max-width:660px;
  background:linear-gradient(145deg,rgba(0,30,60,.92) 0%,rgba(0,10,30,.95) 100%);
  border:1.5px solid rgba(0,212,255,.28);
  border-radius:10px;
  padding:5% 6%;
  text-align:center;
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(0,212,255,.18),0 20px 60px rgba(0,0,0,.7);
  animation:cardIn .7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn{from{opacity:0;transform:scale(.82) translateY(5%)}to{opacity:1;transform:scale(1) translateY(0)}}
.award-main-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(0,212,255,.09),transparent 65%);
}
.card-glow{
  position:absolute;inset:0;border-radius:10px;pointer-events:none;
  border:1px solid rgba(0,212,255,.5);
  box-shadow:0 0 30px rgba(0,212,255,.25),inset 0 0 40px rgba(0,212,255,.04);
  animation:glowPulse 2.2s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(0,212,255,.2),inset 0 0 30px rgba(0,212,255,.03)}50%{box-shadow:0 0 50px rgba(0,212,255,.55),inset 0 0 50px rgba(0,212,255,.07)}}

.award-crown-wrap{margin-bottom:3%;animation:crownIn 1s cubic-bezier(.34,1.56,.64,1) .15s both;}
@keyframes crownIn{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.award-winner-name{
  font-size:clamp(28px,5.5vw,72px);font-weight:900;line-height:1.05;
  color:#fff;letter-spacing:-.02em;position:relative;
  animation:nameSlide .7s cubic-bezier(.34,1.56,.64,1) .25s both;
  text-shadow:0 0 40px rgba(0,212,255,.5);
}
@keyframes nameSlide{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.award-winner-song{
  font-size:clamp(12px,1.5vw,20px);color:rgba(255,255,255,.65);margin-top:1%;
  animation:nameSlide .7s .4s both;
}
.award-score-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:2.5%;
  background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.22);
  border-radius:100px;padding:.4em 1.2em;
  font-size:clamp(11px,1.2vw,15px);font-weight:700;color:rgba(0,212,255,.9);
  animation:nameSlide .7s .5s both;
}
.award-note-text{
  font-size:clamp(10px,1vw,13px);color:rgba(255,255,255,.38);margin-top:1.5%;
  animation:nameSlide .7s .55s both;
}

/* Gold override */
.is-grand .award-main-card{
  border-color:rgba(251,191,36,.45);
  box-shadow:0 0 80px rgba(251,191,36,.25),0 20px 60px rgba(0,0,0,.7);
}
.is-grand .card-glow{border-color:rgba(251,191,36,.55);box-shadow:0 0 40px rgba(251,191,36,.3),inset 0 0 50px rgba(251,191,36,.06);}
@keyframes glowPulseGold{0%,100%{box-shadow:0 0 30px rgba(251,191,36,.25)}50%{box-shadow:0 0 70px rgba(251,191,36,.65)}}
.is-grand .card-glow{animation:glowPulseGold 2s ease-in-out infinite;}
.is-grand .award-winner-name{text-shadow:0 0 40px rgba(251,191,36,.6);}
.is-grand .award-main-card::before{background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(251,191,36,.1),transparent 65%);}
.is-grand .award-score-badge{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25);color:rgba(251,191,36,.95);}

/* Red (popularity) override */
.is-pop .award-main-card{border-color:rgba(244,63,94,.4);}
.is-pop .card-glow{border-color:rgba(244,63,94,.5);}
.is-pop .award-score-badge{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.25);color:rgba(244,63,94,.95);}

/* Purple (special) override */
.is-special .award-main-card{border-color:rgba(168,85,247,.4);}
.is-special .card-glow{border-color:rgba(168,85,247,.5);}
.is-special .award-score-badge{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.25);color:rgba(168,85,247,.95);}

/* ── Right: revealed history ── */
.award-history{
  height:100%;display:flex;flex-direction:column;gap:1.5%;
  overflow:hidden;
}
.history-label{
  font-size:clamp(9px,1vw,13px);font-weight:700;letter-spacing:.14em;
  color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:1%;
}
.history-item{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:3% 4%;
  animation:histIn .5s cubic-bezier(.34,1.56,.64,1) both;
  flex-shrink:0;
}
@keyframes histIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.hi-badge{
  display:inline-block;font-size:clamp(8px,.9vw,11px);font-weight:700;letter-spacing:.08em;
  padding:2px 8px;border-radius:100px;margin-bottom:3px;
}
.hi-badge.cyan{background:rgba(0,212,255,.12);color:rgba(0,212,255,.9);border:1px solid rgba(0,212,255,.2);}
.hi-badge.gold{background:rgba(251,191,36,.12);color:rgba(251,191,36,.95);border:1px solid rgba(251,191,36,.2);}
.hi-badge.red{background:rgba(244,63,94,.1);color:rgba(244,63,94,.95);border:1px solid rgba(244,63,94,.2);}
.hi-badge.purple{background:rgba(168,85,247,.1);color:rgba(168,85,247,.95);border:1px solid rgba(168,85,247,.2);}
.hi-name{font-size:clamp(12px,1.4vw,18px);font-weight:800;color:#fff;line-height:1.2;}
.hi-song{font-size:clamp(9px,.9vw,12px);color:rgba(255,255,255,.38);margin-top:1px;}

/* ── Bottom: rank bar ── */
.rank-bar{
  position:absolute;bottom:0;left:0;right:0;
  height:14%;z-index:10;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 80%,transparent 100%);
  display:flex;align-items:center;padding:0 3%;gap:1.5%;
  overflow:hidden;
}
.rank-item{
  display:flex;align-items:center;gap:.5%;white-space:nowrap;
  flex-shrink:0;
}
.rank-num{
  font-size:clamp(9px,.9vw,13px);font-weight:900;
  width:1.6em;text-align:center;
}
.rank-num.r1{color:#fbbf24;}
.rank-num.r2{color:#94a3b8;}
.rank-num.r3{color:#cd7f32;}
.rank-num.rn{color:rgba(255,255,255,.35);}
.rank-name{font-size:clamp(10px,1vw,14px);font-weight:700;color:rgba(255,255,255,.85);}
.rank-score{font-size:clamp(9px,.9vw,12px);font-weight:600;color:rgba(0,212,255,.7);margin-left:.3%;}
.rank-sep{width:1px;height:60%;background:rgba(255,255,255,.1);flex-shrink:0;}

/* ── Waiting state ── */
.waiting-state{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;
}
.waiting-pulse{
  width:clamp(60px,8vw,90px);height:clamp(60px,8vw,90px);border-radius:50%;
  background:rgba(0,212,255,.08);border:2px solid rgba(0,212,255,.25);
  display:flex;align-items:center;justify-content:center;
  animation:waitPulse 2s ease-in-out infinite;
}
@keyframes waitPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.3)}50%{box-shadow:0 0 0 20px rgba(0,212,255,0)}}
.waiting-title{font-size:clamp(16px,2vw,28px);font-weight:800;color:rgba(0,212,255,.75);}
.waiting-sub{font-size:clamp(11px,1.2vw,16px);color:rgba(255,255,255,.35);}

/* ── Admin bar ── */
.admin-bar{
  position:fixed;top:12px;right:12px;z-index:200;
  display:flex;gap:8px;
  background:rgba(0,0,0,.85);border:1px solid rgba(0,212,255,.25);
  border-radius:8px;padding:8px 12px;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
}
.admin-btn{
  padding:7px 16px;
  background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);
  color:rgba(0,212,255,.9);font-family:inherit;font-size:12px;font-weight:700;
  border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.admin-btn:hover{background:rgba(0,212,255,.2);border-color:rgba(0,212,255,.5);}
.admin-btn:disabled{opacity:.3;cursor:not-allowed;}

/* ── Confetti ── */
.confetti{position:absolute;top:0;left:50%;pointer-events:none;z-index:20;}
.confetto{
  position:absolute;width:8px;height:8px;border-radius:2px;
  animation:confettoFall 2.5s ease-in both;
}
@keyframes confettoFall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ── Fullscreen btn ── */
.fs-btn{
  position:fixed;bottom:12px;right:12px;z-index:200;
  background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.18);
  color:rgba(0,212,255,.55);font-family:inherit;font-size:11px;
  border-radius:6px;padding:5px 10px;cursor:pointer;transition:all .15s;
}
.fs-btn:hover{background:rgba(0,212,255,.18);}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage-16x9" id="stage16">
    <canvas class="starfield" id="starfield"></canvas>
    <div class="bg-glow"></div>

    <div class="r-header">
      <div class="r-logo">ASEA 2026</div>
      <div class="r-title">창공제 노래 콘테스트 결과 발표</div>
      <div class="r-phase" id="phaseLabel"></div>
    </div>

    <div class="r-body" id="rBody" style="display:none">
      <div class="award-stage" id="awardStage"></div>
      <div class="award-history" id="awardHistory"></div>
    </div>

    <div class="waiting-state" id="waitingState">
      <div class="waiting-pulse">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(0,212,255,.7)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="waiting-title">결과 발표 대기 중</div>
      <div class="waiting-sub">관리자가 결과를 발표하면 이 화면에 표시됩니다</div>
    </div>

    <div class="rank-bar" id="rankBar" style="display:none"></div>
  </div>
</div>

<div class="admin-bar" id="adminBar" style="display:none">
  <span style="font-size:11px;color:rgba(0,212,255,.45);align-self:center">관리자</span>
  <button class="admin-btn" id="nextBtn" onclick="revealNext()">다음 발표</button>
  <button class="admin-btn" onclick="location.href='changong-manage.html'">관리자 패널</button>
</div>

<button class="fs-btn" onclick="toggleFullscreen()">
  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  전체화면
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
(function(){

var SB_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
var sb = supabase.createClient(SB_URL, SB_KEY, {db:{schema:'cgf'}});

var isAdmin = new URLSearchParams(location.search).get('admin') === '1'
  || sessionStorage.getItem('cgf_admin') === '1';

var awards = [];
var contestants = [];
var scores = [];
var votes = [];
var currentReveal = -1;

var AWARD_ORDER = [
  {type:'merit',       label:'우수상',         color:'cyan'},
  {type:'excellence',  label:'최우수상',        color:'cyan'},
  {type:'grand',       label:'대상',            color:'gold'},
  {type:'popularity',  label:'인기상',          color:'red'},
  {type:'judge_special',label:'심사위원 특별상', color:'purple'},
  {type:'mc_special',  label:'MC 특별상',        color:'purple'}
];

if (isAdmin) document.getElementById('adminBar').style.display = 'flex';

initStarfield();
init();

async function init() {
  var [awRes, cRes, sRes, vRes, stRes] = await Promise.all([
    sb.from('awards').select('*, contestant:contestant_id(id,name,song_title,song_artist)').order('reveal_order',{ascending:true,nullsFirst:false}),
    sb.from('contestants').select('*').order('seq',{ascending:true,nullsFirst:false}),
    sb.from('scores').select('*'),
    sb.from('votes').select('contestant_id,phase,stars'),
    sb.from('state').select('*').eq('id',1).single()
  ]);
  awards = awRes.data || [];
  contestants = cRes.data || [];
  scores = sRes.data || [];
  votes = vRes.data || [];
  currentReveal = awards.filter(function(a){return a.revealed;}).length - 1;
  var phase = (stRes.data && stRes.data.phase) || 'prelim';
  var phaseNames = {prelim:'예선',semi:'본선',final:'결선',awards:'시상식'};
  document.getElementById('phaseLabel').textContent = phaseNames[phase] || phase;
  render();
  subscribeRealtime();
}

function subscribeRealtime() {
  sb.channel('cgf-result-rt')
    .on('postgres_changes',{event:'*',schema:'cgf',table:'awards'},async function(){
      var {data} = await sb.from('awards').select('*, contestant:contestant_id(id,name,song_title,song_artist)').order('reveal_order',{ascending:true,nullsFirst:false});
      awards = data || [];
      var nr = awards.filter(function(a){return a.revealed;}).length - 1;
      if (nr > currentReveal) {
        currentReveal = nr;
        render(true);
        if (awards[currentReveal] && awards[currentReveal].award_type === 'grand') spawnConfetti();
      } else {
        render(false);
      }
    })
    .on('postgres_changes',{event:'*',schema:'cgf',table:'scores'},async function(){
      var {data} = await sb.from('scores').select('*');
      scores = data || [];
      renderRankBar();
    })
    .on('postgres_changes',{event:'*',schema:'cgf',table:'votes'},async function(){
      var {data} = await sb.from('votes').select('contestant_id,phase,stars');
      votes = data || [];
      renderRankBar();
    })
    .subscribe();
}

function render(animated) {
  var revealed = awards.filter(function(a){return a.revealed;});
  var waiting = document.getElementById('waitingState');
  var body = document.getElementById('rBody');

  if (!revealed.length) {
    waiting.style.display = 'flex';
    body.style.display = 'none';
    document.getElementById('rankBar').style.display = 'none';
    return;
  }

  waiting.style.display = 'none';
  body.style.display = 'grid';

  var latest = revealed[revealed.length - 1];
  var prev = revealed.slice(0, -1);

  renderAwardCard(latest, animated);
  renderHistory(prev);
  renderRankBar();
  updateAdminBtn(revealed);
}

function renderAwardCard(award, animated) {
  var aType = AWARD_ORDER.find(function(o){return o.type===award.award_type;}) || {label:award.award_type,color:'cyan'};
  var c = award.contestant || {};
  var isGrand = award.award_type === 'grand';
  var isPop = award.award_type === 'popularity';
  var isSpecial = award.award_type === 'judge_special' || award.award_type === 'mc_special';

  var wrapClass = 'award-stage-inner'+(isGrand?' is-grand':isPop?' is-pop':isSpecial?' is-special':'');
  var html = '<div class="award-type-label" style="color:'+(aType.color==='gold'?'rgba(251,191,36,.8)':aType.color==='red'?'rgba(244,63,94,.8)':aType.color==='purple'?'rgba(168,85,247,.8)':'rgba(0,212,255,.75)')+'">'
    +esc(aType.label)+' 발표</div>';

  html += '<div class="'+wrapClass+'">';
  html += '<div class="award-main-card'+(animated?'':' static')+'">';
  html += '<div class="card-glow"></div>';
  html += '<div class="award-crown-wrap">'+awardCrown(award.award_type, aType.color)+'</div>';
  html += '<div class="award-winner-name">'+esc(c.name||'—')+'</div>';
  if (c.song_title) {
    html += '<div class="award-winner-song">♪ '+esc(c.song_title)+(c.song_artist?' · '+esc(c.song_artist):'')+'</div>';
  }
  var score = calcScore(c.id);
  if (score !== null) {
    html += '<div class="award-score-badge">'+score.toFixed(1)+' pts</div>';
  }
  if (award.note) {
    html += '<div class="award-note-text">'+esc(award.note)+'</div>';
  }
  html += '</div></div>';

  document.getElementById('awardStage').innerHTML = html;
}

function renderHistory(prev) {
  var el = document.getElementById('awardHistory');
  if (!prev.length) { el.innerHTML = ''; return; }
  var html = '<div class="history-label">발표 완료</div>';
  prev.slice().reverse().forEach(function(a){
    var at = AWARD_ORDER.find(function(o){return o.type===a.award_type;})||{label:a.award_type,color:'cyan'};
    var ac = a.contestant || {};
    html += '<div class="history-item">'
      +'<div class="hi-badge '+at.color+'">'+esc(at.label)+'</div>'
      +'<div class="hi-name">'+esc(ac.name||'—')+'</div>'
      +(ac.song_title?'<div class="hi-song">♪ '+esc(ac.song_title)+'</div>':'')
      +'</div>';
  });
  el.innerHTML = html;
}

function renderRankBar() {
  var bar = document.getElementById('rankBar');
  if (!contestants.length) { bar.style.display = 'none'; return; }
  var ranked = contestants.map(function(c){
    return {name:c.name, final:calcScore(c.id)};
  }).filter(function(c){return c.final !== null;})
    .sort(function(a,b){return b.final - a.final;});
  if (!ranked.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  var numClass = ['r1','r2','r3'];
  var html = ranked.slice(0,12).map(function(r,i){
    var nc = numClass[i] || 'rn';
    var sep = i > 0 ? '<div class="rank-sep"></div>' : '';
    return sep+'<div class="rank-item">'
      +'<div class="rank-num '+nc+'">'+(i+1)+'</div>'
      +'<div class="rank-name">'+esc(r.name)+'</div>'
      +'<div class="rank-score">'+r.final.toFixed(1)+'</div>'
      +'</div>';
  }).join('');
  bar.innerHTML = html;
}

function calcScore(cid) {
  if (!cid) return null;
  var cScores = scores.filter(function(s){return s.contestant_id===cid;});
  var cVotes  = votes.filter(function(v){return v.contestant_id===cid;});
  if (!cScores.length && !cVotes.length) return null;
  var judgeAvg = cScores.length
    ? cScores.reduce(function(s,x){return s+(x.total||0);},0) / cScores.length
    : 0;
  var voteAvg = cVotes.length
    ? cVotes.reduce(function(s,x){return s+(x.stars||0);},0) / cVotes.length
    : 0;
  return judgeAvg * 0.6 + voteAvg * 8;
}

function updateAdminBtn(revealed) {
  var nextBtn = document.getElementById('nextBtn');
  if (!nextBtn) return;
  var assigned = awards.filter(function(a){return !!a.contestant_id;});
  var allDone = revealed.length >= assigned.length;
  nextBtn.disabled = allDone;
  nextBtn.textContent = allDone ? '모두 발표됨' : '다음 발표';
}

window.revealNext = async function() {
  var assigned = awards.filter(function(a){return !!a.contestant_id;});
  var unrevealed = assigned.filter(function(a){return !a.revealed;});
  if (!unrevealed.length) return;
  var next = null;
  for (var i = 0; i < AWARD_ORDER.length; i++) {
    var t = AWARD_ORDER[i].type;
    next = unrevealed.find(function(a){return a.award_type===t;});
    if (next) break;
  }
  if (!next) next = unrevealed[0];
  var revCount = awards.filter(function(a){return a.revealed;}).length;
  await sb.from('awards').update({revealed:true, reveal_order:revCount+1}).eq('id',next.id);
};

window.toggleFullscreen = function() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

function spawnConfetti() {
  var colors = ['#00d4ff','#fbbf24','#f87171','#a78bfa','#34d399'];
  var stage = document.getElementById('stage16');
  var container = document.createElement('div');
  container.className = 'confetti';
  for (var i = 0; i < 100; i++) {
    var el = document.createElement('div');
    el.className = 'confetto';
    el.style.cssText='left:'+(Math.random()*800-400)+'px;background:'+colors[Math.floor(Math.random()*5)]
      +';animation-delay:'+(Math.random()*1.2)+'s;animation-duration:'+(2+Math.random()*1.5)+'s'
      +';width:'+(5+Math.random()*8)+'px;height:'+(5+Math.random()*8)+'px';
    container.appendChild(el);
  }
  stage.appendChild(container);
  setTimeout(function(){container.remove();},5000);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── Starfield ── */
function initStarfield() {
  var canvas = document.getElementById('starfield');
  var ctx = canvas.getContext('2d');
  var stars = [];
  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resize();
  new ResizeObserver(resize).observe(canvas);
  for (var i = 0; i < 220; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.4,
      a: Math.random(),
      spd: 0.003 + Math.random() * 0.012,
      ph: Math.random() * Math.PI * 2
    });
  }
  var t = 0;
  (function loop() {
    requestAnimationFrame(loop);
    t += 0.016;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#03060F';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(function(s) {
      var alpha = s.a * (0.4 + 0.6 * Math.sin(t * s.spd * 40 + s.ph));
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,210,255,' + alpha + ')';
      ctx.fill();
    });
  })();
}

})();
