<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대관 신청</title>
  <link rel="stylesheet" href="facility-request.css">
</head>
<body>

<div class="fr-wrap">
  <!-- 헤더 -->
  <div class="fr-header">
    <div class="fr-logo">🏢</div>
    <h1 class="fr-title">시설 대관 신청</h1>
    <p class="fr-subtitle">아래 양식을 작성하여 대관을 신청하세요.<br>검토 후 등록하신 이메일로 결과를 안내드립니다.</p>
  </div>

  <!-- 오류/성공 메시지 -->
  <div id="fr-alert" class="fr-alert" style="display:none"></div>

  <!-- 신청 폼 -->
  <form id="fr-form" class="fr-form" novalidate>

    <fieldset class="fr-fieldset">
      <legend class="fr-legend">📍 시설 선택</legend>
      <div class="fr-field">
        <label class="fr-label">건물 <span class="fr-req">*</span></label>
        <select id="fr-building" class="fr-select" required>
          <option value="">건물을 선택하세요</option>
        </select>
      </div>
      <div class="fr-field">
        <label class="fr-label">호실 <span class="fr-req">*</span></label>
        <select id="fr-room" class="fr-select" required>
          <option value="">먼저 건물을 선택하세요</option>
        </select>
      </div>
    </fieldset>

    <fieldset class="fr-fieldset">
      <legend class="fr-legend">📅 이용 일시</legend>
      <div class="fr-row">
        <div class="fr-field">
          <label class="fr-label">시작 일시 <span class="fr-req">*</span></label>
          <input id="fr-start" type="datetime-local" class="fr-input" required>
        </div>
        <div class="fr-field">
          <label class="fr-label">종료 일시 <span class="fr-req">*</span></label>
          <input id="fr-end" type="datetime-local" class="fr-input" required>
        </div>
      </div>
    </fieldset>

    <fieldset class="fr-fieldset">
      <legend class="fr-legend">📝 신청 내용</legend>
      <div class="fr-field">
        <label class="fr-label">행사(신청) 제목 <span class="fr-req">*</span></label>
        <input id="fr-title" type="text" class="fr-input" placeholder="예: 2학기 입학설명회" required>
      </div>
      <div class="fr-field">
        <label class="fr-label">사용 목적</label>
        <input id="fr-purpose" type="text" class="fr-input" placeholder="행사, 강의, 회의, 촬영 등">
      </div>
      <div class="fr-field">
        <label class="fr-label">예상 참석 인원</label>
        <input id="fr-attendees" type="text" class="fr-input" placeholder="예: 50명">
      </div>
    </fieldset>

    <fieldset class="fr-fieldset">
      <legend class="fr-legend">👤 신청자 정보</legend>
      <div class="fr-row">
        <div class="fr-field">
          <label class="fr-label">성명 <span class="fr-req">*</span></label>
          <input id="fr-name" type="text" class="fr-input" placeholder="홍길동" required>
        </div>
        <div class="fr-field">
          <label class="fr-label">소속/기관 <span class="fr-req">*</span></label>
          <input id="fr-org" type="text" class="fr-input" placeholder="ASEA 항공학원" required>
        </div>
      </div>
      <div class="fr-field">
        <label class="fr-label">연락처 <span class="fr-req">*</span></label>
        <input id="fr-phone" type="tel" class="fr-input" placeholder="010-0000-0000" required>
      </div>
      <div class="fr-field">
        <label class="fr-label">이메일 <span class="fr-req">*</span></label>
        <input id="fr-email" type="email" class="fr-input" placeholder="example@email.com" required>
        <div class="fr-hint">승인/반려 결과가 이 이메일로 발송됩니다.</div>
      </div>
    </fieldset>

    <div class="fr-field fr-agree-wrap">
      <label class="fr-checkbox-label">
        <input type="checkbox" id="fr-agree" required>
        <span>위 내용으로 대관을 신청하며, 개인정보 수집·이용에 동의합니다.</span>
      </label>
    </div>

    <button type="submit" id="fr-submit-btn" class="fr-submit-btn">신청하기</button>
  </form>

  <!-- 완료 화면 -->
  <div id="fr-success" class="fr-success" style="display:none">
    <div class="fr-success-icon">✅</div>
    <h2>신청이 접수되었습니다!</h2>
    <p>담당자 검토 후 등록하신 이메일(<span id="fr-success-email"></span>)로<br>결과를 안내드립니다.</p>
    <p style="margin-top:8px;font-size:13px;color:#888">통상 1~2 영업일 이내 처리됩니다.</p>
    <button class="fr-again-btn" onclick="location.reload()">다시 신청하기</button>
  </div>

  <div class="fr-footer">
    신청 관련 문의: 담당 부서로 연락해 주세요.
  </div>
</div>

<script src="facility-request.js"></script>
</body>
</html>
