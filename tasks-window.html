<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할일 작업창</title>
  <style>
    :root {
      --accent: #1A73E8; --accent-d: #1557B0; --accent-l: #E8F0FE;
      --bg: #F4F7FB; --card: #fff; --bd: #E2E8F0; --txt: #202124; --muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--txt); min-height: 100vh; font-size: 13px;
    }
    /* 헤더 */
    .tw-header {
      background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #fff;
      padding: 9px 12px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5;
    }
    .tw-header h1 { font-size: 14px; font-weight: 700; flex: 1; }
    .tw-header .ico { font-size: 16px; }
    .tw-hbtn { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 6px; padding: 5px 9px; font-size: 11.5px; cursor: pointer; white-space: nowrap; }
    .tw-hbtn:hover { background: rgba(255,255,255,.32); }

    .tw-wrap { padding: 9px 10px 14px; max-width: 820px; margin: 0 auto; }

    /* 새 할일 + 비고 + 마감일 (콤팩트, 한 줄 래핑) */
    .tw-new {
      display: flex; gap: 5px; flex-wrap: wrap; align-items: center; background: var(--card);
      border: 1px solid var(--bd); border-radius: 9px; padding: 7px; margin-bottom: 9px;
    }
    .tw-new input[type=text] { border: 1px solid var(--bd); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
    #tw-new-title { flex: 2 1 180px; min-width: 130px; font-weight: 600; }
    #tw-new-notes { flex: 1 1 120px; min-width: 90px; color: #444; }
    .tw-new input[type=date] { border: 1px solid var(--bd); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    .tw-add { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .tw-add:hover { background: var(--accent-d); }

    /* 목록(카테고리) 탭 */
    .tw-lists { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; scrollbar-width: thin; }
    .tw-listtab { flex: 0 0 auto; background: var(--card); border: 1px solid var(--bd); border-radius: 99px; padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .tw-listtab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

    /* 선택 바 (완료 처리/해제) */
    .tw-selbar {
      display: flex; align-items: center; gap: 6px; background: var(--accent-l);
      border: 1px solid #C6DAFB; border-radius: 8px; padding: 6px 9px; margin-bottom: 7px;
    }
    .tw-selbar[hidden] { display: none; }
    #tw-selcount { font-size: 12px; font-weight: 700; color: var(--accent-d); flex: 1; }
    .tw-selbtn { border: none; border-radius: 6px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
    #tw-complete { background: var(--accent); color: #fff; }
    #tw-complete:hover { background: var(--accent-d); }
    #tw-uncomplete { background: #fff; color: var(--accent-d); border: 1px solid #B9D2F7; }
    #tw-clearsel { background: transparent; color: var(--muted); }

    .tw-toolbar { display: flex; justify-content: flex-end; margin-bottom: 5px; }
    #tw-sortdate { background: #fff; border: 1px solid var(--bd); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: #374151; }
    #tw-sortdate:hover { background: #F0F4FA; }

    .tw-status { font-size: 11.5px; color: var(--muted); min-height: 15px; margin: 1px 2px 5px; }
    .tw-status.tw-err { color: #C62828; white-space: pre-line; }

    /* 할일 항목 (촘촘) */
    .tw-group { display: flex; flex-direction: column; }
    .tw-task {
      display: flex; align-items: center; gap: 7px; background: var(--card);
      border: 1px solid var(--bd); border-radius: 8px; padding: 6px 9px; margin-bottom: 5px;
      position: relative;
    }
    .tw-task.is-sel { background: var(--accent-l); border-color: #B9D2F7; }
    .tw-task.dragging { opacity: .45; }
    .tw-task.drop-before::before, .tw-task.drop-after::after {
      content: ''; position: absolute; left: 6px; right: 6px; height: 3px; border-radius: 2px;
      background: var(--accent);
    }
    .tw-task.drop-before::before { top: -4px; }
    .tw-task.drop-after::after { bottom: -4px; }

    .tw-grip { flex: 0 0 auto; width: 12px; color: #B6BdC8; cursor: grab; font-size: 13px; line-height: 1; user-select: none; text-align: center; }
    .tw-grip-off { cursor: default; }
    .tw-sel {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent);
      background: #fff; color: #fff; cursor: pointer; font-size: 11px; line-height: 1; padding: 0;
    }
    .tw-sel.on { background: var(--accent); }
    .tw-main { flex: 1 1 auto; min-width: 0; }
    .tw-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tw-task.is-done .tw-title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
    .tw-notes {
      font-size: 11.5px; color: var(--muted); margin-top: 1px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tw-due { flex: 0 0 auto; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 3px 7px; white-space: nowrap; }
    .tw-due-over  { background: #FDE7E7; color: #D32F2F; }
    .tw-due-today { background: #FFF1DE; color: #E8710A; }
    .tw-due-soon  { background: var(--accent-l); color: var(--accent-d); }
    .tw-due-wk    { background: #EAF1FC; color: #3B6FB5; }
    .tw-due-far   { background: #EEF1F5; color: #6B7280; }
    .tw-due-none  { background: #F2F4F7; color: #A0A6AE; }
    .tw-edit, .tw-del { flex: 0 0 auto; background: none; border: none; cursor: pointer; font-size: 13px; opacity: .55; padding: 2px; }
    .tw-edit:hover, .tw-del:hover { opacity: 1; }

    .tw-done-head { margin: 8px 2px 4px; font-size: 12px; color: var(--muted); }
    .tw-done-head label { cursor: pointer; }
    .tw-empty { color: var(--muted); text-align: center; padding: 26px 12px; white-space: pre-line; line-height: 1.6; }
    .tw-empty-sm { padding: 12px; font-size: 12px; }

    /* 수정 모달 */
    .tw-modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .tw-modal[hidden] { display: none; }
    .tw-dialog { background: #fff; border-radius: 12px; width: 100%; max-width: 400px; padding: 16px; }
    .tw-dialog h2 { font-size: 14px; margin-bottom: 11px; }
    .tw-field { margin-bottom: 9px; }
    .tw-field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
    .tw-field input, .tw-field textarea { width: 100%; border: 1px solid var(--bd); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
    .tw-field textarea { resize: vertical; min-height: 60px; }
    .tw-dialog-btns { display: flex; justify-content: flex-end; gap: 7px; margin-top: 12px; }
    .tw-dialog-btns button { border: none; border-radius: 7px; padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #tw-edit-cancel { background: #eef0f3; color: #444; }
    #tw-edit-save { background: var(--accent); color: #fff; }

    .tw-foot { text-align: center; font-size: 10.5px; color: #9AA3AB; padding: 10px 0 4px; }
  </style>
</head>
<body>
  <div class="tw-header">
    <span class="ico">✓</span>
    <h1>나의 할일 작업창</h1>
    <button class="tw-hbtn" id="tw-refresh" title="새로고침">↻ 새로고침</button>
    <button class="tw-hbtn" id="tw-open-google" title="구글 할일 열기">구글 할일 ↗</button>
  </div>

  <div class="tw-wrap">
    <!-- 새 할일 + 비고 + 마감일 -->
    <div class="tw-new">
      <input type="text" id="tw-new-title" placeholder="새 할일">
      <input type="text" id="tw-new-notes" placeholder="비고(선택)">
      <input type="date" id="tw-new-due" title="마감일">
      <button class="tw-add" id="tw-add-btn">＋ 추가</button>
    </div>

    <!-- 목록 탭 -->
    <div class="tw-lists" id="tw-lists"></div>

    <!-- 선택 바 -->
    <div class="tw-selbar" id="tw-selbar" hidden>
      <span id="tw-selcount">0개 선택</span>
      <button class="tw-selbtn" id="tw-complete">✔ 완료 처리</button>
      <button class="tw-selbtn" id="tw-uncomplete">↺ 완료 해제</button>
      <button class="tw-selbtn" id="tw-clearsel">선택 해제</button>
    </div>

    <!-- 정렬 -->
    <div class="tw-toolbar">
      <button id="tw-sortdate" title="마감일이 빠른 순으로 정렬(영구 반영)">📅 일자순 정렬</button>
    </div>

    <div class="tw-status" id="tw-status"></div>

    <!-- 할일 목록 -->
    <div id="tw-tasks"></div>
    <!-- 완료 섹션 -->
    <div id="tw-done-wrap"></div>

    <div class="tw-foot">동그라미로 여러 개 선택 → 완료 처리 · 드래그로 순서 이동 · 변경은 구글 할일/캘린더에 즉시 반영</div>
  </div>

  <!-- 수정 모달 -->
  <div class="tw-modal" id="tw-edit-modal" hidden>
    <div class="tw-dialog">
      <h2>할일 수정</h2>
      <div class="tw-field"><label>제목</label><input type="text" id="tw-edit-title"></div>
      <div class="tw-field"><label>비고(메모)</label><textarea id="tw-edit-notes"></textarea></div>
      <div class="tw-field"><label>마감일</label><input type="date" id="tw-edit-due"></div>
      <div class="tw-dialog-btns">
        <button id="tw-edit-cancel">취소</button>
        <button id="tw-edit-save">저장</button>
      </div>
    </div>
  </div>

  <script src="tasks-window.js?v=20260621tw2"></script>
</body>
</html>
