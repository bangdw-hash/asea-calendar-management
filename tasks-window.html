<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할일 작업창</title>
  <style>
    :root {
      --accent: #0B8043; --accent-d: #0a6e39;
      --bg: #F3F6F4; --card: #fff; --bd: #E2E8E4; --txt: #202124; --muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--txt); min-height: 100vh; font-size: 14px;
    }
    .tw-header {
      background: linear-gradient(135deg, var(--accent), var(--accent-d)); color: #fff;
      padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5;
    }
    .tw-header h1 { font-size: 16px; font-weight: 700; flex: 1; }
    .tw-header .ico { font-size: 20px; }
    .tw-hbtn { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 7px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .tw-hbtn:hover { background: rgba(255,255,255,.3); }

    .tw-wrap { padding: 12px; max-width: 720px; margin: 0 auto; }

    /* 새 할일 입력 */
    .tw-new {
      display: flex; gap: 6px; flex-wrap: wrap; background: var(--card);
      border: 1px solid var(--bd); border-radius: 12px; padding: 10px; margin-bottom: 12px;
    }
    .tw-new input[type=text] { flex: 1 1 180px; min-width: 140px; border: 1px solid var(--bd); border-radius: 8px; padding: 9px 11px; font-size: 14px; }
    .tw-new input[type=date] { border: 1px solid var(--bd); border-radius: 8px; padding: 9px 11px; font-size: 13px; }
    .tw-add { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .tw-add:hover { background: var(--accent-d); }

    /* 목록 탭 */
    .tw-lists { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; scrollbar-width: thin; }
    .tw-listtab { flex: 0 0 auto; background: var(--card); border: 1px solid var(--bd); border-radius: 99px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .tw-listtab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

    .tw-status { font-size: 12px; color: var(--muted); min-height: 16px; margin: 2px 2px 8px; }
    .tw-status.tw-err { color: #C62828; white-space: pre-line; }

    /* 할일 항목 */
    #tw-tasks { display: flex; flex-direction: column; gap: 8px; }
    .tw-task {
      display: flex; align-items: flex-start; gap: 10px; background: var(--card);
      border: 1px solid var(--bd); border-radius: 12px; padding: 10px 12px;
    }
    .tw-check {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent);
      background: #fff; color: var(--accent); cursor: pointer; font-size: 13px; line-height: 1; margin-top: 1px;
    }
    .tw-task.is-done .tw-check { background: var(--accent); color: #fff; }
    .tw-main { flex: 1 1 auto; min-width: 0; }
    .tw-title { font-size: 14.5px; font-weight: 600; word-break: break-word; }
    .tw-task.is-done .tw-title { text-decoration: line-through; color: var(--muted); }
    .tw-notes { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
    .tw-due { font-size: 12px; color: var(--accent-d); margin-top: 4px; }
    .tw-due.tw-nodue { color: #B0B6BC; }
    .tw-rowbtns { display: flex; flex-direction: column; gap: 4px; }
    .tw-rowbtns button { background: none; border: none; cursor: pointer; font-size: 14px; opacity: .65; padding: 2px; }
    .tw-rowbtns button:hover { opacity: 1; }

    .tw-done-head { margin: 10px 2px 2px; font-size: 12.5px; color: var(--muted); }
    .tw-done-head label { cursor: pointer; }
    .tw-done-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .tw-empty { color: var(--muted); text-align: center; padding: 30px 12px; white-space: pre-line; line-height: 1.6; }

    /* 수정 모달 */
    .tw-modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .tw-modal[hidden] { display: none; }
    .tw-dialog { background: #fff; border-radius: 14px; width: 100%; max-width: 420px; padding: 18px; }
    .tw-dialog h2 { font-size: 15px; margin-bottom: 12px; }
    .tw-field { margin-bottom: 10px; }
    .tw-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .tw-field input, .tw-field textarea { width: 100%; border: 1px solid var(--bd); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; }
    .tw-field textarea { resize: vertical; min-height: 70px; }
    .tw-dialog-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .tw-dialog-btns button { border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #tw-edit-cancel { background: #eef0f3; color: #444; }
    #tw-edit-save { background: var(--accent); color: #fff; }

    .tw-foot { text-align: center; font-size: 11px; color: #9AA3AB; padding: 14px 0 6px; }
  </style>
</head>
<body>
  <div class="tw-header">
    <span class="ico">✓</span>
    <h1>나의 할일 작업창</h1>
    <button class="tw-hbtn" id="tw-refresh" title="새로고침">↻ 새로고침</button>
    <button class="tw-hbtn" id="tw-open-google" title="구글 할일 열기">구글 할일 ↗</button>
  </div>

  <div class="tw-wrap">
    <!-- 새 할일 추가 -->
    <div class="tw-new">
      <input type="text" id="tw-new-title" placeholder="새 할일 입력 후 Enter 또는 추가">
      <input type="date" id="tw-new-due" title="마감일">
      <button class="tw-add" id="tw-add-btn">추가</button>
    </div>

    <!-- 목록(카테고리) 탭 -->
    <div class="tw-lists" id="tw-lists"></div>

    <div class="tw-status" id="tw-status"></div>

    <!-- 할일 목록 -->
    <div id="tw-tasks"></div>

    <div class="tw-foot">변경 내용은 구글 할일과 캘린더에 즉시 반영됩니다.</div>
  </div>

  <!-- 수정 모달 -->
  <div class="tw-modal" id="tw-edit-modal" hidden>
    <div class="tw-dialog">
      <h2>할일 수정</h2>
      <div class="tw-field"><label>제목</label><input type="text" id="tw-edit-title"></div>
      <div class="tw-field"><label>메모</label><textarea id="tw-edit-notes"></textarea></div>
      <div class="tw-field"><label>마감일</label><input type="date" id="tw-edit-due"></div>
      <div class="tw-dialog-btns">
        <button id="tw-edit-cancel">취소</button>
        <button id="tw-edit-save">저장</button>
      </div>
    </div>
  </div>

  <script src="tasks-window.js?v=20260621tw1"></script>
</body>
</html>
