<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>생활관 입소자 포털</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: light;
  --primary: #1A73E8;
  --primary-dk: #1557B0;
  --primary-lt: #E8F0FE;
  --bg: #F0F9FF;
  --fg: #1f2937;
  --muted: #6b7280;
  --border: #e2e8f0;
  --card: #ffffff;
  --green: #16a34a; --green-lt: #dcfce7;
  --orange: #ea580c; --orange-lt: #ffedd5;
  --red: #dc2626; --red-lt: #fee2e2;
  --r: 6px;
  --sh: 0 1px 4px rgba(0,0,0,.08);
  --sh-md: 0 2px 10px rgba(0,0,0,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
}

/* ── 로그인 / PIN 화면 ─────────────────────── */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  background: linear-gradient(160deg, #e8f4ff 0%, #f0f9ff 60%);
}
.auth-logo {
  text-align: center;
  margin-bottom: 28px;
}
.auth-logo .icon-wrap {
  width: 64px; height: 64px;
  background: var(--primary);
  border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(26,115,232,.35);
}
.auth-logo h1 { font-size: 20px; font-weight: 700; color: var(--fg); }
.auth-logo p  { font-size: 13px; color: var(--muted); margin-top: 3px; }

.auth-card {
  width: 100%; max-width: 380px;
  background: var(--card);
  border-radius: 12px;
  padding: 28px 24px;
  box-shadow: var(--sh-md);
}
.auth-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: var(--fg); }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.field input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  font-size: 15px; font-family: inherit;
  transition: border-color .15s;
  background: #fff;
}
.field input:focus { outline: none; border-color: var(--primary); }

.btn-primary {
  width: 100%; padding: 13px;
  background: var(--primary); color: #fff;
  border: none; border-radius: var(--r);
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.btn-primary:hover { background: var(--primary-dk); }
.btn-primary:disabled { opacity: .5; cursor: default; }

.btn-ghost {
  background: none; border: none;
  color: var(--primary); font-size: 13px;
  cursor: pointer; font-family: inherit;
  text-decoration: underline; padding: 4px 0;
}
.err-msg { color: var(--red); font-size: 13px; margin-top: 8px; }
.muted { font-size: 12px; color: var(--muted); }

/* PIN 입력 */
.pin-dots {
  display: flex; justify-content: center; gap: 14px;
  margin: 20px 0;
}
.pin-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2.5px solid var(--border);
  transition: all .15s;
}
.pin-dot.filled { background: var(--primary); border-color: var(--primary); }
.pin-keypad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-top: 4px;
}
.pin-key {
  padding: 14px 0;
  background: #f8fafc; border: 1px solid var(--border);
  border-radius: var(--r); font-size: 20px; font-weight: 600;
  cursor: pointer; font-family: inherit; text-align: center;
  transition: background .1s;
}
.pin-key:active, .pin-key:hover { background: var(--primary-lt); color: var(--primary); }
.pin-key.del { font-size: 18px; }
.pin-save-ask {
  background: var(--primary-lt);
  border: 1px solid #c5d9f7;
  border-radius: var(--r); padding: 14px;
  margin-bottom: 18px; font-size: 13px;
}
.pin-save-ask strong { color: var(--primary); display: block; margin-bottom: 4px; }
.pin-save-btns { display: flex; gap: 8px; margin-top: 10px; }
.pin-save-btns button {
  flex: 1; padding: 9px;
  border-radius: var(--r); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; border: none;
}
.btn-yes { background: var(--primary); color: #fff; }
.btn-no  { background: #f1f5f9; color: var(--fg); }

/* ── 홈 (카드 그리드) ─────────────────────── */
.portal-wrap { max-width: 640px; margin: 0 auto; padding-bottom: 40px; }

.portal-hd {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dk) 100%);
  color: #fff;
  padding: 20px 20px 28px;
}
.portal-hd-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.portal-hd-title { font-size: 14px; font-weight: 500; opacity: .9; }
.btn-logout {
  background: rgba(255,255,255,.18); color: #fff;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: var(--r); padding: 6px 12px;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.portal-hd-user { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.hd-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.hd-badge {
  background: rgba(255,255,255,.22);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 600;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 16px;
  margin-top: -16px;
}
@media (min-width: 480px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }

.menu-card {
  background: var(--card);
  border-radius: 10px;
  padding: 18px 14px 14px;
  box-shadow: var(--sh);
  cursor: pointer;
  border: 1px solid var(--border);
  transition: box-shadow .15s, transform .1s;
  display: flex; flex-direction: column; align-items: flex-start;
}
.menu-card:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
.menu-card .card-icon {
  width: 40px; height: 40px;
  background: var(--primary-lt);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
}
.menu-card .card-icon svg { color: var(--primary); }
.menu-card .card-name { font-size: 14px; font-weight: 700; color: var(--fg); }
.menu-card .card-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.menu-card .card-badge {
  margin-top: 8px; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
}

/* ── 섹션 공통 ─────────────────────── */
.section-wrap { padding: 0 16px 20px; }
.section-hd {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; cursor: pointer;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.section-hd h2 { font-size: 15px; font-weight: 700; color: var(--fg); }
.back-btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  color: var(--primary); font-size: 13px; font-weight: 600; font-family: inherit;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px; margin-top: 12px;
}
.card h3 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; }
th { background: #f8fafc; color: #475569; font-size: 12px; font-weight: 600; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
}
.badge-green  { background: var(--green-lt);  color: var(--green); }
.badge-red    { background: var(--red-lt);    color: var(--red); }
.badge-blue   { background: var(--primary-lt); color: var(--primary); }
.badge-orange { background: var(--orange-lt); color: var(--orange); }
.badge-gray   { background: #f1f5f9; color: #475569; }

.info-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--muted); width: 90px; flex-shrink: 0; }
.info-val   { font-weight: 600; }

.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 5px; }
.form-field select, .form-field input, .form-field textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-size: 14px; font-family: inherit;
  background: #fff;
}
.form-field textarea { min-height: 100px; resize: vertical; }
.form-field select:focus, .form-field input:focus, .form-field textarea:focus {
  outline: none; border-color: var(--primary);
}

.notice-item {
  padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.notice-item:last-child { border-bottom: none; }
.notice-title { font-size: 14px; font-weight: 600; }
.notice-date  { font-size: 12px; color: var(--muted); margin-top: 3px; }
.notice-body  { font-size: 13px; margin-top: 8px; line-height: 1.7; display: none; }

.success-box {
  text-align: center; padding: 32px 16px;
}
.success-box svg { color: var(--green); margin-bottom: 12px; }
.success-box h3  { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.success-box p   { font-size: 13px; color: var(--muted); }

.overflow-x { overflow-x: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';
var SB_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
var LS_KEY  = 'dorm_resident_v1';
var PIN_KEY = 'dorm_pin_v1';

var db = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
var root = document.getElementById('root');
var ME = null;   // resident data from RPC
var VIEW = 'login'; // login | pin-save-ask | pin-setup | pin-verify | home | section:<name>
var PIN_BUF = '';
var PIN_CONFIRM_BUF = '';
var PIN_STEP = 'enter'; // enter | confirm
var SECTION_DATA = {};

// ── 유틸 ──────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
function fmtDate(s) { return s ? s.slice(0, 10) : '-'; }
function normPhone(s) { return (s || '').replace(/[^0-9]/g, ''); }
function fmtPhone(s) {
  var d = normPhone(s);
  if (d.length <= 3) return d;
  if (d.length <= 7) return d.slice(0,3) + '-' + d.slice(3);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7,11);
}

function savedSession() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e) { return null; }
}
function savedPin() {
  try { return localStorage.getItem(PIN_KEY) || ''; } catch(e) { return ''; }
}
function saveSession(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch(e) {}
}
function clearSession() {
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem(PIN_KEY); } catch(e) {}
}

// ── 진입 ──────────────────────────────────────
(function init() {
  if (!db) { root.innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626">연결 오류: 관리자에게 문의하세요.</div>'; return; }

  // 토큰 자동 로그인 (?rt=UUID)
  var rt = new URLSearchParams(location.search).get('rt');
  if (rt) { tokenLogin(rt); return; }

  // localStorage 세션 존재 시 PIN 확인
  var sess = savedSession();
  if (sess && savedPin()) {
    ME = sess;
    showPinVerify();
    return;
  }

  showLogin();
})();

async function tokenLogin(token) {
  root.innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted)">불러오는 중…</div>';
  try {
    var r = await db.rpc('dorm_resident_token_login', { p_token: token });
    if (r.error || !r.data) { showLogin('링크가 만료되었거나 유효하지 않습니다.'); return; }
    ME = r.data;
    showHome();
  } catch(e) { showLogin('오류가 발생했습니다. 관리자에게 문의하세요.'); }
}

// ── 로그인 화면 ───────────────────────────────
function showLogin(errMsg) {
  VIEW = 'login';
  root.innerHTML =
    '<div class="auth-wrap">' +
      '<div class="auth-logo">' +
        '<div class="icon-wrap">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' +
        '</div>' +
        '<h1>생활관 입소자 포털</h1>' +
        '<p>아세아항공직업전문학교 기숙사</p>' +
      '</div>' +
      '<div class="auth-card">' +
        '<h2>본인 확인</h2>' +
        '<div class="field"><label>성명</label><input id="li-name" placeholder="홍길동" autocomplete="name"></div>' +
        '<div class="field"><label>전화번호</label><input id="li-phone" placeholder="010-1234-5678" inputmode="numeric" maxlength="13"></div>' +
        (errMsg ? '<p class="err-msg">' + esc(errMsg) + '</p>' : '') +
        '<div id="li-err" class="err-msg" style="display:none"></div>' +
        '<button class="btn-primary" id="li-btn" style="margin-top:6px">조회하기</button>' +
        '<p class="muted" style="margin-top:12px;text-align:center">등록된 성명과 전화번호로 본인 정보를 조회합니다.</p>' +
      '</div>' +
    '</div>';

  var phoneInput = document.getElementById('li-phone');
  phoneInput.addEventListener('input', function() {
    var raw = normPhone(this.value);
    if (raw.length > 11) raw = raw.slice(0, 11);
    this.value = fmtPhone(raw);
  });

  document.getElementById('li-btn').addEventListener('click', doLogin);
  document.getElementById('li-name').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('li-phone').focus(); });
  document.getElementById('li-phone').addEventListener('keydown', function(e) { if(e.key==='Enter') doLogin(); });
}

async function doLogin() {
  var name  = (document.getElementById('li-name').value || '').trim();
  var phone = normPhone(document.getElementById('li-phone').value || '');
  var err   = document.getElementById('li-err');
  err.style.display = 'none';
  if (!name)  { err.textContent = '성명을 입력하세요.'; err.style.display = 'block'; return; }
  if (phone.length < 9) { err.textContent = '전화번호를 올바르게 입력하세요.'; err.style.display = 'block'; return; }

  var btn = document.getElementById('li-btn');
  btn.disabled = true; btn.textContent = '조회 중…';
  try {
    var r = await db.rpc('dorm_resident_phone_login', { p_phone: phone, p_name: name });
    if (r.error) throw new Error(r.error.message);
    if (!r.data) { err.textContent = '일치하는 정보가 없습니다. 성명과 전화번호를 확인하세요.'; err.style.display = 'block'; btn.disabled=false; btn.textContent='조회하기'; return; }
    ME = r.data;
    showPinSaveAsk();
  } catch(e) {
    err.textContent = '오류: ' + e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = '조회하기';
  }
}

// ── PIN 저장 여부 묻기 ────────────────────────
function showPinSaveAsk() {
  VIEW = 'pin-save-ask';
  root.innerHTML =
    '<div class="auth-wrap">' +
      '<div class="auth-logo">' +
        '<div class="icon-wrap">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
        '</div>' +
        '<h1>이 기기에 저장</h1>' +
        '<p>' + esc(ME.name) + ' 님, 반갑습니다</p>' +
      '</div>' +
      '<div class="auth-card">' +
        '<div class="pin-save-ask">' +
          '<strong>이 기기를 자주 사용하시나요?</strong>' +
          '저장하면 다음부터 PIN 4자리만 입력하면 바로 로그인됩니다. 다른 사람과 공유하는 기기라면 저장하지 마세요.' +
          '<div class="pin-save-btns">' +
            '<button class="btn-yes" id="ps-yes">저장하기</button>' +
            '<button class="btn-no"  id="ps-no">저장 안 함</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('ps-yes').addEventListener('click', function() { showPinSetup(); });
  document.getElementById('ps-no').addEventListener('click', function() { showHome(); });
}

// ── PIN 설정 ──────────────────────────────────
function showPinSetup() {
  VIEW = 'pin-setup';
  PIN_BUF = ''; PIN_CONFIRM_BUF = ''; PIN_STEP = 'enter';
  renderPinScreen('PIN 설정', 'PIN 4자리를 입력하세요', null);
}

function renderPinScreen(title, subtitle, err) {
  root.innerHTML =
    '<div class="auth-wrap">' +
      '<div class="auth-logo">' +
        '<div class="icon-wrap">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
        '</div>' +
        '<h1>' + esc(title) + '</h1>' +
        '<p>' + esc(subtitle) + '</p>' +
      '</div>' +
      '<div class="auth-card">' +
        '<div class="pin-dots" id="pin-dots">' +
          '<div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>' +
          '<div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>' +
        '</div>' +
        (err ? '<p class="err-msg" style="text-align:center;margin-bottom:8px">' + esc(err) + '</p>' : '') +
        '<div class="pin-keypad" id="pin-pad">' +
          [1,2,3,4,5,6,7,8,9,'','0','⌫'].map(function(k) {
            return '<button class="pin-key' + (k===''?' pin-empty':'') + (k==='⌫'?' del':'') +
              '" data-k="' + k + '">' + (k===''?'':k) + '</button>';
          }).join('') +
        '</div>' +
        '<div style="text-align:center;margin-top:14px">' +
          '<button class="btn-ghost" id="pin-cancel">취소</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('pin-pad').addEventListener('click', function(e) {
    var k = e.target.closest('.pin-key');
    if (!k || k.classList.contains('pin-empty')) return;
    var val = k.dataset.k;
    if (val === '⌫') { onPinBack(); }
    else { onPinDigit(val); }
  });
  document.getElementById('pin-cancel').addEventListener('click', function() {
    if (VIEW === 'pin-setup') { showHome(); }
    else { clearSession(); showLogin(); }
  });
}

function updatePinDots(len) {
  for (var i = 0; i < 4; i++) {
    document.getElementById('pd' + i).classList.toggle('filled', i < len);
  }
}

function onPinDigit(d) {
  if (VIEW === 'pin-setup') {
    if (PIN_STEP === 'enter') {
      if (PIN_BUF.length < 4) { PIN_BUF += d; updatePinDots(PIN_BUF.length); }
      if (PIN_BUF.length === 4) {
        setTimeout(function() { PIN_STEP = 'confirm'; renderPinScreen('PIN 확인', 'PIN을 한 번 더 입력하세요', null); }, 250);
      }
    } else {
      if (PIN_CONFIRM_BUF.length < 4) { PIN_CONFIRM_BUF += d; updatePinDots(PIN_CONFIRM_BUF.length); }
      if (PIN_CONFIRM_BUF.length === 4) {
        setTimeout(function() {
          if (PIN_BUF === PIN_CONFIRM_BUF) {
            try { localStorage.setItem(PIN_KEY, PIN_BUF); saveSession(ME); } catch(e) {}
            showHome();
          } else {
            PIN_BUF = ''; PIN_CONFIRM_BUF = ''; PIN_STEP = 'enter';
            renderPinScreen('PIN 설정', 'PIN이 일치하지 않습니다. 다시 입력하세요', 'PIN이 일치하지 않아요.');
          }
        }, 250);
      }
    }
  } else if (VIEW === 'pin-verify') {
    if (PIN_BUF.length < 4) { PIN_BUF += d; updatePinDots(PIN_BUF.length); }
    if (PIN_BUF.length === 4) {
      setTimeout(function() {
        if (PIN_BUF === savedPin()) { showHome(); }
        else { PIN_BUF = ''; renderPinVerifyScreen('PIN이 틀렸습니다. 다시 입력하세요'); }
      }, 200);
    }
  }
}
function onPinBack() {
  if (VIEW === 'pin-setup') {
    if (PIN_STEP === 'confirm') { PIN_CONFIRM_BUF = PIN_CONFIRM_BUF.slice(0,-1); updatePinDots(PIN_CONFIRM_BUF.length); }
    else { PIN_BUF = PIN_BUF.slice(0,-1); updatePinDots(PIN_BUF.length); }
  } else {
    PIN_BUF = PIN_BUF.slice(0,-1); updatePinDots(PIN_BUF.length);
  }
}

function renderPinVerifyScreen(err) {

          [1,2,3,4,5,6,7,8,9,'','0','⌫'].map(function(k) {

          }).join('') +
        '</div>' +
        '<div style="text-align:center;margin-top:14px">' +

// ── 섹션 ─────────────────────────────────────
function showSection(name) {
  VIEW = 'section:' + name;
  var titles = { contract:'내 계약', payment:'납부 내역', bill:'고지서',
    complaint:'민원 접수', notice:'공지사항', moveout:'퇴실 신청',
    sign:'계약서 서명', penalty:'벌점 내역' };

  root.innerHTML =
    '<div class="portal-wrap">' +
      '<div class="section-hd">' +
        '<button class="back-btn" id="back-btn">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>홈으로' +
        '</button>' +
        '<h2>' + esc(titles[name] || name) + '</h2>' +
      '</div>' +
      '<div class="section-wrap" id="section-content"></div>' +
    '</div>';

  document.getElementById('back-btn').addEventListener('click', showHome);
  var sc = document.getElementById('section-content');

  if (name === 'contract')   renderContract(sc);
  else if (name === 'payment')  renderPayment(sc);
  else if (name === 'bill')     renderBill(sc);
  else if (name === 'complaint') renderComplaint(sc);
  else if (name === 'notice')   renderNotice(sc);
  else if (name === 'moveout')  renderMoveout(sc);
  else if (name === 'sign')     renderSign(sc);
  else if (name === 'penalty')  renderPenalty(sc);
}

function renderContract(c) {
  var cs = ME.contracts || [];
  if (!cs.length) { c.innerHTML = '<div class="card"><p class="muted">계약 정보가 없습니다.</p></div>'; return; }
  c.innerHTML = cs.map(function(ct) {
    var statusBadge = ct.status === 'active' ? '<span class="badge badge-green">진행 중</span>'
      : ct.status === 'expired' ? '<span class="badge badge-gray">만료</span>'
      : '<span class="badge badge-blue">' + esc(ct.status) + '</span>';
    return '<div class="card">' +
      '<h3>' + esc(ct.building || '') + ' ' + esc(ct.room || '') + '호 ' + statusBadge + '</h3>' +
      '<div class="info-row"><span class="info-label">입소 기간</span><span class="info-val">' + fmtDate(ct.start) + ' ~ ' + fmtDate(ct.end) + '</span></div>' +
      '<div class="info-row"><span class="info-label">월 기숙사비</span><span class="info-val">' + won(ct.unit_price) + '원</span></div>' +
      (ct.deposit ? '<div class="info-row"><span class="info-label">보증금</span><span class="info-val">' + won(ct.deposit) + '원</span></div>' : '') +
      '<div class="info-row"><span class="info-label">계약 유형</span><span class="info-val">' + esc(ct.type || '-') + '</span></div>' +
    '</div>';
  }).join('');
}

function renderPayment(c) {
  var ps = ME.payments || [];
