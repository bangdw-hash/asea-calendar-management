<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주차 이력</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #1A73E8;
  --primary-dk: #1557B0;
  --primary-lt: #EEF4FD;
  --green: #16a34a;
  --green-dk: #15803d;
  --green-lt: #f0fdf4;
  --green-bd: #86efac;
  --red: #dc2626;
  --red-lt: #fef2f2;
  --red-bd: #fca5a5;
  --g50: #f9fafb;
  --g100: #f3f4f6;
  --g200: #e5e7eb;
  --g300: #d1d5db;
  --g400: #9ca3af;
  --g500: #6b7280;
  --g700: #374151;
  --g900: #111827;
  --r: 14px;
  --r-sm: 10px;
  --sh: 0 1px 3px rgba(0,0,0,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: var(--g100);
  color: var(--g900);
  min-height: 100dvh;
  display: flex; flex-direction: column;
  padding-bottom: 68px;
}

/* ── Header ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid var(--g200);
  height: 56px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 17px; font-weight: 700; color: var(--g900);
}
.header-title svg { color: var(--primary); flex-shrink: 0; }
.header-btn {
  display: flex; align-items: center; gap: 5px;
  background: none; border: 1.5px solid var(--g200);
  border-radius: var(--r-sm); padding: 6px 12px;
  font-size: 13px; font-weight: 600; color: var(--g700);
  cursor: pointer; font-family: inherit; transition: background .12s;
}
.header-btn:active { background: var(--g50); }

/* ── Filter Strip ── */
.filter-strip {
  padding: 12px 16px 6px;
  display: flex; gap: 8px;
}
.filter-btn {
  padding: 7px 14px; border: 1.5px solid var(--g200);
  border-radius: 20px; background: #fff;
  font-size: 13px; font-weight: 600; color: var(--g500);
  cursor: pointer; font-family: inherit; transition: all .12s;
}
.filter-btn.active {
  background: var(--primary-lt); color: var(--primary);
  border-color: var(--primary);
}
.filter-btn:active { transform: scale(.96); }

/* ── Summary Bar ── */
.summary-bar {
  margin: 0 16px 6px;
  background: #fff; border-radius: var(--r); box-shadow: var(--sh);
  padding: 12px 16px;
  display: flex; gap: 0; overflow: hidden;
}
.summary-item {
  flex: 1; text-align: center;
  padding: 0 8px;
}
.summary-item + .summary-item { border-left: 1px solid var(--g200); }
.summary-val {
  font-size: 22px; font-weight: 800;
  color: var(--g900); line-height: 1;
}
.summary-val.green { color: var(--green); }
.summary-val.red { color: var(--red); }
.summary-key {
  font-size: 11px; font-weight: 600;
  color: var(--g400); margin-top: 4px;
  letter-spacing: .3px;
}

/* ── List ── */
.list-section { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 1px; }

/* Group header */
.group-header {
  font-size: 12px; font-weight: 700; color: var(--g500);
  padding: 14px 4px 6px; letter-spacing: .4px;
}
.group-header:first-child { padding-top: 6px; }

/* History card */
.hist-card {
  background: #fff; border-radius: 0;
  padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  border-bottom: 1px solid var(--g100);
  transition: background .1s;
}
.hist-card:first-of-type { border-radius: var(--r) var(--r) 0 0; }
.hist-card:last-of-type { border-radius: 0 0 var(--r) var(--r); border-bottom: none; }
.hist-card:only-child { border-radius: var(--r); border-bottom: none; }
.hist-card:active { background: var(--g50); }

/* For single-day groups, apply radius per group */
.hist-group { border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); margin-bottom: 10px; }
.hist-group .hist-card { border-radius: 0; }
.hist-group .hist-card:first-child { border-top: none; }

.hist-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.hist-icon.park { background: var(--green-lt); color: var(--green); }
.hist-icon.leave { background: var(--red-lt); color: var(--red); }

.hist-body { flex: 1; min-width: 0; }
.hist-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.hist-badge {
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  padding: 2px 8px; border-radius: 20px;
}
.hist-badge.park { background: var(--green-lt); color: var(--green); border: 1px solid var(--green-bd); }
.hist-badge.leave { background: var(--red-lt); color: var(--red); border: 1px solid var(--red-bd); }
.hist-time { font-size: 13px; font-weight: 600; color: var(--g500); }
.hist-loc { font-size: 15px; font-weight: 700; color: var(--g900); margin-bottom: 2px; }
.hist-sub { font-size: 13px; color: var(--g500); }
.hist-notes {
  font-size: 12px; color: var(--g500); margin-top: 5px;
  background: var(--g50); border-radius: 6px;
  padding: 5px 9px; border-left: 2px solid var(--g200);
  line-height: 1.5;
}

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state svg { color: var(--g300); }
.empty-state strong { font-size: 16px; font-weight: 700; color: var(--g500); }
.empty-state span { font-size: 14px; color: var(--g400); }

/* Load more */
.load-more-wrap { padding: 8px 16px 16px; text-align: center; }
.load-more-btn {
  background: #fff; border: 1.5px solid var(--g200);
  border-radius: var(--r-sm); padding: 11px 24px;
  font-size: 14px; font-weight: 600; color: var(--g700);
  cursor: pointer; font-family: inherit; width: 100%;
  transition: background .12s;
}
.load-more-btn:active { background: var(--g50); }
.load-more-btn:disabled { color: var(--g400); cursor: default; }

/* Skeleton */
.skel-group { margin-bottom: 10px; border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); }
.skel-card {
  background: #fff; padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  border-bottom: 1px solid var(--g100);
}
.skel-card:last-child { border-bottom: none; }
.skel-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--g100); flex-shrink: 0; }
.skel-lines { flex: 1; }
.skel-line { background: var(--g100); border-radius: 4px; margin-bottom: 6px; }
.skel-line.w60 { width: 60%; height: 14px; }
.skel-line.w40 { width: 40%; height: 12px; }
.skel-line.w80 { width: 80%; height: 12px; margin-bottom: 0; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-circle, .skel-line {
  background: linear-gradient(90deg, var(--g100) 25%, var(--g200) 50%, var(--g100) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

/* ── Bottom Nav (same as main page) ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 1px solid var(--g200);
  height: 68px; display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  border: none; background: none; cursor: pointer;
  font-family: inherit; color: var(--g400);
  text-decoration: none; font-size: 11px; font-weight: 600;
  padding: 8px 0; transition: color .12s;
}
.nav-item.active { color: var(--primary); }
.nav-item:active { background: var(--g50); }

/* ── Toast ── */
.toast-wrap {
  position: fixed; bottom: 82px;
  left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column;
  gap: 8px; align-items: center; pointer-events: none;
}
.toast {
  background: var(--g900); color: #fff;
  padding: 9px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity .25s; white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-title">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    주차 이력
  </div>
  <button class="header-btn" onclick="deleteAll()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>
    전체 삭제
  </button>
</header>

<!-- Filter -->
<div class="filter-strip">
  <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">전체</button>
  <button class="filter-btn" data-filter="park" onclick="setFilter(this)">입차</button>
  <button class="filter-btn" data-filter="leave" onclick="setFilter(this)">출차</button>
</div>

<!-- Summary -->
<div class="summary-bar" id="summaryBar" style="display:none">
  <div class="summary-item">
    <div class="summary-val" id="sumTotal">0</div>
    <div class="summary-key">전체 기록</div>
  </div>
  <div class="summary-item">
    <div class="summary-val green" id="sumPark">0</div>
    <div class="summary-key">입차</div>
  </div>
  <div class="summary-item">
    <div class="summary-val red" id="sumLeave">0</div>
    <div class="summary-key">출차</div>
  </div>
</div>

<!-- List -->
<div class="list-section" id="listSection">
  <!-- Skeleton -->
  <div class="skel-group" id="skeleton">
    <div class="skel-card">
      <div class="skel-circle"></div>
      <div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w80"></div><div class="skel-line w40"></div></div>
    </div>
    <div class="skel-card">
      <div class="skel-circle"></div>
      <div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w80"></div><div class="skel-line w40"></div></div>
    </div>
  </div>
</div>

<div class="load-more-wrap" id="loadMoreWrap" style="display:none">
  <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">이전 기록 더 보기</button>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a class="nav-item" id="mainNavBtn" href="#">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
      <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
    </svg>
    현황
  </a>
  <a class="nav-item active" href="#" onclick="return false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    이력
  </a>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';
const SUPA_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';

const params    = new URLSearchParams(location.search);
const OWNER_KEY = params.get('key') || 'default';

const mainUrl = 'parking.html' + (OWNER_KEY !== 'default' ? '?key=' + encodeURIComponent(OWNER_KEY) : '');
document.getElementById('mainNavBtn').href = mainUrl;

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: false, autoRefreshToken: false }
});

const PAGE_SIZE = 30;
let currentFilter = 'all';
let allRecords    = [];
let offset        = 0;
let hasMore       = false;

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderList();
}

async function loadHistory() {
  const q = sb
    .from('parking_history')
    .select('*', { count: 'exact' })
    .eq('owner_key', OWNER_KEY)
    .order('event_at', { ascending: false })
    .range(0, PAGE_SIZE - 1);

  const { data, count, error } = await q;
  document.getElementById('skeleton').remove();

  if (error) { toast('데이터 로드에 실패했습니다.'); return; }

  allRecords = data || [];
  offset     = allRecords.length;
  hasMore    = count > offset;

  updateSummary(count);
  renderList();

  if (hasMore) {
    document.getElementById('loadMoreWrap').style.display = '';
  }
}

async function loadMore() {
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.textContent = '불러오는 중...';

  const q = sb
    .from('parking_history')
    .select('*', { count: 'exact' })
    .eq('owner_key', OWNER_KEY)
    .order('event_at', { ascending: false })
    .range(offset, offset + PAGE_SIZE - 1);

  const { data, count, error } = await q;
  if (!error && data) {
    allRecords = allRecords.concat(data);
    offset = allRecords.length;
    hasMore = count > offset;
    renderList();
  }

  btn.disabled = false;
  btn.textContent = '이전 기록 더 보기';
  document.getElementById('loadMoreWrap').style.display = hasMore ? '' : 'none';
}

function updateSummary(total) {
  const bar = document.getElementById('summaryBar');
  if (!total) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const parkCount  = allRecords.filter(r => r.event_type === 'park').length;
  const leaveCount = allRecords.filter(r => r.event_type === 'leave').length;
  document.getElementById('sumTotal').textContent = total;
  document.getElementById('sumPark').textContent  = parkCount;
  document.getElementById('sumLeave').textContent = leaveCount;
}

function renderList() {
  const section = document.getElementById('listSection');
  // Clear existing (keep skeleton if present)
  section.querySelectorAll('.hist-group, .empty-state').forEach(el => el.remove());

  const filtered = currentFilter === 'all'
    ? allRecords
    : allRecords.filter(r => r.event_type === currentFilter);

  if (!filtered.length) {
    const emp = document.createElement('div');
    emp.className = 'empty-state';
    emp.innerHTML = `
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <strong>기록 없음</strong>
      <span>${currentFilter === 'all' ? '아직 주차 이력이 없습니다.' : (currentFilter === 'park' ? '입차 기록이 없습니다.' : '출차 기록이 없습니다.')}</span>`;
    section.appendChild(emp);
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(rec => {
    const d    = new Date(rec.event_at);
    const key  = fmtDateKey(d);
    if (!groups[key]) groups[key] = { label: fmtDateLabel(d), items: [] };
    groups[key].items.push(rec);
  });

  Object.values(groups).forEach(group => {
    const hdr = document.createElement('div');
    hdr.className = 'group-header';
    hdr.textContent = group.label;
    section.appendChild(hdr);

    const grpEl = document.createElement('div');
    grpEl.className = 'hist-group';

    group.items.forEach(rec => {
      const isPark = rec.event_type === 'park';
      const card = document.createElement('div');
      card.className = 'hist-card';

      const locParts = [rec.building, rec.floor].filter(Boolean).join(' · ');
      const spotParts = [rec.zone ? rec.zone + '구역' : '', rec.spot ? rec.spot + '번' : ''].filter(Boolean).join(' · ');

      card.innerHTML = `
        <div class="hist-icon ${isPark ? 'park' : 'leave'}">
          ${isPark
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`
          }
        </div>
        <div class="hist-body">
          <div class="hist-row1">
            <span class="hist-badge ${isPark ? 'park' : 'leave'}">${isPark ? '입차' : '출차'}</span>
            <span class="hist-time">${fmtTime(rec.event_at)}</span>
          </div>
          ${locParts ? `<div class="hist-loc">${esc(locParts)}</div>` : ''}
          ${spotParts ? `<div class="hist-sub">${esc(spotParts)}</div>` : ''}
          ${rec.notes ? `<div class="hist-notes">${esc(rec.notes)}</div>` : ''}
        </div>`;
      grpEl.appendChild(card);
    });

    section.appendChild(grpEl);
  });
}

function fmtDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateLabel(d) {
  const today = new Date();
  const yest  = new Date(today); yest.setDate(yest.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return '오늘';
  if (d.toDateString() === yest.toDateString())  return '어제';
  const days = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ')';
}
function fmtTime(iso) {
  const d = new Date(iso);
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function deleteAll() {
  if (!confirm('모든 주차 이력을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  const { error } = await sb.from('parking_history').delete().eq('owner_key', OWNER_KEY);
  if (error) { toast('삭제에 실패했습니다.'); return; }
  allRecords = [];
  offset     = 0;
  hasMore    = false;
  document.getElementById('loadMoreWrap').style.display = 'none';
  document.getElementById('summaryBar').style.display = 'none';
  renderList();
  toast('이력이 모두 삭제되었습니다.');
}

function toast(msg) {
  const wrap = document.getElementById('toastWrap');
  const el   = document.createElement('div');
  el.className   = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
}

loadHistory();
</script>
</body>
</html>
