<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무캘린더 공유 신청 — 아세아항공직업전문학교</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1A73E8;
    --primary-dark: #1557B0;
    --primary-light: #E8F0FE;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #ea580c;
    --warning-light: #ffedd5;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Header */
  .site-header {
    background: var(--primary);
    color: #fff;
    padding: 20px 24px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .site-header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .site-header p {
    font-size: .85rem;
    opacity: .85;
    margin-top: 4px;
  }

  /* Notice + calendar link bar */
  .notice-bar {
    background: #eff6ff;
    border-bottom: 1px solid #bfdbfe;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .notice-bar p {
    font-size: .85rem;
    color: #1557B0;
  }
  .btn-calendar-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--primary);
    color: #fff;
    border-radius: var(--radius);
    font-size: .82rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background .2s;
  }
  .btn-calendar-link:hover { background: var(--primary-dark); }

  /* Layout */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Card */
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
  }
  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--primary-light);
  }

  /* Category Toggle */
  .toggle-group {
    display: flex;
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .toggle-btn {
    flex: 1;
    padding: 10px 8px;
    background: #fff;
    border: none;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    color: var(--primary);
    transition: background .2s, color .2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #fff;
  }
  .toggle-btn:not(.active):hover {
    background: var(--primary-light);
  }

  /* Form */
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: .875rem;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  label .req {
    color: var(--danger);
    margin-left: 2px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--gray-300);
    border-radius: var(--radius);
    font-size: .9rem;
    color: var(--gray-900);
    transition: border-color .2s, box-shadow .2s;
    background: #fff;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(29,78,216,.15);
  }
  input.error-field {
    border-color: var(--danger);
  }
  .email-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .email-wrap input {
    flex: 1;
    min-width: 0;
  }
  .email-suffix {
    font-size: .9rem;
    color: var(--gray-500);
    white-space: nowrap;
    font-weight: 500;
  }

  /* Privacy */
  .privacy-box {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 14px;
    font-size: .8rem;
    color: var(--gray-500);
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .privacy-box strong {
    color: var(--gray-700);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .checkbox-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .checkbox-row label {
    margin: 0;
    font-size: .875rem;
    font-weight: 500;
    color: var(--gray-700);
    cursor: pointer;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: .875rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s, transform .1s;
    text-decoration: none;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; font-size: .75rem; padding: 4px 10px; }
  .btn-warning { background: var(--warning); color: #fff; font-size: .75rem; padding: 4px 10px; }
  .btn-danger  { background: var(--danger); color: #fff; font-size: .75rem; padding: 4px 10px; }
  .btn-ghost   { background: var(--gray-100); color: var(--gray-700); font-size: .75rem; padding: 4px 10px; }
  .btn-ghost:hover { background: var(--gray-200); }
  .btn-full { width: 100%; }

  /* Error msg */
  .err-msg {
    font-size: .8rem;
    color: var(--danger);
    margin-top: 4px;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gray-900);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: .875rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 9999;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* List section */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .list-header h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gray-900);
  }
  .count-badge {
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: .8rem;
    font-weight: 700;
  }

  /* TABLE */
  .table-wrap {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  table.entries-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
  }
  .entries-table thead tr {
    background: var(--gray-100);
    border-bottom: 2px solid var(--gray-200);
  }
  .entries-table th {
    padding: 9px 10px;
    text-align: left;
    font-weight: 700;
    color: var(--gray-700);
    white-space: nowrap;
  }
  .entries-table th.center,
  .entries-table td.center { text-align: center; }
  .entries-table tbody tr {
    border-bottom: 1px solid var(--gray-200);
    transition: background .15s;
  }
  .entries-table tbody tr:last-child { border-bottom: none; }
  .entries-table tbody tr:hover { background: var(--gray-50); }
  .entries-table td {
    padding: 8px 10px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .entries-table td.email-cell {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Status toggle button */
  .status-toggle {
    border: none;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: .75rem;
    font-weight: 700;
    cursor: default;
    white-space: nowrap;
  }
  .status-toggle.pending {
    background: var(--warning-light);
    color: var(--warning);
  }
  .status-toggle.done {
    background: var(--success-light);
    color: var(--success);
  }
  .status-toggle.clickable {
    cursor: pointer;
    transition: opacity .15s;
  }
  .status-toggle.clickable:hover { opacity: .8; }

  .cat-tag {
    display: inline-block;
    font-size: .7rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }
  .reg-date {
    font-size: .75rem;
    color: var(--gray-500);
  }

  /* Inline edit row */
  .edit-row-tr td {
    background: #f0f7ff;
    padding: 12px 10px;
  }
  .edit-inline-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-end;
  }
  .edit-inline-form .ef {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .edit-inline-form .ef label {
    font-size: .75rem;
    font-weight: 600;
    color: var(--gray-500);
    margin-bottom: 0;
  }
  .edit-inline-form input[type="text"] {
    padding: 6px 8px;
    font-size: .82rem;
    width: auto;
    min-width: 80px;
  }
  .edit-inline-form .email-wrap input {
    min-width: 100px;
  }
  .edit-inline-form .toggle-group {
    margin-bottom: 0;
    font-size: .75rem;
    border-width: 1.5px;
  }
  .edit-inline-form .toggle-btn {
    padding: 5px 10px;
    font-size: .75rem;
  }
  .edit-inline-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 2px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-400);
    font-size: .9rem;
  }

  /* Contact footer */
  .contact-footer {
    margin-top: 24px;
    padding: 14px 18px;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    font-size: .85rem;
    color: var(--gray-500);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .contact-footer span { font-weight: 600; color: var(--gray-700); }
  .contact-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .contact-footer a:hover { text-decoration: underline; }

  /* Admin fab */
  #admin-fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--gray-700);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 1000;
    transition: background .2s;
  }
  #admin-fab:hover { background: var(--gray-900); }
  #admin-fab.logged-in { background: var(--primary); }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow-lg);
    transform: translateY(12px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--gray-900);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .modal-err { font-size: .8rem; color: var(--danger); margin-top: 6px; min-height: 18px; }

  @media (max-width: 600px) {
    .notice-bar { flex-direction: column; align-items: flex-start; }
    .entries-table th, .entries-table td { padding: 7px 7px; font-size: .78rem; }
    .edit-inline-form { gap: 6px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>업무캘린더 공유 신청</h1>
  <p>아세아항공직업전문학교 Google 업무캘린더</p>
</header>

<div class="notice-bar">
  <p>구글 업무캘린더 공유 신청 페이지입니다. 신청 후 관리자가 등록 처리합니다.</p>
  <button id="btn-staff-enter" class="btn-calendar-link" style="cursor:pointer;border:none">📅 직원 캘린더 바로가기</button>
</div>

<div class="container">

  <!-- Submit form -->
  <div class="card">
    <div class="card-title">신청서 작성</div>

    <!-- Category toggle -->
    <div class="toggle-group" role="group" aria-label="부서 구분">
      <button class="toggle-btn active" data-cat="행정지원부서" onclick="setCategory(this)">행정지원부서</button>
      <button class="toggle-btn" data-cat="교육부서" onclick="setCategory(this)">교육부서</button>
    </div>

    <form id="request-form" novalidate>
      <div class="form-group">
        <label for="f-name">이름 <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="홍길동" autocomplete="name">
        <div class="err-msg" id="err-name"></div>
      </div>

      <div class="form-group">
        <label for="f-dept">소속 / 직위 <span class="req">*</span></label>
        <input type="text" id="f-dept" placeholder="예) 교학처 / 교수">
        <div class="err-msg" id="err-dept"></div>
      </div>

      <div class="form-group">
        <label for="f-email">Google 이메일 <span class="req">*</span></label>
        <div class="email-wrap">
          <input type="text" id="f-email" placeholder="example" autocomplete="email" spellcheck="false">
          <span class="email-suffix">@gmail.com</span>
        </div>
        <div class="err-msg" id="err-email"></div>
      </div>

      <!-- Privacy -->
      <div class="privacy-box">
        <strong>[개인정보 수집·이용 동의 안내]</strong><br>
        수집 항목: 이름, 소속/직위, 이메일 주소<br>
        수집 목적: 업무캘린더 공유 처리 및 관리<br>
        보유 기간: 수집일로부터 <strong>1년</strong> (개인정보 보호법 준수)
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="f-privacy">
        <label for="f-privacy">위 개인정보 수집·이용에 동의합니다. <span class="req">*</span></label>
      </div>
      <div class="err-msg" id="err-privacy" style="margin-top:-10px;margin-bottom:12px;"></div>

      <button type="submit" class="btn btn-primary btn-full">신청하기</button>
    </form>
  </div>

  <!-- List -->
  <div id="list-section">
    <div class="list-header">
      <h2>신청 현황</h2>
      <span class="count-badge" id="count-badge">0</span>
    </div>
    <!-- Sort / Filter bar -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;background:#f8f9fa;border-radius:8px;border:1px solid #e5e7eb">
      <div style="display:flex;gap:6px;align-items:center;font-size:13px;color:#6b7280">
        <span>부서:</span>
        <select id="filter-cat" style="font-size:13px;padding:3px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff">
          <option value="">전체</option>
          <option value="행정지원부서">행정지원부서</option>
          <option value="교육부서">교육부서</option>
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center;font-size:13px;color:#6b7280">
        <span>정렬:</span>
        <select id="sort-by" style="font-size:13px;padding:3px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff">
          <option value="date-desc">신청일 (최신순)</option>
          <option value="date-asc">신청일 (오래된순)</option>
          <option value="name-asc">이름순 (가-나)</option>
          <option value="name-desc">이름순 (나-가)</option>
          <option value="status">상태순</option>
        </select>
      </div>
      <button onclick="resetFilters()" style="font-size:12px;padding:4px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;color:#6b7280">초기화</button>
    </div>
    <div id="entries-container">
      <div class="empty-state">아직 신청 내역이 없습니다.</div>
    </div>
  </div>

  <!-- Contact footer -->
  <div class="contact-footer" id="contact-footer"></div>

</div>

<!-- Admin FAB -->
<button id="admin-fab" onclick="handleAdminFab()">🔒 관리자</button>

<!-- Admin login modal -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h3>🔒 관리자 로그인</h3>
    <div class="form-group">
      <label for="admin-pw">비밀번호</label>
      <input type="password" id="admin-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="modal-err" id="login-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('login-modal')">취소</button>
      <button class="btn btn-primary" onclick="doLogin()">로그인</button>
    </div>
  </div>
</div>

<!-- GAS URL 설정 모달 -->
<div class="modal-overlay" id="gas-modal">
  <div class="modal" style="max-width:520px">
    <h3>⚙️ 공유 데이터 서버 설정</h3>
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;margin-bottom:14px;line-height:1.6">
      현재 연결된 GAS URL:<br>
      <span id="gas-current-url" style="word-break:break-all;font-family:monospace"></span>
    </div>
    <div class="form-group">
      <label for="gas-url-input">GAS 웹앱 URL (변경 시 입력)</label>
      <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:12px;">
    </div>
    <div id="gas-test-result" style="font-size:12px;margin-bottom:10px;display:none;padding:8px 12px;border-radius:6px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('gas-modal')">닫기</button>
      <button class="btn btn-secondary btn-sm" onclick="testGasConnection()" style="margin-right:auto">🔌 연결 테스트</button>
      <button class="btn btn-primary" onclick="saveGasUrl()">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY   = 'asea_calendar_share_requests';
  const SESSION_KEY   = 'asea_share_adm';
  const ADMIN_PW      = 'asea2024admin';
  const CONTACT_KEY   = 'asea_contact_info';
  const GAS_KEY       = 'asea_gas_url';
  const GAS_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbyZuuQpuc-0KWaaHmwJUTvnAc83liMcUcC5XxcdR-EFQCFC2AJ0LpFS3R1gS_JXI3Fykg/exec';

  let selectedCategory = '행정지원부서';
  let editingId = null;

  /* ── GAS / localStorage 이중 레이어 ── */
  function gasUrl() { return localStorage.getItem(GAS_KEY) || GAS_URL_DEFAULT; }

  async function dbLoad() {
    try {
      const j = await _gasReq('list');
      _lsSave(j.data);          // 캐시 워밍 → 다음 진입 시 즉시 표시
      return j.data;
    } catch(e) {
      console.warn('GAS load failed:', e);
      return _lsLoad();
    }
  }

  /* 서버에 요청하고 ok 여부까지 검증. 실패 시 throw */
  async function _gasReq(action, params) {
    const url = gasUrl();
    if (!url) throw new Error('GAS URL이 설정되지 않았습니다');
    let qs = '?action=' + encodeURIComponent(action) + '&_=' + Date.now();
    if (params) for (const k in params) qs += '&' + k + '=' + encodeURIComponent(params[k]);
    const r = await fetch(url + qs);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();   // 비정상(HTML 등) 응답이면 여기서 throw → 폴백
    if (!j.ok) throw new Error(j.error || '서버 응답 오류');
    return j;
  }

  /* 쓰기: 서버 저장을 검증하고 { synced, error } 반환.
     서버 실패해도 로컬에는 남겨 화면엔 보이게 하되, 동기화 실패를 호출부에 알림 */
  async function dbAdd(entry) {
    const data = _lsLoad(); data.unshift(entry); _lsSave(data);
    try { await _gasReq('add', { d: JSON.stringify(entry) }); return { synced: true }; }
    catch(e) { console.warn('GAS add failed:', e); return { synced: false, error: e.message }; }
  }

  async function dbUpdate(id, changes) {
    const data = _lsLoad(); const idx = data.findIndex(e => e.id === id);
    if (idx >= 0) { Object.assign(data[idx], changes); _lsSave(data); }
    try { await _gasReq('update', { id: id, d: JSON.stringify(changes) }); return { synced: true }; }
    catch(e) { console.warn('GAS update failed:', e); return { synced: false, error: e.message }; }
  }

  async function dbDelete(id) {
    _lsSave(_lsLoad().filter(e => e.id !== id));
    try { await _gasReq('delete', { id: id }); return { synced: true }; }
    catch(e) { console.warn('GAS delete failed:', e); return { synced: false, error: e.message }; }
  }

  function _lsLoad() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
  function _lsSave(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

  /* ── GAS URL 저장 (관리자) ── */
  window.saveGasUrl = function() {
    const val = (document.getElementById('gas-url-input').value || '').trim();
    localStorage.setItem(GAS_KEY, val);
    closeModal('gas-modal');
    showToast(val ? 'GAS URL이 저장되었습니다. 데이터를 새로 불러옵니다.' : 'GAS URL이 제거되었습니다.');
    renderList();
  };

  /* ── Helpers ── */
  function isAdmin() { return sessionStorage.getItem(SESSION_KEY) === '1'; }
  function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' })
      + ' ' + d.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
  }
  function showToast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), ms || 2500);
  }
  const SYNC_FAIL_MSG = '⚠️ 저장은 됐지만 공유 서버 동기화 실패 — 다른 기기/브라우저에서는 보이지 않습니다. 관리자에게 GAS 재배포를 요청하세요.';
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function showBusy(on) {
    const c = document.getElementById('entries-container');
    if (on) c.innerHTML = '<div class="empty-state" style="padding:32px 0">⏳ 불러오는 중...</div>';

    function clearErrs() {
      ['err-name','err-dept','err-email','err-privacy'].forEach(id => document.getElementById(id).textContent = '');
      ['f-name','f-dept','f-email'].forEach(id => document.getElementById(id).classList.remove('error-field'));

    if (!emailPfx || !/^[a-zA-Z0-9._+-]+$/.test(emailPfx)) {

  /* ── Render list (table) ── */
  window.resetFilters = function() {
    document.getElementById('filter-cat').value = '';
    document.getElementById('sort-by').value = 'date-desc';
    renderList();
  };
  document.addEventListener('change', function(e) {
    if (e.target.id === 'filter-cat' || e.target.id === 'sort-by') renderList();

  async function renderList() {
    // 1) 캐시를 즉시 렌더 → 체감 0.1초 (Apps Script 응답은 1~3초라 기다리지 않음)
    const cached = _lsLoad();
    if (cached.length) _paint(cached); else showBusy(true);
    // 2) 서버에서 최신본을 받아 조용히 갱신 (실패 시 캐시 유지)
    try { _paint(await dbLoad()); } catch(e) { /* 오프라인 */ }
  }
  function _paint(data) {
    const admin = isAdmin();
    const container = document.getElementById('entries-container');
    if (!container) return;

    // filter
    const filterCat = (document.getElementById('filter-cat') || {}).value || '';
    if (filterCat) data = data.filter(function(d) { return d.category === filterCat; });

    // sort
    const sortBy = (document.getElementById('sort-by') || {}).value || 'date-desc';
    data = data.slice().sort(function(a, b) {
      if (sortBy === 'date-desc') return new Date(b.submittedAt) - new Date(a.submittedAt);
      if (sortBy === 'date-asc')  return new Date(a.submittedAt) - new Date(b.submittedAt);
      if (sortBy === 'name-asc')  return a.name.localeCompare(b.name, 'ko');
      if (sortBy === 'name-desc') return b.name.localeCompare(a.name, 'ko');
      if (sortBy === 'status')    return (a.status === '등록완료' ? 1 : 0) - (b.status === '등록완료' ? 1 : 0);
      return 0;
    });

    document.getElementById('count-badge').textContent = data.length;

    if (!data.length) {
      container.innerHTML = '<div class="empty-state">아직 신청 내역이 없습니다.</div>';
      return;
    }

    let rows = '';
    data.forEach((entry, idx) => {
      const isPending = entry.status !== '등록완료';
      const statusCls = isPending ? 'pending' : 'done';
      const statusLabel = isPending ? '미등록' : '등록완료';
      const clickable   = admin ? ' clickable' : '';
      const toggleAttr  = admin
        ? `onclick="${isPending ? "markDone" : "markPending"}('${entry.id}')" title="${isPending ? '클릭하여 등록완료 처리' : '클릭하여 미등록으로 변경'}"` : '';

      const regDateHtml = entry.registeredAt
        ? `<span class="reg-date">${fmtDate(entry.registeredAt)}</span>` : '';

      const editBtn    = `<button class="btn btn-ghost" onclick="startEdit('${entry.id}')">수정</button>`;
      const deleteBtn  = admin ? ` <button class="btn btn-danger" onclick="deleteEntry('${entry.id}')">삭제</button>` : '';

      // Normal data row
      rows += `<tr id="row-${entry.id}">
  <td class="center" style="color:var(--gray-400);font-size:.75rem;">${idx + 1}</td>
  <td><span class="cat-tag">${esc(entry.category)}</span></td>
  <td style="font-weight:600;">${esc(entry.name)}</td>
  <td style="color:var(--gray-600);">${esc(entry.dept)}</td>
  <td class="email-cell">${esc(entry.emailPrefix)}@gmail.com</td>
  <td style="color:var(--gray-500);font-size:.75rem;">${fmtDate(entry.submittedAt)}</td>
  <td class="center"><button class="status-toggle ${statusCls}${clickable}" ${toggleAttr}>${statusLabel}</button></td>
  <td>${regDateHtml}</td>
  <td style="white-space:nowrap;">${editBtn}${deleteBtn}</td>
</tr>`;

      // Inline edit row (conditionally shown)
      if (editingId === entry.id) {
        rows += `<tr class="edit-row-tr" id="editrow-${entry.id}">
  <td colspan="9">
    <div class="edit-inline-form">
      <div class="ef">
        <label>이름</label>
        <input type="text" id="ei-name-${entry.id}" value="${esc(entry.name)}" style="width:100px;">
      </div>
      <div class="ef">
        <label>소속/직위</label>
        <input type="text" id="ei-dept-${entry.id}" value="${esc(entry.dept)}" style="width:130px;">
      </div>
      <div class="ef">
        <label>Gmail 계정명</label>
        <div class="email-wrap">
          <input type="text" id="ei-email-${entry.id}" value="${esc(entry.emailPrefix)}" style="width:120px;">
          <span class="email-suffix">@gmail.com</span>
        </div>
      </div>
      <div class="ef">
        <label>카테고리</label>
        <div class="toggle-group" id="ei-cat-grp-${entry.id}" style="margin-bottom:0;">
          <button class="toggle-btn${entry.category==='행정지원부서'?' active':''}" data-cat="행정지원부서"
            onclick="setEditCat(this,'${entry.id}')">행정지원부서</button>
          <button class="toggle-btn${entry.category==='교육부서'?' active':''}" data-cat="교육부서"
            onclick="setEditCat(this,'${entry.id}')">교육부서</button>
        </div>
      </div>
      <div class="edit-inline-actions">
        <button class="btn btn-ghost" onclick="cancelEdit()">취소</button>
        <button class="btn btn-primary" onclick="saveEdit('${entry.id}')">저장</button>
      </div>
    </div>
  </td>
</tr>`;
      }
    });

    container.innerHTML = `
<div class="table-wrap">
  <table class="entries-table">
    <thead>
      <tr>
        <th class="center">#</th>
        <th>부서</th>
        <th>이름</th>
        <th>소속/직위</th>
        <th>이메일(@gmail.com)</th>
        <th>신청일시</th>
        <th class="center">상태</th>
        <th>등록일시</th>
        <th>수정</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>
</div>`;
  }

  /* ── Edit ── */
  window.startEdit = function(id) {
    editingId = id;
    renderList();
    // focus first field
    const el = document.getElementById('ei-name-' + id);
    if (el) el.focus();
  };

  window.cancelEdit = function() {
    editingId = null;
    renderList();

  window.setEditCat = function(btn, id) {
    const grp = document.getElementById('ei-cat-grp-' + id);
    if (grp) grp.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

  window.saveEdit = async function(id) {
    const newName  = (document.getElementById('ei-name-' + id) || {}).value?.trim();
    const newDept  = (document.getElementById('ei-dept-' + id) || {}).value?.trim();
    const newEmail = (document.getElementById('ei-email-' + id) || {}).value?.trim().replace(/@.*/, '');
    const grp      = document.getElementById('ei-cat-grp-' + id);
    const activeCat = grp ? grp.querySelector('.toggle-btn.active') : null;
    const newCat   = activeCat ? activeCat.dataset.cat : null;
    if (!newName || !newDept || !newEmail) { showToast('모든 필드를 입력해 주세요.'); return; }
    const changes = { name: newName, dept: newDept, emailPrefix: newEmail, email: newEmail + '@gmail.com' };
    if (newCat) changes.category = newCat;
    const r = await dbUpdate(id, changes);
    editingId = null;
    showToast(r.synced ? '수정되었습니다.' : SYNC_FAIL_MSG, r.synced ? 2500 : 7000);
    await renderList();
  };

  window.testGasConnection = async function() {
    const box = document.getElementById('gas-test-result');
    const inputUrl = (document.getElementById('gas-url-input').value || '').trim();
    const url = inputUrl || gasUrl();
    box.style.display = 'block';
    box.style.background = '#f3f4f6';
    box.style.color = '#374151';
    box.textContent = '⏳ 연결 테스트 중...';
    box.style.whiteSpace = 'pre-line';
    const reqWith = async (action, params) => {
      let qs = '?action=' + encodeURIComponent(action) + '&_=' + Date.now();
      if (params) for (const k in params) qs += '&' + k + '=' + encodeURIComponent(params[k]);
      const r = await fetch(url + qs);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || JSON.stringify(j));
      return j;
    };
    try {
      // 1단계: 읽기
      const list = await reqWith('list');
      box.textContent = '⏳ 읽기 성공 (' + list.data.length + '건). 쓰기 테스트 중...';
      // 2단계: 쓰기 왕복 — 프로브 추가 → 목록 확인 → 삭제 (실제 공유 저장 여부 검증)
      const probeId = '__conntest_' + Date.now();
      const probe = { id: probeId, submittedAt: new Date().toISOString(), category: '__test__',
                      name: '연결테스트', dept: '', emailPrefix: '', email: '', status: '__test__', registeredAt: '' };
      await reqWith('add', { d: JSON.stringify(probe) });
      const after = await reqWith('list');
      const saved = after.data.some(e => String(e.id) === probeId);
      await reqWith('delete', { id: probeId });   // 정리
      if (saved) {
        box.style.background = '#f0fdf4'; box.style.color = '#166534';
        box.textContent = '✅ 읽기·쓰기 모두 정상! 저장된 신청 ' + list.data.length + '건\n→ 다른 기기/브라우저와 정상 공유됩니다.';
      } else {
        box.style.background = '#fffbeb'; box.style.color = '#92400e';
        box.textContent = '⚠️ 읽기는 되지만 쓰기가 서버에 저장되지 않습니다.\n→ gas-backend.js 최신 코드로 GAS를 다시 배포(새 버전 게시)해야 합니다.\n   (이 상태에서는 신청이 그 기기에만 임시 저장되고 공유되지 않습니다.)';
      }
    } catch(e) {
      box.style.background = '#fef2f2'; box.style.color = '#991b1b';
      box.textContent = '❌ 연결 실패: ' + e.message + '\n→ GAS 배포 권한(모든 사용자)을 확인하고, script.google.com에서 doGet을 한 번 직접 실행해 권한을 부여하세요.';
    }
  };

  if (isAdmin()) {
    const fab = document.getElementById('admin-fab');
    fab.classList.add('logged-in');
    fab.innerHTML = '🔓 관리자 ▾';
  }
  renderContact();
  renderList();

  /* ── 직원 캘린더 바로가기 — 내부 이메일 확인 ── */
  const ALLOWED_EMAILS = ['bangdw@gmail.com', 'bangsw82@gmail.com'];

  // 모달 삽입
  document.body.insertAdjacentHTML('beforeend', `
  <div id="staff-gate-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center;padding:16px">
    <div style="background:#fff;border-radius:16px;padding:32px 28px;max-width:400px;width:100%;box-shadow:0 20px 48px rgba(0,0,0,.22);position:relative">
      <button onclick="document.getElementById('staff-gate-modal').style.display='none'" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af;line-height:1">✕</button>
      <div id="sgm-inner"></div>
    </div>
  </div>`);

  window.closeGate = function() { document.getElementById('staff-gate-modal').style.display = 'none'; };

  window.showEmailForm = function() {
    document.getElementById('sgm-inner').innerHTML = `
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:44px;margin-bottom:10px">📅</div>
        <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:6px">직원 캘린더 접속</h3>
        <p style="font-size:13px;color:#6b7280;line-height:1.6">등록된 Gmail 계정만 이용할 수 있습니다.<br>본인의 Google 이메일을 입력해 주세요.</p>
      </div>
      <div style="margin-bottom:14px">
        <input id="sgm-email-input" type="email" placeholder="example@gmail.com"
          style="width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;transition:border .2s"
          onfocus="this.style.borderColor='#1A73E8'" onblur="this.style.borderColor='#d1d5db'">
        <div id="sgm-email-err" style="font-size:12px;color:#dc2626;margin-top:5px;display:none"></div>
      </div>
      <button onclick="checkStaffEmail()" style="width:100%;background:#1A73E8;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer">입장하기</button>`;
    document.getElementById('staff-gate-modal').style.display = 'flex';
    setTimeout(function() { document.getElementById('sgm-email-input').focus(); }, 100);
    document.getElementById('sgm-email-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkStaffEmail();
    });
  }

  window.checkStaffEmail = async function() {
    const input = document.getElementById('sgm-email-input');
    const err = document.getElementById('sgm-email-err');
    const email = (input.value || '').trim().toLowerCase();
    if (!email) { err.textContent = '이메일을 입력해 주세요.'; err.style.display = 'block'; return; }

    const checkBtn = document.querySelector('#sgm-inner button');
    if (checkBtn) { checkBtn.disabled = true; checkBtn.textContent = '확인 중...'; }
    const data = await dbLoad();
    if (checkBtn) { checkBtn.disabled = false; checkBtn.textContent = '입장하기'; }
    const isAllowed = ALLOWED_EMAILS.indexOf(email) !== -1 ||
      data.some(function(r) { return r.email === email && r.status === '등록완료'; });

    if (isAllowed) {
      document.getElementById('sgm-inner').innerHTML = `
        <div style="text-align:center;padding:12px 0">
          <div style="font-size:48px;margin-bottom:12px">✅</div>
          <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:8px">접속이 확인되었습니다</h3>
          <p style="font-size:13px;color:#6b7280">잠시 후 업무 캘린더로 이동합니다...</p>
        </div>`;
      // 확인된 이메일을 로그인 힌트로 전달 → 같은 채널(일반 앱)로 진입.
      // 해당 Google 세션이 활성화돼 있으면 추가 로그인 없이 바로 들어간다.
      try { sessionStorage.setItem('asea_login_hint', email); } catch (e) {}
      setTimeout(function() { location.href = './index.html'; }, 1000);
    } else {
      document.getElementById('sgm-inner').innerHTML = `
        <div style="text-align:center;padding:8px 0">
          <div style="font-size:48px;margin-bottom:12px">🔒</div>
          <h3 style="font-size:17px;font-weight:700;color:#111827;margin-bottom:10px">등록되지 않은 계정입니다</h3>
          <p style="font-size:14px;color:#6b7280;line-height:1.7;margin-bottom:20px">
            <b style="color:#374151">${email}</b> 계정은<br>
            아직 업무캘린더 공유 신청이 완료되지 않았습니다.<br><br>
            아래 <b>신청서 작성</b> 폼에서 구글 이메일을 등록하시면<br>
            관리자 승인 후 이용하실 수 있습니다.
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button onclick="closeGate();setTimeout(function(){document.getElementById('f-name').focus()},100)"
              style="background:#1A73E8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer">
              📝 신청서 작성하기
            </button>
            <button onclick="document.getElementById('sgm-inner').innerHTML='';showEmailForm()"
              style="background:#f3f4f6;color:#374151;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer">
              ← 다시 입력
            </button>
          </div>
        </div>`;
    }
  };

  document.getElementById('btn-staff-enter').addEventListener('click', window.showEmailForm);

})();
</script>
</body>
</html>
