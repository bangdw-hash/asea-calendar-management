<!DOCTYPE html>
<title>기숙사 관리 데모</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--muted:#64748b;
  --text:#0f172a;--text2:#334155;--head:#1a3a5c;
  --primary:#1A73E8;--primary-dk:#1557B0;--primary-lt:#e8f0fe;
  --green:#16a34a;--green-lt:#dcfce7;
  --orange:#ea580c;--orange-lt:#fff7ed;
  --red:#dc2626;--red-lt:#fef2f2;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.07);--sh-md:0 4px 16px rgba(0,0,0,.10);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--muted:#94a3b8;
  --text:#f1f5f9;--text2:#cbd5e1;--head:#7dd3fc;
  --primary-lt:#1e3a5f;--green-lt:#052e16;--orange-lt:#431407;--red-lt:#450a0a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--muted:#94a3b8;
  --text:#f1f5f9;--text2:#cbd5e1;--head:#7dd3fc;
  --primary-lt:#1e3a5f;--green-lt:#052e16;--orange-lt:#431407;--red-lt:#450a0a;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;margin:0;}
.app{max-width:1100px;margin:0 auto;padding-inline:16px;padding-bottom:32px;}
.app-hd{display:flex;align-items:center;gap:10px;padding-block:14px 12px;border-bottom:2px solid var(--primary);margin-bottom:16px;}
.app-hd h1{font-size:18px;font-weight:800;color:var(--head);margin:0;}
.demo-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--orange-lt);color:var(--orange);border:1px solid currentColor;}
.app-hd .sp{flex:1;}
.app-hd .note{font-size:12px;color:var(--muted);}

.subtabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);padding:5px;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);}
.stab{padding:5px 10px;border:none;background:transparent;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;}
.stab:hover{background:var(--primary-lt);color:var(--primary);}
.stab.active{background:var(--primary);color:#fff;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.ct{font-size:15px;font-weight:700;color:var(--head);margin:0 0 14px;}
.ct2{font-size:13px;font-weight:700;color:var(--head);margin:0 0 10px;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;text-align:center;box-shadow:var(--sh);}
.kn{font-size:22px;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.2;}
.kn small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;}
.kl{font-size:12px;color:var(--muted);margin-top:3px;}

.tbl-wrap{overflow-x:auto;min-width:0;border-radius:8px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
th{background:var(--bg);font-weight:700;color:var(--text2);font-size:12px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--primary-lt);}
tbody tr.clk{cursor:pointer;}

.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.b-g{background:var(--green-lt);color:var(--green);}
.b-b{background:var(--primary-lt);color:var(--primary);}
.b-r{background:var(--red-lt);color:var(--red);}
.b-gr{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.b-o{background:var(--orange-lt);color:var(--orange);}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;text-decoration:none;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-p{background:var(--primary);color:#fff;}.btn-p:hover{background:var(--primary-dk);}
.btn-s{background:var(--primary-lt);color:var(--primary);}.btn-s:hover{background:var(--primary);color:#fff;}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-g:hover{background:var(--bg);color:var(--text);}
.btn-d{background:var(--red-lt);color:var(--red);border:1px solid transparent;}.btn-d:hover{background:var(--red);color:#fff;}
.btn-sm{padding:4px 9px;font-size:12px;}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center;}

.fg{margin-bottom:10px;}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.fi,.fs{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s;}
.fi:focus,.fs:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lt);}
textarea.fi{resize:vertical;}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:700px){.g2{grid-template-columns:1fr;}.g4{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.g3{grid-template-columns:1fr 1fr;}}

.muted{font-size:13px;color:var(--muted);line-height:1.6;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text2);}
.chip b{color:var(--head);}

.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;}
.bar-lbl{width:76px;flex-shrink:0;color:var(--text2);font-size:12px;}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:13px;overflow:hidden;border:1px solid var(--border);min-width:0;}
.bar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-val{width:84px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;color:var(--head);}

.modebar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.mbtn{padding:6px 12px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;}
.mbtn:hover{border-color:var(--primary);color:var(--primary);}
.mbtn.active{background:var(--head);color:#fff;border-color:var(--head);}

.paybox{border:1.5px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;background:var(--surface);}
.payhd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px;}

.cm-comment{border-left:3px solid var(--primary);background:var(--bg);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:8px;}
.cm-content{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;line-height:1.7;white-space:pre-line;margin:8px 0;}

#toast-wrap{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.toast{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--sh-md);animation:tin .2s ease;max-width:260px;pointer-events:auto;color:#fff;background:#334155;}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--primary);}
@keyframes tin{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.cfm-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:8888;}
.cfm-box{background:var(--surface);border-radius:var(--r);padding:22px;max-width:340px;width:92%;box-shadow:var(--sh-md);}
.cfm-box p{margin:0 0 16px;font-size:14px;line-height:1.6;}
.cfm-box .acts{justify-content:flex-end;}

.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sum-t{font-size:12px;font-weight:700;color:var(--head);margin-bottom:5px;}
@media(max-width:560px){.sum-grid{grid-template-columns:1fr;}}

.map-stage{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;}
.map-floor{border-bottom:1.5px solid var(--border);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.map-floor:last-child{border-bottom:none;}
.map-flbl{font-size:11px;font-weight:700;color:var(--muted);width:28px;flex-shrink:0;}
.map-room{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:4px 7px;border-radius:7px;color:#fff;font-size:11px;font-weight:700;cursor:default;line-height:1.3;box-shadow:var(--sh);}
.map-room.occ{background:var(--green);}.map-room.vac{background:var(--muted);}

.nt-preview{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:22px;max-width:560px;margin:0 auto;}
.nt-org{font-weight:800;color:var(--head);font-size:13px;}
.nt-h1{text-align:center;letter-spacing:5px;font-size:17px;margin:10px 0 3px;font-weight:800;}
.nt-meta{text-align:right;font-size:11px;color:var(--muted);margin-bottom:9px;}
.nt-tb{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:12px;}
.nt-tb th,.nt-tb td{border:1px solid var(--border);padding:5px 8px;}
.nt-tb th{background:var(--bg);width:78px;font-weight:700;}
.nt-foot{font-size:11px;line-height:1.9;margin-top:9px;border-top:1px solid var(--border);padding-top:9px;color:var(--text2);}

.sign-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sign-row:last-child{border-bottom:none;}
</style>

<div class="app">
  <header class="app-hd">
    <h1>🏢 기숙사 관리</h1>
    <span class="demo-badge">DEMO</span>
    <span class="sp"></span>
    <span class="note">로그인 없는 체험 버전 · 데이터는 메모리에만 존재</span>
  </header>
  <nav class="subtabs" id="subtabs"></nav>
  <div id="tab-body"></div>
</div>
<div id="toast-wrap"></div>

<script>
'use strict';
(function(){

/* ── Mock Data Generation ── */
var SUR='김이박최정강조윤장임한오서신권황안송류전홍'.split('');
var GIV='민서지현준우예수은하도윤시주연채다건정진성'.split('');
function rn(){return SUR[ri(0,SUR.length-1)]+GIV[ri(0,GIV.length-1)]+GIV[ri(0,GIV.length-1)];}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

var DEPTS=['항공정비계열','스마트안전진단계열','항공관광계열','항공보안계열','국방경찰계열'];
var EXP_CATS=['유지보수비','관리비','인건비','보험료','행정비용','기타'];

var buildings=[
  {id:'b1',name:'1생활관',grade:'A',base_price:550000,note:'남자기숙사 A동'},
  {id:'b2',name:'2생활관',grade:'B',base_price:480000,note:'여자기숙사 B동'},
  {id:'b3',name:'3생활관',grade:'A',base_price:520000,note:'신관 C동'},
];

var rooms=[];
buildings.forEach(function(b){
  var cnt=b.id==='b1'?14:b.id==='b2'?13:12;
  for(var i=1;i<=cnt;i++){
    var fl=Math.ceil(i/5);
    var rn2=fl*100+((i-1)%5+1);
    var tp=i%3===0?'2인실':'1인실';
    rooms.push({id:'r'+b.id+i,building_id:b.id,room_number:String(rn2),room_type:tp,
      floor:fl,unit_price:(tp==='1인실'?ri(50,60):ri(40,50))*10000,is_vacant:false});
  }
});
[5,12,20,25,30].forEach(function(i){if(rooms[i])rooms[i].is_vacant=true;});

var residents=[],contracts=[];
var MONTHS=['2025-09','2025-10','2025-11','2025-12','2026-01','2026-02'];
var occ=rooms.filter(function(r){return !r.is_vacant;});
occ.forEach(function(r,idx){
  var bld=buildings.find(function(b){return b.id===r.building_id;});
  var cnt=r.room_type==='2인실'?2:1;
  for(var k=0;k<cnt;k++){
    var res={id:'res'+(residents.length+1),name:rn(),
      student_no:'2025'+pad(residents.length+1),
      phone:'010-'+pad(ri(1000,9999))+'-'+pad(ri(1000,9999)),
      department:DEPTS[(idx+k)%DEPTS.length],grade:(idx%2)+1};
    residents.push(res);
    contracts.push({id:'c'+contracts.length,resident_id:res.id,
      resident_name:res.name,student_no:res.student_no,phone:res.phone,
      building_id:r.building_id,building_name:bld.name,
      room_id:r.id,room_number:r.room_number,
      start_date:'2025-09-01',end_date:'2026-02-28',
      contract_type:'학기별',unit_price:r.unit_price,deposit:200000,
      department:res.department,grade:res.grade,semester:'2025-2',
      status:'active',sign_status:['none','pending','signed'][(idx+k)%3],
      created_at:'2025-09-01T09:00:00Z'});
  }
});

var payments=[];
contracts.forEach(function(c){
  MONTHS.forEach(function(m,mi){
    payments.push({id:'p'+payments.length,contract_id:c.id,
      resident_name:c.resident_name,period:m,amount:c.unit_price,
      due_date:m+'-01',
      status:mi<3?'paid':(mi===3&&Math.random()<0.35?'paid':'pending'),
      paid_date:mi<3?m+'-03':null});
  });
});

var expenses=[
  {id:'e1',expense_date:'2025-09-15',item_name:'1생활관 보일러 수리',category:'유지보수비',amount:850000,building_id:'b1'},
  {id:'e2',expense_date:'2025-09-20',item_name:'공용 관리비 9월',category:'관리비',amount:1200000,building_id:null},
  {id:'e3',expense_date:'2025-10-10',item_name:'기숙사 사감 인건비',category:'인건비',amount:2500000,building_id:null},
  {id:'e4',expense_date:'2025-10-15',item_name:'2생활관 도어록 교체',category:'유지보수비',amount:650000,building_id:'b2'},
  {id:'e5',expense_date:'2025-11-01',item_name:'시설 화재보험료',category:'보험료',amount:480000,building_id:null},
  {id:'e6',expense_date:'2025-11-15',item_name:'행정 소모품',category:'행정비용',amount:120000,building_id:null},
  {id:'e7',expense_date:'2025-12-01',item_name:'공용 관리비 12월',category:'관리비',amount:1200000,building_id:null},
  {id:'e8',expense_date:'2025-12-20',item_name:'3생활관 전기 점검',category:'유지보수비',amount:380000,building_id:'b3'},
];

var complaints=[
  {id:'cm1',ticket_no:'DRM-CM-001',resident_name:'김민서',room_label:'1생활관 101호',
   category:'시설불량',title:'세탁기 고장 신고',
   content:'1층 공용 세탁기 3번이 작동하지 않습니다.\n사용 중 멈추고 오류 코드(E3)가 반복 표시됩니다.',
   status:'in_progress',assignee:'시설팀 이부장',created_at:'2025-11-10T09:30:00Z'},
  {id:'cm2',ticket_no:'DRM-CM-002',resident_name:'이지현',room_label:'2생활관 203호',
   category:'소음',title:'야간 소음 민원',
   content:'같은 층 204호에서 매일 밤 11시 이후 소음이 발생합니다.\n음악 소리와 대화 소리가 공용 복도까지 들립니다.',
   status:'received',assignee:'',created_at:'2025-11-15T14:22:00Z'},
  {id:'cm3',ticket_no:'DRM-CM-003',resident_name:'박준우',room_label:'1생활관 305호',
   category:'냉난방',title:'난방 미작동',
   content:'방 난방이 제대로 작동하지 않습니다.\n온도 설정을 최대로 해도 차가운 바람만 나옵니다.',
   status:'done',assignee:'시설팀 최기사',created_at:'2025-11-08T08:15:00Z'},
];
var complaint_comments=[
  {id:'cc1',complaint_id:'cm1',author:'시설팀 이부장',body:'수리 업체 연락 완료, 12일 오전 방문 예정입니다.',created_at:'2025-11-11T10:00:00Z'},
  {id:'cc2',complaint_id:'cm3',author:'시설팀 최기사',body:'보일러 밸브 교체 완료. 정상 작동 확인하였습니다.',created_at:'2025-11-09T15:30:00Z'},
];
var notices=[];

var _D={buildings,rooms,residents,contracts,payments,expenses,complaints,complaint_comments,notices};
var _st={tab:'dash',bid:null,cmode:'manual',cmf:'all',cmOpen:null};
var _idSeq=200;
function nid(){return 'id'+(++_idSeq);}

/* ── Helpers ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}
function won(n){return(Number(n)||0).toLocaleString('ko-KR');}
function num(v){return parseInt(String(v==null?'':v).replace(/[^\d-]/g,''),10)||0;}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function setv(id,v){var e=document.getElementById(id);if(e)e.value=v;}
function bldName(id){var b=_D.buildings.find(function(x){return x.id===id;});return b?b.name:'-';}
function roomNum(id){var r=_D.rooms.find(function(x){return x.id===id;});return r?r.room_number:'-';}

function toast(msg,type){
  var w=document.getElementById('toast-wrap');
  var t=document.createElement('div');
  t.className='toast '+(type||'');t.textContent=msg;
  w.appendChild(t);setTimeout(function(){t.remove();},3000);
}
function cfm(msg,onY){
  var ov=document.createElement('div');ov.className='cfm-ov';
  ov.innerHTML='<div class="cfm-box"><p>'+esc(msg)+'</p><div class="acts"><button class="btn btn-g btn-sm cfm-n">취소</button><button class="btn btn-d btn-sm cfm-y">확인</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('.cfm-y').onclick=function(){ov.remove();onY();};
  ov.querySelector('.cfm-n').onclick=function(){ov.remove();};
}

/* ── Subtab nav ── */
var SUBS=[
  {id:'dash',label:'대시보드'},{id:'master',label:'건물·호실'},{id:'map',label:'배치도'},
  {id:'contract',label:'계약 등록·조회'},{id:'esign',label:'전자계약'},{id:'payment',label:'기숙사비'},
  {id:'expense',label:'지출'},{id:'price',label:'단가 역산'},{id:'notice',label:'고지서'},
  {id:'stat',label:'수익·손익'},{id:'complaint',label:'민원'},
];
function renderNav(){
  var w=document.getElementById('subtabs');
  w.innerHTML=SUBS.map(function(s){return'<button class="stab'+(_st.tab===s.id?' active':'')+' " data-t="'+s.id+'">'+s.label+'</button>';}).join('');
  w.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){_st.tab=b.dataset.t;renderNav();renderBody();};});
}
function renderBody(){
  var f={dash:renderDash,master:renderMaster,map:renderMap,contract:renderContract,
    esign:renderEsign,payment:renderPayment,expense:renderExpense,price:renderPrice,

  var byB={},byD={},byG={'1학년':0,'2학년':0},s1=0,s2=0;

/* ── 기숙사비 ── */
function renderPayment(){
  var all=_D.payments;
  var billed=0,paid=0;
  all.forEach(function(p){billed+=p.amount||0;if(p.status==='paid')paid+=p.amount||0;});
  var unpaid=billed-paid;
  var h='<div class="kpis">'
    +'<div class="kpi"><div class="kn">'+won(billed)+'<small>원</small></div><div class="kl">총 청구</div></div>'
    +'<div class="kpi"><div class="kn" style="color:var(--green)">'+won(paid)+'<small>원</small></div><div class="kl">수납</div></div>'
    +'<div class="kpi"><div class="kn" style="color:var(--red)">'+won(unpaid)+'<small>원</small></div><div class="kl">미납</div></div>'
    +'</div>';
  var cts=_D.contracts.filter(function(c){return c.status==='active';});
  var byC={};all.forEach(function(p){(byC[p.contract_id]=byC[p.contract_id]||[]).push(p);});
  h+='<div class="card"><div class="ct">납부 스케줄 현황</div>';
  if(!cts.length){h+='<p class="muted">진행 중 계약이 없습니다.</p>';}
  else{
    h+=cts.slice(0,20).map(function(c){
      var list=byC[c.id]||[];
      return'<div class="paybox"><div class="payhd"><div><b>'+esc(c.resident_name)+'</b> <span class="muted">'+esc(c.student_no||'')+'</span></div>'
        +'<span class="muted">'+won(c.unit_price)+'원/월</span>'
        +(list.length?'':'<button class="btn btn-s btn-sm pay-gen" data-id="'+c.id+'" data-s="'+c.start_date+'" data-e="'+c.end_date+'" data-p="'+c.unit_price+'">스케줄 생성</button>')
        +'</div>'
        +(list.length?'<div class="tbl-wrap"><table><thead><tr><th>기간</th><th>금액</th><th>납부기한</th><th>상태</th><th></th></tr></thead><tbody>'
          +list.map(function(p){
            var od=p.status!=='paid'&&p.due_date&&p.due_date<today();
            return'<tr><td>'+esc(p.period)+'</td><td>'+won(p.amount)+'</td><td>'+esc(p.due_date||'-')+'</td>'
              +'<td>'+(p.status==='paid'?'<span class="badge b-g">완납</span>':(od?'<span class="badge b-r">연체</span>':'<span class="badge b-gr">미납</span>'))+'</td>'
              +'<td>'+(p.status==='paid'
                ?'<button class="btn btn-g btn-sm pay-un" data-id="'+p.id+'">취소</button>'
                :'<button class="btn btn-p btn-sm pay-ok" data-id="'+p.id+'">수납</button>')+'</td></tr>';
          }).join('')+'</tbody></table></div>':'')+'</div>';
    }).join('');
    if(cts.length>20)h+='<p class="muted">… 외 '+(cts.length-20)+'건</p>';
  }
  h+='</div>';
  setBody(h);
  document.querySelectorAll('.pay-gen').forEach(function(b){b.onclick=function(){
    var cid=b.dataset.id,p=num(b.dataset.p);
    MONTHS.forEach(function(m){
      _D.payments.push({id:'pay'+nid(),contract_id:cid,period:m,amount:p,due_date:m+'-01',status:'pending',paid_date:null});
    });
    toast(MONTHS.length+'개월 스케줄 생성','success');renderPayment();
  };});
  document.querySelectorAll('.pay-ok').forEach(function(b){b.onclick=function(){
    var p=_D.payments.find(function(x){return x.id===b.dataset.id;});
    if(p){p.status='paid';p.paid_date=today();}renderPayment();
  };});
  document.querySelectorAll('.pay-un').forEach(function(b){b.onclick=function(){
    var p=_D.payments.find(function(x){return x.id===b.dataset.id;});
    if(p){p.status='pending';p.paid_date=null;}renderPayment();
  };});
}

/* ── 지출 ── */
function renderExpense(){
  var rows=_D.expenses.slice().sort(function(a,b){return b.expense_date.localeCompare(a.expense_date);});
  var totals={};EXP_CATS.forEach(function(c){totals[c]=0;});var sum=0;
  rows.forEach(function(r){totals[r.category]=(totals[r.category]||0)+(r.amount||0);sum+=r.amount||0;});
  var maxC=Math.max.apply(null,EXP_CATS.map(function(c){return totals[c];}).concat([1]));
  var bldOpts='<option value="">전체 공통</option>'+_D.buildings.map(function(b){return'<option value="'+b.id+'">'+esc(b.name)+'</option>';}).join('');
  var catOpts=EXP_CATS.map(function(c){return'<option>'+c+'</option>';}).join('');
  var h='<div class="g2">'
    +'<div class="card"><div class="ct">지출 등록</div>'
    +'<div class="fg"><label class="lbl">지출일</label><input id="ex-date" type="date" class="fi" value="'+today()+'"></div>'
    +'<div class="g2"><div class="fg"><label class="lbl">카테고리</label><select id="ex-cat" class="fs">'+catOpts+'</select></div>'
    +'<div class="fg"><label class="lbl">건물 귀속</label><select id="ex-bld" class="fs">'+bldOpts+'</select></div></div>'
    +'<div class="fg"><label class="lbl">항목명 *</label><input id="ex-item" class="fi"></div>'
    +'<div class="fg"><label class="lbl">금액(원) *</label><input id="ex-amt" class="fi" type="number"></div>'
    +'<div class="acts"><button id="ex-add" class="btn btn-p">지출 추가</button></div></div>'
    +'<div class="card"><div class="ct">카테고리별 집계 (합계 '+won(sum)+'원)</div>'
    +EXP_CATS.map(function(c){var w=Math.round(totals[c]/maxC*100);
      return'<div class="bar-row"><span class="bar-lbl">'+esc(c)+'</span>'
        +'<span class="bar-track"><span class="bar-fill" style="width:'+w+'%;background:var(--primary)"></span></span>'
        +'<span class="bar-val">'+won(totals[c])+'</span></div>';
    }).join('')+'</div></div>'
    +'<div class="card"><div class="ct">지출 목록</div>'+(rows.length
      ?'<div class="tbl-wrap"><table><thead><tr><th>일자</th><th>카테고리</th><th>항목</th><th>건물</th><th>금액</th><th></th></tr></thead><tbody>'
        +rows.map(function(r){return'<tr><td>'+esc(r.expense_date)+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.item_name)+'</td>'
          +'<td>'+esc(r.building_id?bldName(r.building_id):'공통')+'</td><td>'+won(r.amount)+'</td>'
          +'<td><button class="btn btn-d btn-sm ex-del" data-id="'+r.id+'">삭제</button></td></tr>';}).join('')+'</tbody></table></div>'
      :'<p class="muted">지출 내역이 없습니다.</p>')+'</div>';
  setBody(h);
  document.getElementById('ex-add').onclick=function(){
    var item=(val('ex-item')||'').trim(),amt=num(val('ex-amt'));
    if(!item||!amt){toast('항목명과 금액을 입력하세요.','error');return;}
    _D.expenses.push({id:'e'+nid(),expense_date:val('ex-date')||today(),item_name:item,category:val('ex-cat'),amount:amt,building_id:val('ex-bld')||null});
    toast('지출 등록 완료','success');renderExpense();
  };
  document.querySelectorAll('.ex-del').forEach(function(b){b.onclick=function(){
    cfm('이 지출을 삭제할까요?',function(){_D.expenses=_D.expenses.filter(function(x){return x.id!==b.dataset.id;});toast('삭제 완료','success');renderExpense();});
  };});

/* ── 단가 역산 ── */
function renderPrice(){
  var rms=_D.rooms;
  var income=0;_D.payments.forEach(function(p){if(p.status==='paid')income+=p.amount||0;});
  var expense=0;_D.expenses.forEach(function(e){expense+=e.amount||0;});
  var avgCur=rms.length?Math.round(rms.reduce(function(s,r){return s+(r.unit_price||0);},0)/rms.length):0;
  var h='<div class="card"><div class="ct">단가 역산 계산기</div>'
    +'<div class="g4"><div class="fg"><label class="lbl">기준 학기</label><input id="pr-sem" class="fi" value="2025-2학기"></div>'

    +'<div class="fg"><label class="lbl">현재 총지출</label><input id="pr-exp" class="fi" type="number" value="'+expense+'"></div>'
    +'<div class="fg"><label class="lbl">학기 개월수</label><input id="pr-mon" class="fi" type="number" value="6"></div></div>'
    +'<div class="g4"><div class="fg"><label class="lbl">목표 손익(원)</label><input id="pr-goal" class="fi" type="number" value="0"></div>'
    +'<div class="fg"><label class="lbl">다음 학기 예상 입실(명)</label><input id="pr-head" class="fi" type="number"></div>'
    +'<div class="fg"><label class="lbl">다음 학기 예상 지출</label><input id="pr-nexp" class="fi" type="number" value="'+expense+'"></div>'
    +'<div class="fg" style="align-self:end"><button id="pr-calc" class="btn btn-p" style="width:100%">단가 계산</button></div></div>'
    +'<div id="pr-result"></div></div><div id="pr-table"></div>';
  setBody(h);
  document.getElementById('pr-calc').onclick=function(){
    var months=num(val('pr-mon'))||1,head=num(val('pr-head')),goal=num(val('pr-goal')),nexp=num(val('pr-nexp'));
    if(!head){toast('예상 입실 인원을 입력하세요.','error');return;}
    var targetIncome=nexp+goal,avgNeed=Math.round(targetIncome/head/months);
    var rate=avgCur?((avgNeed-avgCur)/avgCur*100):0;
    document.getElementById('pr-result').innerHTML='<div class="kpis" style="margin-top:14px">'
      +'<div class="kpi"><div class="kn">'+won(targetIncome)+'<small>원</small></div><div class="kl">목표 수입</div></div>'
      +'<div class="kpi"><div class="kn">'+won(avgNeed)+'<small>원</small></div><div class="kl">필요 평균 단가</div></div>'
      +'<div class="kpi"><div class="kn">'+won(avgCur)+'<small>원</small></div><div class="kl">현재 평균 단가</div></div>'
      +'<div class="kpi"><div class="kn" style="color:'+(rate>=0?'var(--red)':'var(--green)')+'">'+rate.toFixed(1)+'<small>%</small></div><div class="kl">필요 인상률</div></div>'
      +'</div>';
    renderPriceTable(rms,rate,val('pr-sem'));
  };
}
function renderPriceTable(rms,rate,sem){
  var w=document.getElementById('pr-table');
  w.innerHTML='<div class="card"><div class="ct">건물·호실별 추천 단가</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>건물</th><th>호실</th><th>현재</th><th>추천</th><th>최종(조정)</th></tr></thead><tbody>'
    +rms.map(function(r){
      var rec=Math.round((r.unit_price||0)*(1+rate/100));
      return'<tr data-rid="'+r.id+'" data-cur="'+r.unit_price+'"><td>'+esc(bldName(r.building_id))+'</td><td>'+esc(r.room_number)+'</td>'
        +'<td>'+won(r.unit_price)+'</td><td class="pr-rec">'+won(rec)+'</td>'
        +'<td><input class="fi pr-fin" type="number" value="'+rec+'" style="width:120px"></td></tr>';
    }).join('')+'</tbody></table></div>'
    +'<p id="pr-proj" class="muted" style="margin-top:8px"></p>'
    +'<div class="acts"><button id="pr-save" class="btn btn-p">단가 확정 저장</button></div></div>';
  function recalc(){var s=0;document.querySelectorAll('tr[data-rid]').forEach(function(tr){s+=num(tr.querySelector('.pr-fin').value);});
    document.getElementById('pr-proj').textContent='최종 단가 합계: '+won(s)+'원 (월 기준)';}
  document.querySelectorAll('.pr-fin').forEach(function(i){i.oninput=recalc;});
  recalc();
  document.getElementById('pr-save').onclick=function(){
    var changed=0;document.querySelectorAll('tr[data-rid]').forEach(function(tr){
      var rid=tr.dataset.rid,cur=num(tr.dataset.cur),fin=num(tr.querySelector('.pr-fin').value);
      var r=_D.rooms.find(function(x){return x.id===rid;});if(r&&fin&&fin!==cur){r.unit_price=fin;changed++;}
    });
    toast(changed+'개 호실 단가가 저장되었습니다.','success');
  };
}

    +'<div class="bar-row"><span class="bar-lbl">지출</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.round(expense/maxIE*100)+'%;background:var(--red)"></span></span><span class="bar-val">'+won(expense)+'</span></div>'
    +'</div>'
    +'<div class="card"><div class="ct">지출 카테고리</div>'
    +EXP_CATS.map(function(c){var v=cat[c]||0,w=expense?Math.round(v/expense*100):0;
      return'<div class="bar-row"><span class="bar-lbl">'+esc(c)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+w+'%"></span></span><span class="bar-val">'+won(v)+'</span></div>';
    }).join('')+'</div></div>';
  setBody(h);
}

/* ── 민원 ── */
function renderComplaint(){
  var filters=[['all','전체'],['received','접수'],['in_progress','처리중'],['done','완료']];
  var rows=_D.complaints.filter(function(c){return _st.cmf==='all'||c.status===_st.cmf;});
  function cmBadge(s){var m={received:'<span class="badge b-b">접수</span>',in_progress:'<span class="badge b-o">처리중</span>',done:'<span class="badge b-g">완료</span>'};return m[s]||'<span class="badge b-gr">?</span>';}
  var portalBase=location.origin+location.pathname.replace(/[^/]*$/,'');
  var h='<div class="card"><div class="ct">외부 포털 링크</div>'
    +'<div class="acts">'
    +'<button class="btn btn-s btn-sm" id="pt-res">입소자 포털 링크 복사</button>'
    +'<button class="btn btn-s btn-sm" id="pt-cmp">민원 접수 링크 복사</button>'
    +'</div><p class="muted" style="margin-top:8px">링크에는 연결 정보가 포함되어 입소자가 바로 접속할 수 있습니다.</p></div>'
    +'<div class="card"><div class="modebar">'
    +filters.map(function(f){return'<button class="mbtn'+(_st.cmf===f[0]?' active':'')+' " data-cmf="'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div>'
    +(rows.length?'<div class="tbl-wrap"><table><thead><tr><th>접수번호</th><th>호실</th><th>성명</th><th>제목</th><th>분류</th><th>접수일</th><th>상태</th></tr></thead><tbody>'
      +rows.map(function(c){
        return'<tr class="clk cm-row" data-id="'+c.id+'">'
          +'<td>'+esc(c.ticket_no||'-')+'</td><td>'+esc(c.room_label||'-')+'</td><td>'+esc(c.resident_name||'-')+'</td>'
          +'<td>'+esc(c.title)+'</td><td>'+esc(c.category||'-')+'</td>'
          +'<td>'+esc((c.created_at||'').slice(0,10))+'</td><td>'+cmBadge(c.status)+'</td></tr>';
      }).join('')+'</tbody></table></div>'
      :'<p class="muted">민원이 없습니다.</p>')+'</div>'
    +'<div id="cm-detail"></div>';
  setBody(h);
  document.querySelectorAll('[data-cmf]').forEach(function(b){b.onclick=function(){_st.cmf=b.dataset.cmf;_st.cmOpen=null;renderComplaint();};});
  document.querySelectorAll('.cm-row').forEach(function(tr){tr.onclick=function(){openComplaint(tr.dataset.id);};});
  document.getElementById('pt-res').onclick=function(){
    var link=portalBase+'dormitory/resident.html';
    navigator.clipboard&&navigator.clipboard.writeText(link).then(function(){toast('링크가 복사되었습니다.','success');}).catch(function(){toast('복사 실패','error');});
    if(!navigator.clipboard)toast(link,'info');
  };
  document.getElementById('pt-cmp').onclick=function(){
    var link=portalBase+'dormitory/complaint.html';
    navigator.clipboard&&navigator.clipboard.writeText(link).then(function(){toast('링크가 복사되었습니다.','success');}).catch(function(){toast('복사 실패','error');});
    if(!navigator.clipboard)toast(link,'info');
  };
  if(_st.cmOpen)openComplaint(_st.cmOpen);
}
function openComplaint(id){
  _st.cmOpen=id;
  var c=_D.complaints.find(function(x){return x.id===id;});if(!c)return;
  var cms=_D.complaint_comments.filter(function(x){return x.complaint_id===id;});
  var TPLS=['접수되었습니다. 담당자 확인 후 처리 예정입니다.','현재 처리 중에 있습니다.','처리가 완료되었습니다.'];
  var h='<div class="card"><div class="ct">'+esc(c.title)+' <span class="muted">'+esc(c.ticket_no||'')+'</span></div>'
    +'<p class="muted">'+esc(c.resident_name)+' · '+esc(c.room_label)+' · '+esc(c.category)+' · '+esc((c.created_at||'').slice(0,16).replace('T',' '))+'</p>'
    +'<div class="cm-content">'+esc(c.content||'')+'</div>'
    +'<div class="g2"><div class="fg"><label class="lbl">상태</label><select id="cm-status" class="fs">'
    +[['received','접수'],['in_progress','처리중'],['done','완료']].map(function(s){return'<option value="'+s[0]+'"'+(c.status===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')
    +'</select></div><div class="fg"><label class="lbl">담당자</label><input id="cm-asgn" class="fi" value="'+esc(c.assignee||'')+'"></div></div>'
    +'<div class="acts"><button id="cm-sv" class="btn btn-s btn-sm">상태/담당 저장</button></div>'
    +'<h4 class="lbl" style="margin-top:16px">처리 내역</h4>'
    +(cms.length?cms.map(function(m){return'<div class="cm-comment"><b>'+esc(m.author)+'</b> <span class="muted">'+esc((m.created_at||'').slice(0,16).replace('T',' '))+'</span><div style="margin-top:4px">'+esc(m.body)+'</div></div>';}).join(''):'<p class="muted">아직 없습니다.</p>')
    +'<label class="lbl" style="margin-top:12px">답변 등록</label>'
    +'<select id="cm-tpl" class="fs" style="margin-bottom:6px"><option value="">템플릿 선택…</option>'
    +TPLS.map(function(t){return'<option>'+esc(t)+'</option>';}).join('')+'</select>'
    +'<textarea id="cm-body" class="fi" rows="2"></textarea>'
    +'<div class="acts"><button id="cm-add" class="btn btn-p btn-sm">답변 등록</button></div></div>';
  document.getElementById('cm-detail').innerHTML=h;
  document.getElementById('cm-tpl').onchange=function(){if(this.value)setv('cm-body',this.value);};
  document.getElementById('cm-sv').onclick=function(){
    c.status=val('cm-status');c.assignee=(val('cm-asgn')||'').trim();
    toast('저장됨','success');renderComplaint();
  };
  document.getElementById('cm-add').onclick=function(){
    var b=(val('cm-body')||'').trim();if(!b)return;
    _D.complaint_comments.push({id:'cc'+nid(),complaint_id:id,author:'관리자',body:b,created_at:new Date().toISOString()});
    openComplaint(id);
  };
}

/* ── Init ── */
renderNav();renderBody();
window._st=_st;
})();
</script>
