<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아세아항공직업전문학교 업무캘린더</title>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="calendar.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1D4ED8;
      --blue-light: #EFF6FF;
      --blue-mid: #3B82F6;
      --green: #16A34A;
      --yellow: #CA8A04;
      --red: #DC2626;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --dept1-bg: #E8F0FE; --dept1-color: #1a5fbf; --dept1-border: #4285F4;
      --dept2-bg: #E6F4EA; --dept2-color: #1e7e34; --dept2-border: #34A853;
      --dept3-bg: #FEF7E0; --dept3-color: #856404; --dept3-border: #FBBC05;
      --dept4-bg: #FCE8E6; --dept4-color: #b3261e; --dept4-border: #EA4335;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #app-header {
      background: var(--blue);
      color: #fff;
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #app-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #btn-login, #btn-logout {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #btn-login:hover, #btn-logout:hover { background: rgba(255,255,255,0.25); }

    /* ── Login card ──────────────────────────────────────────── */
    #login-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      padding: 48px 40px;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .login-card .logo {
      width: 56px;
      height: 56px;
      background: var(--blue);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    .login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--gray-600); margin-bottom: 28px; }
    .btn-google-login {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      justify-content: center;
    }
    .btn-google-login:hover { background: #1e40af; }
    .btn-google-login svg { width: 18px; height: 18px; }

    /* ── Calendar view ───────────────────────────────────────── */
    #calendar-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    /* Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-nav {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--gray-800);
    }
    .btn-nav:hover { background: var(--gray-100); }
    #month-label {
      font-size: 16px;
      font-weight: 700;
      min-width: 90px;
      text-align: center;
    }
    #toolbar-spacer { flex: 1; }
    #btn-quick-add {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    #btn-quick-add:hover { background: #1e40af; }

    /* Calendar grid */
    #calendar-wrap {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--gray-200);
      overflow: hidden;
      flex: 1;
    }
    .dow-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }
    .dow-cell {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 0;
      color: var(--gray-600);
    }
    .dow-cell:first-child { color: #DC2626; }
    .dow-cell:last-child  { color: #2563EB; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-day {
      border-right: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
      min-height: 80px;
      padding: 4px;
      cursor: pointer;
      position: relative;
      transition: background 0.1s;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day:hover { background: var(--blue-light); }
    .cal-day.other-month { background: var(--gray-50); }
    .cal-day.today .day-num {
      background: var(--blue);
      color: #fff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .day-num {
      font-size: 12px;
      font-weight: 600;
      line-height: 24px;
      margin-bottom: 2px;
      display: inline-block;
    }
    .cal-day.sunday .day-num  { color: #DC2626; }
    .cal-day.saturday .day-num { color: #2563EB; }
    .cal-day.today.sunday .day-num,
    .cal-day.today.saturday .day-num { color: #fff; }

    /* Event chips */
    .event-chip {
      display: block;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      margin-bottom: 1px;
      border-left: 3px solid var(--dept4-border);
      background: var(--dept4-bg);
      color: var(--dept4-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      line-height: 1.6;
    }
    .event-chip.dept-기획처 { border-left-color: var(--dept1-border); background: var(--dept1-bg); color: var(--dept1-color); }
    .event-chip.dept-교학처 { border-left-color: var(--dept2-border); background: var(--dept2-bg); color: var(--dept2-color); }
    .event-chip.dept-행정처 { border-left-color: var(--dept3-border); background: var(--dept3-bg); color: var(--dept3-color); }
    .event-chip.dept-기타   { border-left-color: var(--dept4-border); background: var(--dept4-bg); color: var(--dept4-color); }
    .more-events {
      font-size: 10px;
      color: var(--gray-400);
      padding: 1px 4px;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    #contact-footer {
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: var(--gray-600);
      border-top: 1px solid var(--gray-200);
      background: #fff;
    }
    #contact-footer a { color: var(--blue); text-decoration: none; }
    #contact-footer a:hover { text-decoration: underline; }

    /* ── Modals ──────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 4px;
    }
    .form-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      font-size: 14px;
      color: var(--gray-800);
    }
    .form-input:focus { outline: none; border-color: var(--blue); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .form-check input { cursor: pointer; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .btn-cancel {
      background: var(--gray-100);
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-submit {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background: #1e40af; }
    .btn-cancel:hover { background: var(--gray-200); }

    /* Event detail modal */
    .detail-time {
      font-size: 13px;
      color: var(--gray-600);
      margin-bottom: 6px;
    }
    .detail-desc {
      font-size: 13px;
      color: var(--gray-600);
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }

    /* Loading */
    #cal-loading {
      display: none;
      text-align: center;
      padding: 40px;
      color: var(--gray-600);
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .cal-day { min-height: 58px; padding: 2px; }
      .day-num { font-size: 11px; }
      .event-chip { font-size: 9px; }
      #month-label { font-size: 14px; }
      .login-card { padding: 32px 20px; }
      #app-header h1 { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header id="app-header">
  <h1>아세아항공직업전문학교 업무캘린더</h1>
  <button id="btn-login" onclick="doLogin()">Google 로그인</button>
  <button id="btn-logout" style="display:none" onclick="doLogout()">로그아웃</button>
</header>

<!-- Login view -->
<div id="login-view">
  <div class="login-card">
    <div class="logo">📅</div>
    <h2>업무 캘린더</h2>
    <p>Google 계정으로 로그인하여<br>일정을 확인하고 등록하세요.</p>
    <button class="btn-google-login" onclick="doLogin()">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/>
        <path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/>
        <path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
      </svg>
      Google 계정으로 로그인
    </button>
  </div>
</div>

<!-- Calendar view -->
<div id="calendar-view" style="display:none">
  <!-- Toolbar -->
  <div id="toolbar">
    <button class="btn-nav" onclick="changeMonth(-1)">◀ 이전달</button>
    <span id="month-label"></span>
    <button class="btn-nav" onclick="changeMonth(1)">다음달 ▶</button>
    <button class="btn-nav" onclick="goToday()">오늘</button>
    <div id="toolbar-spacer"></div>
    <button id="btn-quick-add" onclick="openAddModal(null)">⚡ 빠른 일정 등록</button>
  </div>

  <!-- Calendar grid wrapper -->
  <div id="calendar-wrap">
    <div class="dow-header">
      <div class="dow-cell">일</div>
      <div class="dow-cell">월</div>
      <div class="dow-cell">화</div>
      <div class="dow-cell">수</div>
      <div class="dow-cell">목</div>
      <div class="dow-cell">금</div>
      <div class="dow-cell">토</div>
    </div>
    <div id="cal-loading">일정을 불러오는 중...</div>
    <div id="cal-grid" class="cal-grid"></div>
  </div>
</div>

<!-- Contact footer -->
<footer id="contact-footer"></footer>

<!-- ── Add Event Modal ─────────────────────────────────────── -->
<div id="add-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">일정 등록</div>
    <div class="form-group">
      <label class="form-label" for="ev-title">제목 *</label>
      <input id="ev-title" class="form-input" type="text" placeholder="일정 제목을 입력하세요">
    </div>
    <div class="form-group">
      <label class="form-check">
        <input type="checkbox" id="ev-allday" onchange="toggleAllDay()"> 하루 종일
      </label>
    </div>
    <div class="form-group">
      <label class="form-label" for="ev-date">날짜 *</label>
      <input id="ev-date" class="form-input" type="date">
    </div>
    <div id="time-fields" class="form-row">
      <div class="form-group">
        <label class="form-label" for="ev-start">시작 시간</label>
        <input id="ev-start" class="form-input" type="time" value="09:00">
      </div>
      <div class="form-group">
        <label class="form-label" for="ev-end">종료 시간</label>
        <input id="ev-end" class="form-input" type="time" value="10:00">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="ev-desc">설명 (부서 태그 포함 가능)</label>
      <input id="ev-desc" class="form-input" type="text" placeholder="예: [부서:기획처] 회의">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">취소</button>
      <button class="btn-submit" onclick="submitEvent()">등록</button>
    </div>
  </div>
</div>

<!-- ── Event Detail Modal ──────────────────────────────────── -->
<div id="detail-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="detail-title"></div>
    <div class="detail-time" id="detail-time"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDetailModal()">닫기</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ── State ────────────────────────────────────────────────── */
var currentYear  = new Date().getFullYear();
var currentMonth = new Date().getMonth(); // 0-indexed
var allEvents    = [];
var isLoading    = false;

/* ── Contact footer ───────────────────────────────────────── */
(function initFooter() {
  var info;
  try { info = JSON.parse(localStorage.getItem('asea_contact_info') || 'null'); } catch(e) {}
  if (!info) info = { name: '방시원', title: '차장', phone: '' };
  var footer = document.getElementById('contact-footer');
  var phoneHtml = info.phone
    ? ' &nbsp;|&nbsp; <a href="tel:' + info.phone + '">' + info.phone + '</a>'
    : '';
  footer.innerHTML = '문의: ' + esc(info.name) + ' ' + esc(info.title) + phoneHtml;
})();

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Auth ─────────────────────────────────────────────────── */
function doLogin() {
  Auth.login().then(function() {
    showCalendar();
  }).catch(function(e) {
    console.error('로그인 실패', e);
  });
}

function doLogout() {
  Auth.logout();
  showLoginView();
}

function showLoginView() {
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('calendar-view').style.display = 'none';
  document.getElementById('btn-login').style.display = '';
  document.getElementById('btn-logout').style.display = 'none';
}

function showCalendar() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('calendar-view').style.display = 'flex';
  document.getElementById('btn-login').style.display = 'none';
  document.getElementById('btn-logout').style.display = '';
  loadAndRender();
}

/* ── Auth change listener ─────────────────────────────────── */
Auth.onAuthChange(function(loggedIn) {
  if (loggedIn) {
    showCalendar();
  } else {
    showLoginView();
  }
});

/* Restore session on page load */
window.addEventListener('load', function() {
  if (Auth.tryRestoreSession && Auth.tryRestoreSession()) {
    showCalendar();
  } else if (Auth.isLoggedIn()) {
    showCalendar();
  }
});

/* ── Calendar logic ───────────────────────────────────────── */
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  loadAndRender();
}

function goToday() {
  var now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  loadAndRender();
}

function loadAndRender() {
  updateMonthLabel();
  renderGrid([]);
  fetchEvents();
}

function updateMonthLabel() {
  document.getElementById('month-label').textContent = currentYear + '년 ' + (currentMonth + 1) + '월';
}

function fetchEvents() {
  if (!Auth.isLoggedIn()) return;
  var start = new Date(currentYear, currentMonth, 1);
  var end   = new Date(currentYear, currentMonth + 1, 0, 23, 59, 59);
  // expand to include cells from prev/next month visible in grid
  var gridStart = new Date(start);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());
  var gridEnd = new Date(end);
  gridEnd.setDate(gridEnd.getDate() + (6 - gridEnd.getDay()));
  gridEnd.setHours(23,59,59);

  document.getElementById('cal-loading').style.display = 'block';
  document.getElementById('cal-grid').style.display = 'none';

  CalendarModule.listEvents(
    CONFIG.calendarId,
    gridStart.toISOString(),
    gridEnd.toISOString()
  ).then(function(events) {
    allEvents = events || [];
    document.getElementById('cal-loading').style.display = 'none';
    document.getElementById('cal-grid').style.display = 'grid';
    renderGrid(allEvents);
  }).catch(function(e) {
    document.getElementById('cal-loading').style.display = 'none';
    document.getElementById('cal-grid').style.display = 'grid';
    console.error('일정 로드 실패', e);
    renderGrid([]);
  });
}

function deptClass(description) {
  if (!description) return 'dept-기타';
  var m = /\[부서:([^\]]+)\]/.exec(description);
  if (m) return 'dept-' + m[1];
  var depts = ['기획처','교학처','행정처'];
  for (var i = 0; i < depts.length; i++) {
    if (description.indexOf(depts[i]) !== -1) return 'dept-' + depts[i];
  }
  return 'dept-기타';
}

function fmtDate(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function pad2(n) { return n < 10 ? '0'+n : String(n); }

function getEventDate(ev) {
  if (ev.start.date) return ev.start.date;
  return fmtDate(new Date(ev.start.dateTime));
}

function formatEventTime(ev) {
  if (ev.start.date) return '하루 종일';
  var s = new Date(ev.start.dateTime);
  var e = new Date(ev.end.dateTime);
  return pad2(s.getHours())+':'+pad2(s.getMinutes()) + ' – ' + pad2(e.getHours())+':'+pad2(e.getMinutes());
}

function renderGrid(events) {
  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // Build map: dateStr → events[]
  var evMap = {};
  events.forEach(function(ev) {
    var d = getEventDate(ev);
    if (!evMap[d]) evMap[d] = [];
    evMap[d].push(ev);
  });

  var today = fmtDate(new Date());
  var firstDay = new Date(currentYear, currentMonth, 1);
  var startOffset = firstDay.getDay(); // 0=Sun
  var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  var prevDays = new Date(currentYear, currentMonth, 0).getDate();

  // Total cells: enough rows
  var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  for (var i = 0; i < totalCells; i++) {
    var cell = document.createElement('div');
    cell.className = 'cal-day';

    var cellDate, otherMonth = false;
    if (i < startOffset) {
      // prev month
      cellDate = new Date(currentYear, currentMonth - 1, prevDays - startOffset + i + 1);
      otherMonth = true;
    } else if (i >= startOffset + daysInMonth) {
      // next month
      cellDate = new Date(currentYear, currentMonth + 1, i - startOffset - daysInMonth + 1);
      otherMonth = true;
    } else {
      cellDate = new Date(currentYear, currentMonth, i - startOffset + 1);
    }

    var dow = cellDate.getDay();
    var dateStr = fmtDate(cellDate);

    if (otherMonth) cell.classList.add('other-month');
    if (dateStr === today) cell.classList.add('today');
    if (dow === 0) cell.classList.add('sunday');
    if (dow === 6) cell.classList.add('saturday');

    // Day number
    var numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = cellDate.getDate();
    cell.appendChild(numEl);

    // Events
    var dayEvs = evMap[dateStr] || [];
    var maxShow = 3;
    dayEvs.slice(0, maxShow).forEach(function(ev) {
      var chip = document.createElement('div');
      chip.className = 'event-chip ' + deptClass(ev.description);
      chip.textContent = ev.summary || '(제목 없음)';
      chip.title = ev.summary || '';
      chip.addEventListener('click', function(e) {
        e.stopPropagation();
        openDetailModal(ev);
      });
      cell.appendChild(chip);
    });
    if (dayEvs.length > maxShow) {
      var more = document.createElement('div');
      more.className = 'more-events';
      more.textContent = '+' + (dayEvs.length - maxShow) + '개';
      cell.appendChild(more);
    }

    // Click on day = open add modal
    (function(ds) {
      cell.addEventListener('click', function() {
        openAddModal(ds);
      });
    })(dateStr);

    grid.appendChild(cell);
  }
}

/* ── Add Event Modal ──────────────────────────────────────── */
function openAddModal(dateStr) {
  if (!Auth.isLoggedIn()) { doLogin(); return; }
  var d = dateStr || fmtDate(new Date());
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-date').value = d;
  document.getElementById('ev-allday').checked = false;
  document.getElementById('ev-start').value = '09:00';
  document.getElementById('ev-end').value = '10:00';
  document.getElementById('ev-desc').value = '';
  document.getElementById('time-fields').style.display = 'grid';
  document.getElementById('add-modal').classList.add('open');
  setTimeout(function() { document.getElementById('ev-title').focus(); }, 100);
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function toggleAllDay() {
  var allDay = document.getElementById('ev-allday').checked;
  document.getElementById('time-fields').style.display = allDay ? 'none' : 'grid';
}

function submitEvent() {
  var title = document.getElementById('ev-title').value.trim();
  if (!title) { alert('제목을 입력하세요.'); return; }
  var dateStr  = document.getElementById('ev-date').value;
  if (!dateStr) { alert('날짜를 선택하세요.'); return; }
  var allDay   = document.getElementById('ev-allday').checked;
  var startT   = document.getElementById('ev-start').value;
  var endT     = document.getElementById('ev-end').value;
  var desc     = document.getElementById('ev-desc').value.trim();

  var eventData;
  if (allDay) {
    var nextDay = new Date(dateStr);
    nextDay.setDate(nextDay.getDate() + 1);
    eventData = {
      summary: title,
      description: desc || undefined,
      start: { date: dateStr },
      end:   { date: fmtDate(nextDay) },
    };
  } else {
    eventData = {
      summary: title,
      description: desc || undefined,
      start: { dateTime: dateStr + 'T' + startT + ':00', timeZone: 'Asia/Seoul' },
      end:   { dateTime: dateStr + 'T' + endT   + ':00', timeZone: 'Asia/Seoul' },
    };
  }

  var btn = document.querySelector('#add-modal .btn-submit');
  btn.disabled = true;
  btn.textContent = '등록 중...';

  CalendarModule.createEvent(CONFIG.calendarId, eventData).then(function() {
    closeAddModal();
    loadAndRender();
  }).catch(function(e) {
    alert('일정 등록 실패: ' + (e.message || e));
  }).finally(function() {
    btn.disabled = false;
    btn.textContent = '등록';
  });
}

/* ── Event Detail Modal ───────────────────────────────────── */
function openDetailModal(ev) {
  document.getElementById('detail-title').textContent = ev.summary || '(제목 없음)';
  document.getElementById('detail-time').textContent = formatEventTime(ev);
  var desc = ev.description || '';
  // strip internal tags for display
  desc = desc.replace(/\[부서:[^\]]+\]/g, '').trim();
  document.getElementById('detail-desc').textContent = desc;
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
}

/* Close modals on overlay click */
document.getElementById('add-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeDetailModal();
});

/* ESC key */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAddModal();
    closeDetailModal();
  }
});

/* Init label */
updateMonthLabel();
</script>
