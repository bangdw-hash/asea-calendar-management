<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주차 위치 공유</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary:#1A73E8;--primary-dk:#1557B0;--primary-lt:#E8F0FE;
  --green:#16a34a;--green-lt:#dcfce7;--green-bd:#bbf7d0;
  --orange:#ea580c;--orange-lt:#ffedd5;
  --red:#dc2626;--red-lt:#fee2e2;
  --gray:#6b7280;--gray-lt:#f3f4f6;
  --r:10px;
  --bg:#f8fafc;--card:#fff;--border:#e5e7eb;--text:#111827;--sub:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--primary);color:#fff;padding:16px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.share-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600}
.share-btn:active{background:rgba(255,255,255,.35)}

/* ── 주차 중 상태 배너 (크게 표시) ── */
.park-banner{margin:14px 14px 0;border-radius:16px;overflow:hidden;
  border:2px solid var(--green-bd);background:var(--green-lt);display:none}
.park-banner.show{display:block}
.banner-head{padding:12px 18px 6px;display:flex;align-items:center;gap:8px}
.banner-dot{width:10px;height:10px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(22,163,74,.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(22,163,74,.2)}50%{box-shadow:0 0 0 6px rgba(22,163,74,.08)}}
.banner-status{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.3px}
.banner-time{font-size:12px;color:var(--green);opacity:.7;margin-left:auto}
.banner-body{padding:4px 18px 16px}
.banner-place{font-size:22px;font-weight:800;color:#14532d;line-height:1.2}
.banner-floor{font-size:16px;font-weight:700;color:var(--green);margin-top:4px}
.banner-detail{font-size:13px;color:#166534;margin-top:3px;opacity:.85}
.banner-notes{font-size:13px;color:#166534;margin-top:8px;
  background:rgba(255,255,255,.6);border-radius:8px;padding:8px 10px;line-height:1.5}

/* ── 주차 없음 배너 ── */
.away-banner{margin:14px 14px 0;border-radius:16px;background:var(--card);
  border:1.5px solid var(--border);padding:14px 18px;
  display:flex;align-items:center;gap:10px}
.away-banner.hide{display:none}
.away-dot{width:10px;height:10px;border-radius:50%;background:#d1d5db}
.away-label{font-size:14px;color:var(--sub);font-weight:600}

/* ── 입력 폼 ── */
.form-section{margin:12px 14px 0;background:var(--card);border-radius:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);padding:18px}
.form-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:16px;
  letter-spacing:.8px;text-transform:uppercase}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--border);
  border-radius:var(--r);padding:11px 13px;font-size:16px;color:var(--text);background:#fff;
  outline:none;transition:border-color .15s;font-family:inherit;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
.field textarea{resize:none;height:68px;font-size:14px}

/* 장소 선택 */
.place-row{display:flex;gap:8px}
.place-seg{display:flex;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;flex:1}
.place-seg button{flex:1;padding:11px 6px;border:none;background:#fff;font-size:14px;
  font-weight:600;color:var(--sub);cursor:pointer;transition:all .12s;font-family:inherit}
.place-seg button+button{border-left:1px solid var(--border)}
.place-seg button.active{background:var(--primary-lt);color:var(--primary)}

/* 기타 입력 */
#etcInput{display:none;margin-top:8px}

/* 층 선택 */
.floor-row{display:flex;gap:8px;align-items:stretch}
.floor-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.floor-toggle button{padding:11px 16px;border:none;background:#fff;font-size:14px;
  font-weight:700;cursor:pointer;transition:all .12s;font-family:inherit;color:var(--sub)}
.floor-toggle button+button{border-left:1px solid var(--border)}
.floor-toggle button.active{background:var(--primary-lt);color:var(--primary)}
.floor-num-wrap{position:relative;flex:1;display:flex;align-items:center}
.floor-num-wrap input{padding-right:28px;text-align:center;font-size:20px;font-weight:700}
.floor-unit{position:absolute;right:12px;font-size:14px;font-weight:600;color:var(--sub);pointer-events:none}

/* 구역·번호 행 */
.spot-row{display:flex;gap:10px}
.spot-row>div{flex:1}
.spot-row input{text-align:center;font-size:20px;font-weight:700}

/* 버튼 */
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:14px;border:none;border-radius:var(--r);font-size:16px;
  font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-park{background:var(--primary);color:#fff}
.btn-park:disabled{background:#9ca3af;cursor:not-allowed;transform:none}
.btn-leave{background:var(--red-lt);color:var(--red);border:1.5px solid #fca5a5}

.spacer{flex:1;min-height:20px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:16px;margin-top:4px}

/* 토스트 */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f2937;color:#fff;padding:10px 20px;border-radius:24px;
  font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>🚗 주차 위치</h1>
  <button class="share-btn" onclick="copyLink()">링크 복사</button>
</header>

<!-- 주차 중 상태 배너 -->
<div class="park-banner" id="parkBanner">
  <div class="banner-head">
    <span class="banner-dot"></span>
    <span class="banner-status">현재 주차 중</span>
    <span class="banner-time" id="bannerTime"></span>
  </div>
  <div class="banner-body">
    <div class="banner-place" id="bannerPlace"></div>
    <div class="banner-floor" id="bannerFloor"></div>
    <div class="banner-detail" id="bannerDetail"></div>
    <div class="banner-notes" id="bannerNotes" style="display:none"></div>
  </div>
</div>

<!-- 주차 없음 배너 -->
<div class="away-banner" id="awayBanner">
  <span class="away-dot"></span>
  <span class="away-label">현재 주차 위치 없음</span>
</div>

<!-- 입력 폼 -->
<div class="form-section">
  <div class="form-title">주차 위치 입력</div>

  <!-- 장소 선택 -->
  <div class="field">
    <label>장소</label>
    <div class="place-seg" id="placeSegs">
      <button class="active" data-place="집" onclick="selectPlace(this)">집</button>
      <button data-place="회사" onclick="selectPlace(this)">회사</button>
      <button data-place="기타" onclick="selectPlace(this)">기타</button>
    </div>
    <input type="text" id="etcInput" placeholder="장소명 직접 입력..." autocomplete="off">
  </div>

  <!-- 층 입력 -->
  <div class="field">
    <label>층</label>
    <div class="floor-row">
      <div class="floor-toggle" id="floorToggle">
        <button class="active" data-dir="지하" onclick="selectDir(this)">지하</button>
        <button data-dir="지상" onclick="selectDir(this)">지상</button>
      </div>
      <div class="floor-num-wrap">
        <input type="number" id="floorNum" min="1" max="99" placeholder="1" inputmode="numeric">
        <span class="floor-unit">층</span>
      </div>
    </div>
  </div>

  <!-- 구역·번호 -->
  <div class="field">
    <div class="spot-row">
      <div>
        <label>구역</label>
        <input type="text" id="inZone" placeholder="A, B, C..." maxlength="4"
          style="text-transform:uppercase">
      </div>
      <div>
        <label>번호</label>
        <input type="text" id="inSpot" placeholder="123" maxlength="6" inputmode="numeric">
      </div>
    </div>
  </div>

  <!-- 메모 -->
  <div class="field">
    <label>메모 (선택)</label>
    <textarea id="inNotes" placeholder="엘리베이터 근처, 기둥 옆..."></textarea>
  </div>

  <div class="btn-row">
    <button class="btn btn-park" id="btnPark" onclick="saveParking()">🅿️ 주차 완료</button>
    <button class="btn btn-leave" onclick="clearParking()">출차 완료</button>
  </div>
</div>

<div class="spacer"></div>
<footer>링크 복사 후 카카오톡으로 가족에게 전송하세요</footer>
<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';
const SUPA_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';

const params   = new URLSearchParams(location.search);
const OWNER_KEY = params.get('key') || 'default';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: false, autoRefreshToken: false }
});

// ── 장소 선택 ──
let selectedPlace = '집';

function selectPlace(btn) {
  document.querySelectorAll('#placeSegs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedPlace = btn.dataset.place;
  const etc = document.getElementById('etcInput');
  etc.style.display = selectedPlace === '기타' ? 'block' : 'none';
  if (selectedPlace !== '기타') etc.value = '';
}

// ── 층 방향 ──
let selectedDir = '지하';

function selectDir(btn) {
  document.querySelectorAll('#floorToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDir = btn.dataset.dir;
}

// ── 현재 상태 로드 ──
async function loadStatus() {
  const { data } = await sb
    .from('parking_locations')
    .select('*')
    .eq('owner_key', OWNER_KEY)
    .order('updated_at', { ascending: false })
    .limit(1);

  renderStatus(data?.[0]);
}

function renderStatus(rec) {
  const banner  = document.getElementById('parkBanner');
  const awayBnr = document.getElementById('awayBanner');

  if (rec?.is_parked) {
    banner.classList.add('show');
    awayBnr.classList.add('hide');

    document.getElementById('bannerPlace').textContent  = rec.building || '장소 미입력';
    document.getElementById('bannerFloor').textContent  = rec.floor    || '';
    const detail = [rec.zone ? '구역 ' + rec.zone : '', rec.spot ? rec.spot + '번' : '']
      .filter(Boolean).join(' · ');
    document.getElementById('bannerDetail').textContent = detail;
    const notesEl = document.getElementById('bannerNotes');
    if (rec.notes) { notesEl.textContent = rec.notes; notesEl.style.display = ''; }
    else            { notesEl.style.display = 'none'; }
    document.getElementById('bannerTime').textContent = fmtTime(rec.parked_at);
  } else {
    banner.classList.remove('show');
    awayBnr.classList.remove('hide');
  }
}

function fmtTime(iso) {
  if (!iso) return '';
  const d   = new Date(iso);
  const now = new Date();
  const diffMin = Math.floor((now - d) / 60000);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (diffMin < 1)  return '방금';
  if (diffMin < 60) return diffMin + '분 전';
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return hh + ':' + mm + ' (' + diffHr + '시간 전)';
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 주차 저장 ──
async function saveParking() {
  const place = selectedPlace === '기타'
    ? document.getElementById('etcInput').value.trim()
    : selectedPlace;
  const floorNum = document.getElementById('floorNum').value.trim();
  const floor    = floorNum ? selectedDir + ' ' + floorNum + '층' : '';
  const zone     = document.getElementById('inZone').value.trim().toUpperCase();
  const spot     = document.getElementById('inSpot').value.trim();
  const notes    = document.getElementById('inNotes').value.trim();

  if (!place && !floor && !zone && !spot) {
    toast('장소, 층, 구역·번호 중 하나 이상 입력해 주세요.'); return;
  }
  if (selectedPlace === '기타' && !place) {
    toast('기타 장소명을 입력해 주세요.'); return;
  }

  document.getElementById('btnPark').disabled = true;
  await sb.from('parking_locations').delete().eq('owner_key', OWNER_KEY);
  const { error } = await sb.from('parking_locations').insert({
    owner_key: OWNER_KEY,
    building:  place,
    floor,
    zone,
    spot,
    notes,
    is_parked: true,
    parked_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  });
  document.getElementById('btnPark').disabled = false;

  if (error) { toast('저장 실패: ' + error.message); return; }
  toast('주차 위치 저장 완료 ✅');
  await loadStatus();
}

// ── 출차 ──
async function clearParking() {
  const { error } = await sb.from('parking_locations')
    .update({ is_parked: false, updated_at: new Date().toISOString() })
    .eq('owner_key', OWNER_KEY);
  if (error) { toast('업데이트 실패'); return; }
  toast('출차 처리 완료 🚗');
  await loadStatus();
}

// ── 링크 복사 ──
async function copyLink() {
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    toast('링크 복사 완료 — 카카오톡으로 전송하세요');
  } catch {
    prompt('아래 링크를 복사하세요:', url);
  }
}

function toast(msg) {
  const wrap = document.getElementById('toastWrap');
  const el   = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

// ── Realtime ──
sb.channel('parking-' + OWNER_KEY)
  .on('postgres_changes', {
    event: '*', schema: 'public', table: 'parking_locations',
    filter: 'owner_key=eq.' + OWNER_KEY
  }, loadStatus)
  .subscribe();

loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
