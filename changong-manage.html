<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창공제 노래 콘테스트 관리자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F8FAFF;--bg2:#F0F4FF;--bg3:#F4F6F9;
  --card:#FFFFFF;--card2:#F8FAFF;
  --fg:#202124;--fg-sub:#1A73E8;--fg-muted:#5F6368;
  --border:#E1E5EA;--border2:#CBD5DF;
  --primary:#1A73E8;--primary-dk:#1557B0;--primary-lt:#EEF2FF;
  --green:#16A34A;--green-lt:#DCFCE7;
  --orange:#D97706;--orange-lt:#FEF3C7;
  --red:#DC2626;--red-lt:#FEE2E2;
  --r:6px;--sh:0 1px 3px rgba(60,64,67,.08),0 1px 2px rgba(60,64,67,.06);--sh-md:0 4px 16px rgba(60,64,67,.12);
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);}
body{font-family:var(--font);color:var(--fg);font-size:14px;display:flex;flex-direction:column;min-height:100vh;}

/* Login */
.login-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#1E3A5F 0%,#1A73E8 100%);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:36px;width:100%;max-width:360px;text-align:center;box-shadow:var(--sh-md);}
.login-icon{width:52px;height:52px;background:var(--primary-lt);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.login-title{font-size:18px;font-weight:800;margin-bottom:4px;color:var(--fg);}
.login-sub{font-size:13px;color:var(--fg-muted);margin-bottom:24px;}
.login-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:15px;border-radius:var(--r);padding:12px 14px;text-align:center;letter-spacing:.1em;outline:none;transition:border-color .15s;}
.login-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.15);}
.login-btn{margin-top:12px;width:100%;padding:13px;background:linear-gradient(135deg,#1E3A5F,#1A73E8);color:#fff;font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;transition:filter .15s;}
.login-btn:hover{filter:brightness(1.06);}
.login-err{margin-top:8px;font-size:12px;color:var(--red);min-height:18px;}

/* App layout */
#appWrap{display:none;flex-direction:column;height:100vh;}
.top-bar{background:linear-gradient(135deg,#1E3A5F 0%,#1A73E8 100%);border-bottom:none;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0;}
.top-logo{font-size:14px;font-weight:800;color:#fff;}
.top-actions{display:flex;gap:6px;}
.top-chip{padding:4px 10px;border-radius:var(--r);font-size:11.5px;font-weight:700;border:1px solid;cursor:pointer;transition:all .15s;}
.top-chip.cyan{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff;}
.top-chip.green{background:#D1FAE5;border-color:#6EE7B7;color:#065F46;}
.top-chip.orange{background:#FEF3C7;border-color:#FCD34D;color:#92400E;}

/* Tabs */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 12px;overflow-x:auto;flex-shrink:0;box-shadow:0 1px 3px rgba(60,64,67,.06);}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{padding:11px 14px;font-family:inherit;font-size:13px;font-weight:600;background:none;border:none;color:var(--fg-muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
.tab-btn:hover:not(.active){color:var(--fg);}
.tab-content{flex:1;overflow-y:auto;padding:16px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* Toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.btn{padding:8px 14px;border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn-primary{background:var(--primary-lt);border-color:rgba(26,115,232,.3);color:var(--primary);}
.btn-primary:hover{background:#DBEAFE;border-color:var(--primary);}
.btn-solid{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-solid:hover{background:var(--primary-dk);}
.btn-green{background:var(--green-lt);border-color:rgba(22,163,74,.3);color:var(--green);}
.btn-green:hover{background:#BBF7D0;border-color:var(--green);}
.btn-orange{background:var(--orange-lt);border-color:rgba(217,119,6,.3);color:var(--orange);}
.btn-orange:hover{background:#FDE68A;border-color:var(--orange);}
.btn-red{background:var(--red-lt);border-color:rgba(220,38,38,.3);color:var(--red);}
.btn-red:hover{background:#FECACA;border-color:var(--red);}
.btn-ghost{background:#fff;border-color:var(--border2);color:var(--fg-muted);}
.btn-ghost:hover{background:var(--bg3);color:var(--fg);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.search-input{flex:1;min-width:160px;background:#fff;border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:13px;border-radius:var(--r);padding:8px 12px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.1);}
.search-input::placeholder{color:var(--fg-muted);}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--bg3);color:var(--fg-muted);font-weight:700;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--fg);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg2);}
.td-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid;}
.badge-pre{background:var(--primary-lt);border-color:rgba(26,115,232,.25);color:var(--primary);}
.badge-form{background:var(--green-lt);border-color:rgba(22,163,74,.25);color:var(--green);}
.badge-manual{background:var(--orange-lt);border-color:rgba(217,119,6,.25);color:var(--orange);}
.badge-active{background:var(--green-lt);border-color:rgba(22,163,74,.25);color:var(--green);}
.badge-absent{background:var(--red-lt);border-color:rgba(220,38,38,.25);color:var(--red);}
.badge-done{background:var(--bg3);border-color:var(--border2);color:var(--fg-muted);}
.drag-handle{cursor:grab;color:var(--border2);padding:0 4px;}
.drag-handle:active{cursor:grabbing;}
tr.dragging{opacity:.4;}
tr.drag-over td{background:var(--primary-lt);outline:2px solid rgba(26,115,232,.3);}
.action-btns{display:flex;gap:4px;}
.act-btn{padding:4px 8px;border-radius:4px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .12s;}

/* Phase bar */
.phase-bar{display:flex;gap:0;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px;width:fit-content;}
.phase-step{padding:7px 16px;font-size:13px;font-weight:600;color:var(--fg-muted);border-right:1px solid var(--border);cursor:pointer;transition:all .15s;}
.phase-step:last-child{border-right:none;}
.phase-step.active{background:var(--primary-lt);color:var(--primary);}

/* Progress mode */
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:700px){.live-grid{grid-template-columns:1fr;}}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.sc-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg3);}
.sc-title{font-size:12.5px;font-weight:700;color:var(--fg-muted);}
.sc-body{padding:14px;}
.perf-name{font-size:20px;font-weight:800;color:var(--fg);margin-bottom:4px;}
.perf-song{font-size:13px;color:var(--fg-muted);}
.score-mini{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:12px;}
.score-mini .sh{color:var(--fg-muted);font-weight:600;}
.score-mini .sv{font-weight:700;color:var(--fg);text-align:right;}
.score-mini .st{font-weight:800;color:var(--primary);text-align:right;}
.queue-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:background .12s;}
.queue-row:hover{background:var(--bg3);}
.queue-num{width:24px;height:24px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary);flex-shrink:0;}
.queue-name{font-size:13px;font-weight:600;color:var(--fg);flex:1;}
.queue-song{font-size:11px;color:var(--fg-muted);}
.vote-stat{display:flex;align-items:center;gap:16px;}
.vote-num{font-size:28px;font-weight:800;color:var(--primary);}
.vote-label{font-size:12px;color:var(--fg-muted);}
.star-mini{color:var(--orange);}

/* Judge cards */
.judge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.judge-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);}
.judge-name{font-size:15px;font-weight:700;color:var(--fg);}
.judge-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted);}
.status-dot{width:8px;height:8px;border-radius:50%;}
.dot-green{background:var(--green);}
.dot-gray{background:var(--border2);}
.judge-url{font-size:11px;color:var(--fg-muted);word-break:break-all;background:var(--bg3);border-radius:4px;padding:6px 8px;font-family:monospace;border:1px solid var(--border);}

/* Results */
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.results-grid{grid-template-columns:1fr;}}
.rank-table td:nth-child(1){font-size:16px;font-weight:800;color:var(--primary);}
.score-bar{height:4px;background:var(--bg3);border-radius:4px;margin-top:4px;}
.score-fill{height:4px;background:var(--primary);border-radius:4px;transition:width .5s ease;}
.award-assign{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.award-type-label{font-size:12px;font-weight:700;color:var(--fg-muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.award-select{width:100%;background:#fff;border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:13px;border-radius:var(--r);padding:8px 10px;outline:none;}
.award-select:focus{border-color:var(--primary);}
.award-note-input{width:100%;margin-top:6px;background:#fff;border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:13px;border-radius:var(--r);padding:7px 10px;outline:none;}
.award-note-input:focus{border-color:var(--primary);}
.reveal-status{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid;}
.rs-hidden{background:var(--bg3);border-color:var(--border2);color:var(--fg-muted);}
.rs-revealed{background:var(--green-lt);border-color:rgba(22,163,74,.3);color:var(--green);}

/* Notices */
.notice-compose{display:flex;gap:8px;margin-bottom:14px;}
.notice-textarea{flex:1;background:#fff;border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:13px;border-radius:var(--r);padding:10px 12px;resize:none;outline:none;min-height:60px;transition:border-color .15s;}
.notice-textarea:focus{border-color:var(--primary);}
.notice-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);}
.notice-text{font-size:13px;color:var(--fg);margin-bottom:6px;}
.notice-meta{font-size:11px;color:var(--fg-muted);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(32,33,36,.5);backdrop-filter:blur(3px);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:400px;box-shadow:var(--sh-md);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--fg);}
.modal-label{font-size:12px;font-weight:700;color:var(--fg-muted);margin-bottom:5px;}
.modal-input{width:100%;background:var(--bg3);border:1.5px solid var(--border2);color:var(--fg);font-family:inherit;font-size:14px;border-radius:var(--r);padding:9px 12px;outline:none;transition:border-color .15s;margin-bottom:10px;}
.modal-input:focus{border-color:var(--primary);background:#fff;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);box-shadow:var(--sh-md);color:var(--fg);padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:600;z-index:999;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spin-sm{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px;color:var(--fg-muted);font-size:13px;}
</style>
</head>
<body>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <div class="login-title">관리자 로그인</div>
    <div class="login-sub">창공제 노래 콘테스트 관리자 패널</div>
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div id="appWrap" style="display:none;flex-direction:column;height:100vh;">

  <div class="top-bar">
    <span class="top-logo">창공제 콘테스트 관리자</span>
    <div class="top-actions" id="topActions">
      <span class="top-chip cyan" id="phaseChip">예선</span>
      <span class="top-chip" id="voteChip" onclick="toggleVote()" style="cursor:pointer">투표 닫힘</span>
      <span class="top-chip" id="regChip" onclick="toggleRegistration()" style="cursor:pointer">신청 열림</span>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('contestants')">참가자관리</button>
    <button class="tab-btn" onclick="switchTab('live')">진행 모드</button>
    <button class="tab-btn" onclick="switchTab('judges')">심사위원</button>
    <button class="tab-btn" onclick="switchTab('results')">결과</button>
    <button class="tab-btn" onclick="switchTab('notices')">공지</button>
  </div>

  <div class="tab-content">

    <!-- Tab 1: Contestants -->
    <div class="tab-pane active" id="tab-contestants">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openXlsxImport()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> xlsx 가져오기</button>
        <button class="btn btn-green" onclick="showAddModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 수동 추가</button>
        <input class="search-input" type="text" id="searchInput" placeholder="이름 또는 곡명 검색…" oninput="filterContestants()">
      </div>
      <div class="phase-bar" id="phaseTabs">
        <div class="phase-step active" onclick="filterPhase('all',this)">전체</div>
        <div class="phase-step" onclick="filterPhase('prelim',this)">예선</div>
        <div class="phase-step" onclick="filterPhase('semi',this)">본선</div>
        <div class="phase-step" onclick="filterPhase('final',this)">결선</div>
      </div>
      <div class="tbl-wrap" id="contestantTable">
        <div class="empty-state"><span class="spin-sm"></span></div>
      </div>
    </div>

    <!-- Tab 2: Live mode -->
    <div class="tab-pane" id="tab-live">
      <div class="phase-bar" style="margin-bottom:16px;">
        <div class="phase-step" id="ps-prelim" onclick="setPhase('prelim')">예선전</div>
        <div class="phase-step" id="ps-semi" onclick="setPhase('semi')">본선</div>
        <div class="phase-step" id="ps-final" onclick="setPhase('final')">결선</div>
        <div class="phase-step" id="ps-awards" onclick="setPhase('awards')">시상식</div>
      </div>
      <div class="live-grid">
        <!-- Current performer -->
        <div class="section-card">
          <div class="sc-header">
            <span class="sc-title">현재 공연</span>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-orange" id="voteToggleBtn" onclick="toggleVote()" style="padding:5px 10px;font-size:12px;">투표 열기</button>
              <button class="btn btn-red" onclick="endPerformance()" style="padding:5px 10px;font-size:12px;" id="endPerfBtn">공연 종료</button>
            </div>
          </div>
          <div class="sc-body" id="currentPerfBody"><div class="empty-state" style="padding:20px">대기 중</div></div>
        </div>
        <!-- Judge scores -->
        <div class="section-card">
          <div class="sc-header"><span class="sc-title">실시간 채점</span><span id="scoreCount" style="font-size:11px;color:var(--fg-muted)"></span></div>
          <div class="sc-body" id="scoresBody"><div class="empty-state" style="padding:20px">공연 시작 후 표시됩니다</div></div>
        </div>
        <!-- Queue -->
        <div class="section-card">
          <div class="sc-header"><span class="sc-title">대기 순서</span><span id="queueCount" style="font-size:11px;color:var(--fg-muted)"></span></div>
          <div class="sc-body" id="queueBody" style="max-height:300px;overflow-y:auto"><div class="empty-state" style="padding:20px">참가자 없음</div></div>
        </div>
        <!-- Vote stats -->
        <div class="section-card">
          <div class="sc-header"><span class="sc-title">관객 투표 현황</span></div>
          <div class="sc-body" id="voteBody"><div class="empty-state" style="padding:20px">투표 시작 전</div></div>
        </div>
      </div>
    </div>

    <!-- Tab 3: Judges -->
    <div class="tab-pane" id="tab-judges">
      <div class="toolbar">
        <button class="btn btn-green" onclick="showJudgeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 심사위원 추가</button>
        <span style="font-size:12px;color:var(--fg-muted);align-self:center">최대 15명까지 추가 가능</span>
      </div>
      <div class="judge-grid" id="judgeGrid"><div class="empty-state"><span class="spin-sm"></span></div></div>
    </div>

    <!-- Tab 4: Results -->
    <div class="tab-pane" id="tab-results">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="loadResults()">결과 새로고침</button>
        <button class="btn btn-green" onclick="autoAssignAwards()">점수별 자동 배정</button>
        <button class="btn btn-orange" onclick="saveAllAwards()">수상자 저장 및 결과 발표 준비</button>
      </div>
      <div class="results-grid">
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--fg-sub);margin-bottom:10px;">종합 순위</div>
          <div class="tbl-wrap" id="rankTable"><div class="empty-state"><span class="spin-sm"></span></div></div>
        </div>
        <div>

};

window.parseXlsx = function(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var wb = XLSX.read(e.target.result, {type:'array'});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if (rows.length < 2) { document.getElementById('xlsxPreview').textContent='데이터가 없습니다.'; return; }
    var headers = rows[0].map(function(h){return (h||'').toString().trim();});
    function col(row, keyword) {
      var idx = headers.findIndex(function(h){return h.includes(keyword);});
      return idx>=0?(row[idx]||'').toString().trim():'';
    }
    pendingXlsx = rows.slice(1).filter(function(r){return r.length>2 && (r[2]||r[1]||'').toString().trim();}).map(function(row) {
      var songRaw = col(row,'참가곡');
      var parts = songRaw.split(' - ');
      var title = parts[0]?parts[0].trim():'';
      var artist = parts.length>1?parts[parts.length-1].trim():'';
      var members = [];
      for (var i=1;i<=2;i++) {
        var mn = col(row,'팀 참가자 '+i+' 성함');
        if (mn) members.push({name:mn,affiliation:col(row,'팀 참가자 '+i+' 계열'),phone:col(row,'팀 참가자 '+i+' 연락처')});
      }
      return {
        name:col(row,'성함')||col(row,'이름'),
        affiliation:col(row,'계열')||col(row,'소속'),
        phone:col(row,'연락처')||col(row,'전화'),
        category:(col(row,'부문')||'').includes('팀')?'팀':'개인',
        song_title:title, song_artist:artist,
        team_members:members, source:'xlsx', is_pre_registered:true, status:'active'
      };
    }).filter(function(r){return r.name;});
    var prev = document.getElementById('xlsxPreview');
    if (!pendingXlsx.length) { prev.textContent='인식된 행이 없습니다.'; return; }
    prev.innerHTML = '<b style="color:var(--green)">'+pendingXlsx.length+'명 인식됨:</b><br><br>'
      +pendingXlsx.map(function(r,i){return (i+1)+'. '+esc(r.name)+' — '+esc(r.song_title||'미입력');}).join('<br>');
    document.getElementById('xlsxConfirmBtn').disabled=false;
  };
  reader.readAsArrayBuffer(file);
};

window.confirmXlsxImport = async function() {
  if (!pendingXlsx.length) return;
  var maxSeq = contestants.length ? Math.max.apply(null,contestants.map(function(c){return c.seq||0;})) : 0;
  var rows = pendingXlsx.map(function(r,i){
    r.seq = maxSeq+i+1; return r;
  });
  var {error} = await sb.from('contestants').insert(rows);
  if (error) { toast('오류: '+error.message); return; }
  closeModal('xlsxModal');
  toast(rows.length+'명 가져오기 완료');

      .select('*, judge:judge_id(name)')

function renderScores(scores) {
  var body = document.getElementById('scoresBody');
  var cnt = document.getElementById('scoreCount');
  if (cnt) cnt.textContent = scores.length + '/' + judges.length + ' 제출';
  if (!scores.length) { body.innerHTML = '<div style="color:var(--fg-muted);font-size:13px">채점 대기 중</div>'; return; }
  var avg = scores.length ? Math.round(scores.reduce(function(s,x){return s+x.total;},0)/scores.length) : 0;
  var html = '<div class="score-mini">'
    +'<span class="sh">심사위원</span><span class="sh" style="text-align:right">채점</span><span class="sh" style="text-align:right">점수</span>';
  scores.forEach(function(s){
    var jn = s.judge ? s.judge.name : '—';
    html += '<span>'+esc(jn)+'</span>'
      +'<span class="sv" style="font-size:11px;color:var(--fg-muted)">'+s.vocal+'/'+s.showmanship+'/'+s.audience_response+'</span>'
      +'<span class="st">'+s.total+'</span>';
  });
  html += '</div>';
  if (scores.length > 1) html += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--fg-muted)">전문가 평균</span><span style="font-size:20px;font-weight:800;color:var(--primary)">'+avg+'점</span></div>';
  body.innerHTML = html;
}

async function renderVoteStat() {
  if (!state || !state.current_contestant_id) return;
  var {data:votes} = await sb.from('votes').select('stars').eq('contestant_id',state.current_contestant_id).eq('phase',state.phase||'prelim');
  var body = document.getElementById('voteBody');
  if (!votes||!votes.length) { body.innerHTML = '<div style="color:var(--fg-muted);font-size:13px">투표 없음</div>'; return; }
  var avg = votes.reduce(function(s,v){return s+v.stars;},0)/votes.length;
  body.innerHTML = '<div class="vote-stat">'
    +'<div><div class="vote-num">'+votes.length+'</div><div class="vote-label">명 투표</div></div>'
    +'<div><div class="vote-num star-mini">'+avg.toFixed(1)+'</div><div class="vote-label">평균 별점</div></div>'
    +'<div><div class="vote-num" style="font-size:18px;color:var(--green)">'+(avg*8).toFixed(1)+'</div><div class="vote-label">관객 환산점수</div></div>'
    +'</div>';
}

function renderQueue() {
  var active = contestants.filter(function(c){return c.status==='active' && c.id !== (state&&state.current_contestant_id);});
  var cnt = document.getElementById('queueCount');
  if (cnt) cnt.textContent = active.length + '명 대기';
  var body = document.getElementById('queueBody');
  if (!active.length) { body.innerHTML = '<div style="color:var(--fg-muted);font-size:13px;padding:12px">대기 중인 참가자 없음</div>'; return; }
  body.innerHTML = active.slice(0,15).map(function(c,i){
    return '<div class="queue-row" onclick="startPerf(\''+c.id+'\')">'
      +'<div class="queue-num">'+(i+1)+'</div>'
      +'<div><div class="queue-name">'+esc(c.name)+'</div><div class="queue-song">'+esc(c.song_title||'')+'</div></div>'
      +'</div>';
  }).join('');
}

window.endPerformance = async function() {
  if (!state||!state.current_contestant_id) return;
  await sb.from('contestants').update({status:'done',phase:state.phase||'prelim'}).eq('id',state.current_contestant_id);
  await sb.from('state').update({current_contestant_id:null,voting_open:false,updated_at:new Date().toISOString()}).eq('id',1);
  toast('공연 종료');
};

// ─── Judges Tab ─────────────────────────────────────
function renderJudgesTab() {
  var grid = document.getElementById('judgeGrid');
  if (!judges.length) { grid.innerHTML = '<div class="empty-state">심사위원이 없습니다.<br>「심사위원 추가」를 클릭하세요.</div>'; return; }
  grid.innerHTML = judges.map(function(j){
    var url = BASE_URL + 'changong-judge.html?t=' + j.token;
    var connected = !!j.device_fp;
    return '<div class="judge-card">'
      +'<div class="judge-name">'+esc(j.name)+'</div>'
      +'<div class="judge-status"><span class="status-dot '+(connected?'dot-green':'dot-gray')+'"></span><span style="font-size:12px;color:var(--fg-muted)">'+(connected?'기기 연결됨':'연결 대기')+'</span></div>'
      +'<div class="judge-url">'+esc(url)+'</div>'
      +'<div style="display:flex;gap:6px;">'
      +'<button class="btn btn-primary" style="flex:1;justify-content:center;font-size:12px" onclick="copyUrl(\''+encodeURIComponent(url)+'\')">URL 복사</button>'
      +'<button class="btn btn-red" style="font-size:12px" onclick="delJudge(\''+j.id+'\')">삭제</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

window.copyUrl = function(encoded) {
  navigator.clipboard.writeText(decodeURIComponent(encoded)).then(function(){toast('URL 복사됨');}).catch(function(){});
};
window.showJudgeModal = function() {
  if (judges.length >= 15) { toast('최대 15명까지 추가 가능합니다'); return; }
  document.getElementById('judgeModal').style.display='flex';
  document.getElementById('j-name').value='';
};
window.confirmAddJudge = async function() {
  var name = document.getElementById('j-name').value.trim();
  if (!name) return;
  var arr = new Uint8Array(12); crypto.getRandomValues(arr);
  var token = Array.from(arr).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  await sb.from('judges').insert({name:name,token:token});
  closeModal('judgeModal');
  toast('심사위원 추가: '+name);
};
window.delJudge = async function(id) {
  if (!confirm('심사위원을 삭제하시겠습니까?')) return;
  await sb.from('judges').update({active:false}).eq('id',id);
  await loadJudges(); renderJudgesTab();
};

// ─── Results Tab ────────────────────────────────────
var awardAssignments = {};

window.loadResults = async function() {
  var {data:scores} = await sb.from('scores').select('contestant_id,total,phase').eq('phase',state?state.phase:'prelim');
  var {data:votes} = await sb.from('votes').select('contestant_id,stars,phase').eq('phase',state?state.phase:'prelim');
  var {data:awards} = await sb.from('awards').select('*');

  // Aggregate
  var scoreMap = {};
  (scores||[]).forEach(function(s){
    if (!scoreMap[s.contestant_id]) scoreMap[s.contestant_id] = [];
    scoreMap[s.contestant_id].push(s.total);
  });
  var voteMap = {};
  (votes||[]).forEach(function(v){
    if (!voteMap[v.contestant_id]) voteMap[v.contestant_id] = [];
    voteMap[v.contestant_id].push(v.stars);
  });

  results = contestants.map(function(c){
    var sc = scoreMap[c.id] || [];
    var vc = voteMap[c.id] || [];
    var judgeAvg = sc.length ? sc.reduce(function(a,b){return a+b;},0)/sc.length : 0;
    var voteAvg = vc.length ? vc.reduce(function(a,b){return a+b;},0)/vc.length : 0;
    var final = judgeAvg*0.6 + voteAvg*8;
    return {id:c.id,name:c.name,song:c.song_title,judgeAvg:judgeAvg,voteAvg:voteAvg,voteCount:vc.length,final:final};
  }).sort(function(a,b){return b.final-a.final;});

  awardAssignments = {};
  (awards||[]).forEach(function(a){ awardAssignments[a.award_type] = {contestant_id:a.contestant_id,note:a.note,revealed:a.revealed,id:a.id}; });

  renderRankTable();
  renderAwardAssign();
};

function renderRankTable() {
  var tbl = document.getElementById('rankTable');
  if (!results.length) { tbl.innerHTML = '<div class="empty-state">채점 데이터 없음</div>'; return; }
  var html = '<table class="rank-table"><thead><tr><th>#</th><th>이름</th><th>참가곡</th><th>전문가</th><th>관객</th><th>최종</th></tr></thead><tbody>';
  var maxFinal = results.length ? results[0].final : 1;
  results.forEach(function(r,i){
    html += '<tr><td>'+(i+1)+'</td><td style="font-weight:700">'+esc(r.name)+'</td><td>'+esc(r.song||'—')+'</td>'
      +'<td>'+r.judgeAvg.toFixed(1)+'</td>'
      +'<td>'+r.voteAvg.toFixed(1)+' <span style="font-size:11px;color:var(--fg-muted)">('+r.voteCount+'명)</span></td>'
      +'<td><div style="font-weight:800;color:var(--primary)">'+r.final.toFixed(1)+'</div>'
      +'<div class="score-bar"><div class="score-fill" style="width:'+(r.final/maxFinal*100).toFixed(0)+'%"></div></div>'
      +'</td></tr>';
  });
  html += '</tbody></table>';
  tbl.innerHTML = html;
}

function renderAwardAssign() {
  var AWARD_TYPES = [
    {type:'merit',label:'우수상',auto:true,rank:2},
    {type:'excellence',label:'최우수상',auto:true,rank:1},
    {type:'grand',label:'대상',auto:true,rank:0},
    {type:'popularity',label:'인기상',auto:'votes'},
    {type:'judge_special',label:'심사위원 특별상',auto:false},
    {type:'mc_special',label:'MC 특별상',auto:false}
  ];
  var html = '';
  AWARD_TYPES.forEach(function(at){
    var cur = awardAssignments[at.type] || {};
    var revClass = cur.revealed ? 'rs-revealed' : 'rs-hidden';
    var revLabel = cur.revealed ? '발표됨' : '미발표';
    html += '<div class="award-assign">'
      +'<div class="award-type-label"><span>'+at.label+'</span><span class="reveal-status '+revClass+'">'+revLabel+'</span></div>'
      +'<select class="award-select" id="as-'+at.type+'" onchange="awardPick(\''+at.type+'\',this.value)">'
      +'<option value="">— 미지정 —</option>'
      +contestants.map(function(c){return '<option value="'+c.id+'"'+(cur.contestant_id===c.id?' selected':'')+'>'+esc(c.name)+' ('+esc(c.song_title||'')+')</option>';}).join('')
      +'</select>'
      +'<input class="award-note-input" id="an-'+at.type+'" placeholder="비고 (선택사항)" value="'+esc(cur.note||'')+'">'
      +'</div>';
  });
  document.getElementById('awardAssignArea').innerHTML = html;
}

window.awardPick = function(type, cid) {
  if (!awardAssignments[type]) awardAssignments[type] = {};
  awardAssignments[type].contestant_id = cid || null;
};

window.autoAssignAwards = function() {
  if (!results.length) { toast('먼저 결과를 새로고침하세요'); return; }
  // Top 3 → 대상/최우우상/우수상
  var RANK = ['grand','excellence','merit'];
  results.slice(0,3).forEach(function(r,i){
    if (RANK[i]) {
      if (!awardAssignments[RANK[i]]) awardAssignments[RANK[i]] = {};
      awardAssignments[RANK[i]].contestant_id = r.id;
      var sel = document.getElementById('as-'+RANK[i]);
      if (sel) sel.value = r.id;
    }
  });
  // Popularity → highest voteCount
  var byVotes = results.slice().sort(function(a,b){return b.voteCount-a.voteCount;});
  if (byVotes.length) {
    if (!awardAssignments['popularity']) awardAssignments['popularity'] = {};
    awardAssignments['popularity'].contestant_id = byVotes[0].id;
    var ps = document.getElementById('as-popularity');
    if (ps) ps.value = byVotes[0].id;
  }
  toast('자동 배정 완료 — 저장하려면 「수상자 저장」 클릭');
};

window.saveAllAwards = async function() {
  var TYPES = ['merit','excellence','grand','popularity','judge_special','mc_special'];
  var order = {merit:1,excellence:2,grand:3,popularity:4,judge_special:5,mc_special:6};
  for (var i=0;i<TYPES.length;i++) {
    var t = TYPES[i];
    var cid = awardAssignments[t] ? awardAssignments[t].contestant_id : null;
    if (!cid) continue;
    var note = (document.getElementById('an-'+t)||{value:''}).value.trim();
    var {data:ex} = await sb.from('awards').select('id').eq('award_type',t).maybeSingle();
    if (ex) {
      await sb.from('awards').update({contestant_id:cid,note:note||null,reveal_order:order[t]}).eq('award_type',t);
    } else {
      await sb.from('awards').insert({award_type:t,contestant_id:cid,note:note||null,reveal_order:order[t],revealed:false});
    }
  }
  toast('수상자 저장 완료');
  await loadResults();
};

// ─── Notices Tab ────────────────────────────────────
async function loadNotices() {
  var {data} = await sb.from('notices').select('*').order('created_at',{ascending:false}).limit(30);
  var list = document.getElementById('noticeList');
  if (!data||!data.length) { list.innerHTML = '<div class="empty-state">공지 내역 없음</div>'; return; }
  list.innerHTML = data.map(function(n){
    return '<div class="notice-item">'
      +'<div class="notice-text">'+esc(n.content)+'</div>'
      +'<div class="notice-meta">'+new Date(n.created_at).toLocaleString('ko-KR')+'</div>'
      +'</div>';
  }).join('');
}

window.sendNotice = async function() {
  var txt = document.getElementById('noticeText').value.trim();
  if (!txt) return;
  await sb.from('notices').insert({content:txt});
  document.getElementById('noticeText').value = '';
  toast('공지 저장');
  await loadNotices();
};

// ─── Utilities ─────────────────────────────────────
window.closeModal = function(id) { document.getElementById(id).style.display='none'; };

function toast(msg) {
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},3000);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

})();
</script>
</body>
</html>
