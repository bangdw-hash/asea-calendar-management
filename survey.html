<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ASEA 설문지 자동 생성">
  <title>ASEA 설문지 자동 생성</title>
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=20260623r47">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ── 디자인 시스템 (schedule.html 동기화) ── */
    :root {
      --color-bg:        #F8F9FB;
      --color-card:      #FFFFFF;
      --color-accent:    #1A73E8;
      --color-accent-dk: #1557B0;
      --color-accent-lt: #E8F0FE;
      --color-text:      #202124;
      --color-text-sec:  #5F6368;
      --color-border:    #E8EAED;
      --color-error:     #EA4335;
      --r:               10px;
      --r-card:          14px;
      --sh:    0 1px 3px rgba(60,64,67,.08), 0 1px 2px rgba(60,64,67,.06);
      --sh-md: 0 2px 8px rgba(60,64,67,.12), 0 2px 4px rgba(60,64,67,.08);
    }
    [data-color-theme="aurora"] {
      --color-accent:    #8B5CF6;
      --color-accent-dk: #7C3AED;
      --color-accent-lt: #EDE9FE;
      --color-bg:        #F5F3FF;
      --color-border:    #C4B5FD;
    }
    [data-color-theme="sky"] {
      --color-accent:    #0EA5E9;
      --color-accent-dk: #0284C7;
      --color-accent-lt: #E0F2FE;
      --color-bg:        #F0F9FF;
      --color-border:    #BAE6FD;
    }
    [data-color-theme="mint"] {
      --color-accent:    #10B981;
      --color-accent-dk: #059669;
      --color-accent-lt: #D1FAE5;
      --color-bg:        #ECFDF5;
      --color-border:    #A7F3D0;
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      margin: 0; padding: 0;
      min-height: 100vh;
      color: var(--color-text);
    }

    /* ── 상단 헤더 ── */
    .sv-header {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--sh);
    }
    .sv-header-icon {
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .sv-header-logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--color-text);
      white-space: nowrap;
    }
    .sv-header-sub {
      font-size: 12px;
      color: var(--color-text-sec);
      margin-left: 2px;
      font-weight: 400;
    }

    /* 테마 피커 */
    .sv-theme-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 6px;
    }
    .sv-swatch {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
      outline: none;
    }
    .sv-swatch:hover { transform: scale(1.15); }
    .sv-swatch.active {
      box-shadow: 0 0 0 2px var(--color-card), 0 0 0 3.5px var(--color-text);
    }

    /* 사용자 영역 */
    .sv-header-user {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-sec);
    }
    .sv-header-user img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }
    .sv-user-name {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sv-logout-btn {
      background: none;
      border: 1px solid var(--color-border);
      border-radius: var(--r);
      color: var(--color-text-sec);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .sv-logout-btn:hover { background: var(--color-bg); }

    /* ── 본문 ── */
    .sv-main {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px 80px;
    }

    /* ── 로딩 오버레이 ── */
    #sv-loading {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 15px;
      color: var(--color-text-sec);
      z-index: 999;
    }
    .sv-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: sv-spin .8s linear infinite;
    }
    @keyframes sv-spin { to { transform: rotate(360deg); } }
    #sv-loading.hidden { display: none; }

    /* ── section-title (survey.js 생성) ── */
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
    }
    .section-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--color-accent);
    }

    /* collapse 보완 */
    .sv-collapse .sv-sec-body { overflow: hidden; }
    .sv-collapse.collapsed .sv-sec-body { display: none; }
    .sv-collapse.collapsed .sv-chev { transform: rotate(-90deg); }
    .sv-chev { transition: transform .2s; color: var(--color-text-sec); }
  </style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="sv-loading">
  <div class="sv-spinner"></div>
  <span id="sv-loading-msg">초기화 중...</span>
</div>

<!-- 헤더 -->
<div class="sv-header">
  <svg class="sv-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px" aria-hidden="true">
    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
    <rect x="9" y="3" width="6" height="4" rx="2"/>
    <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
  </svg>
  <span class="sv-header-logo">ASEA <span class="sv-header-sub">설문지 자동 생성</span></span>

  <!-- 테마 피커 -->
  <div class="sv-theme-wrap" title="테마 선택">
    <button class="sv-swatch" data-t="aurora" onclick="svSetTheme('aurora')"
            style="background:linear-gradient(135deg,#8B5CF6,#EC4899)" title="오로라"></button>
    <button class="sv-swatch" data-t="sky"    onclick="svSetTheme('sky')"
            style="background:linear-gradient(135deg,#0EA5E9,#38BDF8)" title="하늘색"></button>
    <button class="sv-swatch" data-t="mint"   onclick="svSetTheme('mint')"
            style="background:linear-gradient(135deg,#059669,#34D399)" title="민트"></button>
  </div>

  <!-- 사용자 영역 -->
  <div class="sv-header-user" id="sv-user-area" style="display:none">
    <img id="sv-user-avatar" src="" alt="">
    <span class="sv-user-name" id="sv-user-name"></span>
    <button class="sv-logout-btn" onclick="svLogout()">로그아웃</button>
  </div>
</div>

<!-- 본문 -->
<div class="sv-main">
  <div id="survey-root"></div>
</div>

<!-- 의존 스크립트 -->
<script src="cloudforms.js?v=20260617cf1" defer></script>
<script src="config.js?v=20260623ai7" defer></script>
<script src="survey-auth.js?v=20260819sv1" defer></script>
<script src="survey.js?v=20260908sv1" defer></script>

<script>
(function () {
  'use strict';

  /* ── 테마 ── */
  window.svSetTheme = function (t) {
    document.documentElement.setAttribute('data-color-theme', t);
    try { localStorage.setItem('asea_color_theme', t); } catch (_) {}
    document.querySelectorAll('.sv-swatch').forEach(function (el) {
      el.classList.toggle('active', el.dataset.t === t);
    });
  };
  function initTheme() {
    var t = 'sky';
    try { t = localStorage.getItem('asea_color_theme') || 'sky'; } catch (_) {}
    svSetTheme(t);
  }
  initTheme();

  var ADMIN_EMAIL = 'bangdw@gmail.com';

  function setLoading(msg) {
    var el = document.getElementById('sv-loading');
    var msgEl = document.getElementById('sv-loading-msg');
    if (msg === false) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    if (msg && msgEl) msgEl.textContent = msg;
  }

  function showUserArea(profile) {
    var area = document.getElementById('sv-user-area');
    var avatarEl = document.getElementById('sv-user-avatar');
    var nameEl = document.getElementById('sv-user-name');
    if (!area) return;
    area.style.display = 'flex';
    if (profile) {
      if (avatarEl && profile.picture) avatarEl.src = profile.picture;
      if (nameEl) nameEl.textContent = profile.name || profile.email || '';
    }
  }

  window.svLogout = function () {
    if (window.Auth && Auth.logout) Auth.logout();
    document.getElementById('sv-user-area').style.display = 'none';
    if (window.SurveyModule) SurveyModule.renderTab();
  };

  function fetchProfile(token) {
    return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + token }
    }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function loadAdminAI() {
    if (window.loadAIProvidersFromCloud) {
      return window.loadAIProvidersFromCloud().catch(function () {});
    }
    return Promise.resolve();
  }

  function storeUserEmail(email) {
    try { localStorage.setItem('asea_user_email', email); } catch (e) {}
  }

  function init() {
    var MAX_WAIT = 6000;
    var start = Date.now();

    function waitForDeps() {
      var ready = window.Config !== undefined ||
                  (window.CONFIG !== undefined) ||
                  (window.getAIProviders !== undefined);
      var authReady = window.Auth !== undefined;
      var surveyReady = window.SurveyModule !== undefined;

      if (!ready || !authReady || !surveyReady) {
        if (Date.now() - start > MAX_WAIT) {
          setLoading('스크립트 로드 실패. 새로고침 해주세요.');
          return;
        }
        setTimeout(waitForDeps, 80);
        return;
      }
      doInit();
    }

    function doInit() {
      setLoading('AI 설정 로드 중...');

      loadAdminAI().then(function () {
        setLoading('로그인 상태 확인 중...');

        if (Auth.onAuthChange) {
          Auth.onAuthChange(function (loggedIn) {
            if (!loggedIn) {
              document.getElementById('sv-user-area').style.display = 'none';
              SurveyModule.renderTab();
              return;
            }
            var t = Auth.getToken();
            fetchProfile(t).then(function (profile) {
              if (profile) {
                showUserArea(profile);
                storeUserEmail(profile.email || '');
              }
              SurveyModule.renderTab();
            });
          });
        }

        if (Auth.onFormsAuthChange) {
          Auth.onFormsAuthChange(function () { SurveyModule.renderTab(); });
        }

        if (Auth.tryRestoreFormsSession) Auth.tryRestoreFormsSession();
        var restored = Auth.tryRestoreSession && Auth.tryRestoreSession();
        if (restored) {
          var token = Auth.getToken && Auth.getToken();
          if (token) {
            fetchProfile(token).then(function (profile) {
              if (profile) {
                showUserArea(profile);
                storeUserEmail(profile.email || '');
              }
              setLoading(false);
              SurveyModule.renderTab();
            });
            return;
          }
        }

        setLoading(false);
        SurveyModule.renderTab();
      });
    }

    waitForDeps();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  } else {
    setTimeout(init, 0);
  }
})();
</script>
</body>
</html>
