<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>창공제 관객 투표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
:root {
  --primary:#0ea5e9; --primary-dk:#0284c7; --primary-lt:#e0f2fe;
  --bg:#f0f9ff; --card:#ffffff; --fg:#0a2540; --fg-sub:#1e4a72;
  --fg-muted:#6a96b8; --border:#b8d8ef;
  --green:#059669; --green-lt:#d1fae5;
  --gold:#f59e0b; --gold-lt:#fef9ec;
  --r:6px;
  --sh:0 2px 8px rgba(14,165,233,.12);
  --sh-md:0 6px 24px rgba(14,165,233,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:0 16px 40px;
  background-image:radial-gradient(ellipse 120% 50% at 50% -5%,rgba(14,165,233,.15) 0%,transparent 70%);
}
.page-header{
  width:100%;max-width:480px;
  background:linear-gradient(135deg,#0369a1,#0ea5e9,#38bdf8);
  margin:0 -16px;width:calc(100% + 32px);
  padding:32px 24px 28px;
  text-align:center;color:#fff;
  position:relative;overflow:hidden;
}
.page-header::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1.5' fill='rgba(255,255,255,.08)'/%3E%3C/svg%3E");
}
.header-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:8px;}
.header-title{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;}
.header-sub{font-size:13px;opacity:.8;}
.wrap{width:100%;max-width:400px;margin-top:24px;display:flex;flex-direction:column;gap:16px;}

/* State card */
.state-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px;text-align:center;
}
.state-icon{font-size:40px;margin-bottom:12px;}
.state-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.state-sub{font-size:13px;color:var(--fg-muted);}

/* Performer card */
.performer-card{
  background:linear-gradient(135deg,#0369a1 0%,#0ea5e9 100%);
  color:#fff;border-radius:var(--r);
  box-shadow:var(--sh-md);padding:24px;text-align:center;
  position:relative;overflow:hidden;
}
.performer-card::before{
  content:'';position:absolute;inset:0;opacity:.06;
  background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,1) 10px,rgba(255,255,255,1) 11px);
}
.performer-label{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.7;margin-bottom:12px;text-transform:uppercase;}
.performer-name{font-size:28px;font-weight:800;margin-bottom:8px;position:relative;}
.performer-song{font-size:14px;opacity:.85;position:relative;}
.performer-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.2);border-radius:100px;
  padding:3px 10px;font-size:11px;font-weight:600;margin-bottom:12px;
}

/* Timer */
.timer-wrap{text-align:center;}
.timer-ring-svg{transform:rotate(-90deg);}
.timer-circle-bg{fill:none;stroke:var(--border);stroke-width:6;}
.timer-circle{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.timer-text{font-size:24px;font-weight:800;fill:var(--fg);}
.timer-sub{font-size:11px;fill:var(--fg-muted);}

/* Star rating */
.star-section{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:24px;text-align:center;}
.star-label{font-size:14px;font-weight:600;color:var(--fg-sub);margin-bottom:16px;}
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.star{
  width:52px;height:52px;cursor:pointer;
  transition:transform .15s,filter .15s;
  color:var(--border);
}
.star:hover,.star.active{color:var(--gold);filter:drop-shadow(0 0 6px rgba(245,158,11,.5));}
.star:hover{transform:scale(1.18);}
.star.active{transform:scale(1.12);}
.star svg{width:100%;height:100%;}
.vote-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#0284c7,#0ea5e9,#38bdf8);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  border:none;border-radius:var(--r);cursor:pointer;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
  transition:filter .15s,transform .1s;
}
.vote-btn:hover{filter:brightness(1.07);}
.vote-btn:active{transform:scale(.98);}
.vote-btn:disabled{background:var(--border);color:var(--fg-muted);cursor:not-allowed;box-shadow:none;transform:none;filter:none;}

/* Done card */
.done-card{background:var(--green-lt);border:1.5px solid var(--green);border-radius:var(--r);padding:20px;text-align:center;}
.done-icon{width:52px;height:52px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.done-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:4px;}
.done-sub{font-size:13px;color:var(--fg-sub);}

/* Footer */
.footer-note{font-size:11px;color:var(--fg-muted);text-align:center;}

/* Loader */
.loader{display:flex;justify-content:center;padding:40px;}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page-header">
  <p class="header-eyebrow">2026 창공제 노래 콘테스트</p>
  <h1 class="header-title">관객 투표</h1>
  <p class="header-sub">지금 공연 중인 참가자에게 별점을 주세요</p>
</div>

<div class="wrap" id="app">
  <div class="loader"><div class="spin"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
(function(){

var SB_URL = 'https://zbpeyklwpotjyveipzxd.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicGV5a2x3cG90anl2ZWlwenhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTYxMDcsImV4cCI6MjA5NzA5MjEwN30.6JgoQ6rPRnmrbBTG68A-Y9HDQk40mnwubhXVnkZvHrQ';
var sb = supabase.createClient(SB_URL, SB_KEY, {db:{schema:'cgf'}});

var app = document.getElementById('app');
var state = null;
var contestant = null;
var voterId = getVoterId();
var selectedStar = 0;
var timerInterval = null;
var hasVoted = false;

function getVoterId() {
  var id = localStorage.getItem('cgf_voter_id');
  if (!id) { id = Math.random().toString(36).slice(2,18); localStorage.setItem('cgf_voter_id', id); }
  return id;
}

async function init() {
  var {data} = await sb.from('state').select('*').eq('id',1).single();
  state = data;
  if (state && state.current_contestant_id) {
    var {data:c} = await sb.from('contestants').select('id,name,song_title,song_artist,category').eq('id',state.current_contestant_id).single();
    contestant = c;
  }
  if (state && state.current_contestant_id) {
    var {data:v} = await sb.from('votes').select('id').eq('contestant_id',state.current_contestant_id).eq('cookie_id',voterId).eq('phase',state.phase||'prelim').maybeSingle();
    hasVoted = !!v;
  }
  render();
  subscribeRealtime();
}

function subscribeRealtime() {
  sb.channel('cgf-vote-state')
    .on('postgres_changes',{event:'*',schema:'cgf',table:'state'},async function(payload){
      var prev = state ? state.current_contestant_id : null;
      state = payload.new;
      if (state.current_contestant_id !== prev) {
        if (state.current_contestant_id) {
          var {data:c} = await sb.from('contestants').select('id,name,song_title,song_artist,category').eq('id',state.current_contestant_id).single();
          contestant = c;
        } else { contestant = null; }
        hasVoted = false;
        selectedStar = 0;
        // Check if already voted for new performer
        if (state.current_contestant_id) {
          var {data:v} = await sb.from('votes').select('id').eq('contestant_id',state.current_contestant_id).eq('cookie_id',voterId).eq('phase',state.phase||'prelim').maybeSingle();
          hasVoted = !!v;
        }
      }
      render();
    })
    .subscribe();
}

function render() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  if (!state) { app.innerHTML = '<div class="state-card"><div class="state-title">연결 중…</div></div>'; return; }
  if (!state.current_contestant_id || !contestant) {
    app.innerHTML = '<div class="state-card">'
      +'<div class="state-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6a96b8" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>'
      +'<div class="state-title">공연 대기 중</div>'
      +'<div class="state-sub">다음 참가자 공연 시작 시 투표가 열립니다</div>'
      +'</div>';
    return;
  }

  var html = '';
  // Performer card
  html += '<div class="performer-card">'
    +'<div class="performer-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13M9 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-2c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/></svg> 공연 중</div>'
    +'<div class="performer-name">'+esc(contestant.name)+'</div>'
    +'<div class="performer-song">🎵 '+esc(contestant.song_title||'')+(contestant.song_artist?' — '+esc(contestant.song_artist):'')+'</div>'
    +'</div>';

  if (!state.voting_open) {
    html += '<div class="state-card">'
      +'<div class="state-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6a96b8" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>'
      +'<div class="state-title">투표 준비 중</div>'
      +'<div class="state-sub">사회자 안내 후 투표가 시작됩니다</div>'
      +'</div>';
    app.innerHTML = html;
    return;
  }

  if (hasVoted) {
    html += renderDone();
    app.innerHTML = html;
    return;
  }

  // Timer
  var remaining = 30;
  if (state.voting_opened_at) {
    var elapsed = (Date.now() - new Date(state.voting_opened_at).getTime()) / 1000;
    remaining = Math.max(0, Math.round(30 - elapsed));
  }

  html += '<div class="timer-wrap" id="timer-wrap">'
    +buildTimerSvg(remaining)
    +'</div>';

  html += '<div class="star-section">'
    +'<div class="star-label">별점을 선택해 주세요</div>'
    +'<div class="stars" id="stars">'
    +[1,2,3,4,5].map(function(i){ return '<div class="star" data-star="'+i+'" onclick="pickStar('+i+')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>'; }).join('')
    +'</div>'
    +'<button class="vote-btn" id="vote-btn" onclick="submitVote()" disabled>별점 선택 후 투표하기</button>'
    +'</div>';

  app.innerHTML = html;

  if (remaining <= 0) {
    showExpired();
    return;
  }

  startTimer(remaining);
}

function buildTimerSvg(sec) {
  var r = 36, circ = 2*Math.PI*r;
  var dash = circ * (sec/30);
  return '<svg class="timer-ring-svg" width="96" height="96" viewBox="0 0 96 96">'
    +'<circle class="timer-circle-bg" cx="48" cy="48" r="'+r+'"/>'
    +'<circle class="timer-circle" id="timer-circle" cx="48" cy="48" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ-dash)+'"/>'
    +'<text class="timer-text" x="48" y="50" text-anchor="middle" dominant-baseline="middle" id="timer-num">'+sec+'</text>'
    +'<text class="timer-sub" x="48" y="64" text-anchor="middle">초</text>'
    +'</svg>';
}

function startTimer(initial) {
  var sec = initial;
  var r = 36, circ = 2*Math.PI*r;
  timerInterval = setInterval(function(){
    sec--;
    var numEl = document.getElementById('timer-num');
    var circEl = document.getElementById('timer-circle');
    if (numEl) numEl.textContent = Math.max(0,sec);
    if (circEl) {
      var dash = circ * (Math.max(0,sec)/30);
      circEl.style.strokeDashoffset = circ - dash;
      if (sec <= 5) circEl.style.stroke = '#dc2626';
    }
    if (sec <= 0) { clearInterval(timerInterval); showExpired(); }
  }, 1000);
}

function showExpired() {
  var ss = document.querySelector('.star-section');
  if (ss) ss.innerHTML = '<div class="state-title" style="color:#dc2626">투표 시간이 종료되었습니다</div>'
    +'<div class="state-sub" style="color:#6a96b8;margin-top:6px;">다음 투표 기회를 기다려 주세요</div>';
}

window.pickStar = function(n) {
  selectedStar = n;
  document.querySelectorAll('.star').forEach(function(el,i){ el.classList.toggle('active',i<n); });
  var btn = document.getElementById('vote-btn');
  if (btn) { btn.disabled = false; btn.textContent = '★'.repeat(n)+' 점 투표하기'; }
};

window.submitVote = async function() {
  if (!selectedStar || !state || !contestant) return;
  var btn = document.getElementById('vote-btn');
  if (btn) { btn.disabled = true; btn.textContent = '전송 중…'; }
  var {error} = await sb.from('votes').insert({
    contestant_id: contestant.id,
    phase: state.phase||'prelim',
    stars: selectedStar,
    cookie_id: voterId
  });
  if (error && error.code === '23505') {
    hasVoted = true; render(); return;
  }
  hasVoted = true; render();
};

function renderDone() {
  return '<div class="done-card">'
    +'<div class="done-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'
    +'<div class="done-title">투표 완료!</div>'
    +'<div class="done-sub">'+esc(contestant?contestant.name:'')+'님의 공연에 투표해 주셔서 감사합니다.</div>'
    +'</div>';
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();

})();
</script>
</body>
</html>
