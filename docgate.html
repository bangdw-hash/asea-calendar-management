<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="appear-head.js"></script>
<script src="site-admin.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서류 다운로드</title>
<link rel="stylesheet" href="docgate.css">
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <span class="site-name">아세아항공직업전문학교</span>
    <a id="adminLink" href="docgate-admin.html" style="display:none">서식 관리</a>
  </div>

  <!-- 1. 로그인 -->
  <div id="stepLogin" class="card narrow">
    <div class="login-area">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="6" fill="#E8F0FE"/><path d="M16 12h12l6 6v18H16z" stroke="#1A73E8" stroke-width="2.2" stroke-linejoin="round"/><path d="M28 12v6h6M20 25h10M20 30h10" stroke="#1A73E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>서류 다운로드</h2>
      <p>법인·인사·학교 서식 등 업무 서류를 받을 수 있습니다.<br>Google 계정 로그인 후 이용하며, 다운로드 내역은 자동으로 기록됩니다.</p>
      <div id="loginMsg" class="msg"></div>
      <button class="btn btn-primary" id="loginBtn" type="button">Google로 로그인</button>
    </div>
  </div>

  <!-- 2. 신상 입력(첫 진입 1회) -->
  <div id="stepProfile" class="card narrow" style="display:none">
    <div class="card-header">
      <div>
        <h1>신청자 정보</h1>
        <div class="sub">처음 한 번만 입력하면 이 기기에 기억됩니다</div>
      </div>
    </div>
    <div class="card-body">
      <div id="profileMsg" class="msg"></div>
      <div class="form-group">
        <label for="pfName">신청자명 <span class="req">*</span></label>
        <input type="text" id="pfName" placeholder="실명으로 입력해 주세요" maxlength="30" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="pfDept">부서 <span class="req">*</span></label>
        <select id="pfDept"></select>
        <input type="text" id="pfDeptEtc" placeholder="부서명을 직접 입력해 주세요" maxlength="30" style="display:none;margin-top:8px" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="pfTitle">직함 <span class="req">*</span></label>
        <input type="text" id="pfTitle" placeholder="예: 과장, 팀장, 담당자" maxlength="30" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="pfSave" type="button">확인</button>
    </div>
  </div>

  <!-- 3. 서류 찾기 -->
  <div id="stepMain" style="display:none">
    <div class="who"><span id="whoText"></span><button class="link" id="editProfile" type="button">수정</button></div>
    <div class="search" id="searchBox">
      <span id="searchIc"></span>
      <input type="text" id="q" placeholder="서류 검색 (예: 사직서, 임원명부, ㅅㅈㅅ)" autocomplete="off" aria-label="서류 검색">
      <button class="clear" id="qClear" type="button" style="display:none">지우기</button>
    </div>
    <div id="mainMsg" class="msg" style="margin-top:12px"></div>
    <div id="main"></div>
  </div>

  <!-- 4. 다운로드 -->
  <div id="stepDl" class="card narrow" style="display:none">
    <div class="card-header">
      <div>
        <h1>다운로드</h1>
        <div class="sub">1분 이내에 받아 주세요</div>
      </div>
    </div>
    <div class="card-body">
      <div id="dlMsg" class="msg"></div>
      <div class="timer-wrap">
        <div class="timer-circle" id="timerCircle">60</div>
        <div class="timer-label">초 이내에 다운로드하세요. 만료되면 다시 신청해야 합니다.</div>
        <div class="file-badge" id="fileBadge"></div>
        <button class="btn btn-primary" id="dlBtn" type="button" style="margin-bottom:12px"></button>
        <button class="btn btn-outline" id="backBtn" type="button">다른 서류 선택</button>
      </div>
    </div>
  </div>
</div>

<!-- 하단 선택 바 -->
<div class="actbar" id="actbar">
  <div class="in">
    <div class="sel-name" id="selName"></div>
    <input type="text" id="reason" placeholder="사용 목적 (필수) 예: 입찰서류 제출" maxlength="100" aria-label="사용 목적 (필수)" required>
    <button class="btn btn-primary" id="issueBtn" type="button">다운로드 링크 발급</button>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="docgate.js"></script>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var esc = DocGate.esc, IC = DocGate.ICON;
var G = null;            // Google 프로필
var B = null;            // bootstrap { me, depts, sections, items }
var SAVED = null;        // 저장된 신상 { name, dept, title }
var IDX = null;          // 인덱스
var V = { mode: 'home', sec: '', folder: '' };
var SEL = null;          // 선택한 서류 id
var timerIv = null, ticket = null, dlUsed = false;

/* ── 화면 전환 ─────────────────────────────────────────────────── */
var STEPS = ['stepLogin', 'stepProfile', 'stepMain', 'stepDl'];
function go(step) {
  STEPS.forEach(function (s) { $(s).style.display = s === step ? '' : 'none'; });
  if (step !== 'stepMain') $('actbar').classList.remove('show');
  window.scrollTo(0, 0);
}
function msg(id, text, type) { var el = $(id); el.className = 'msg ' + (type || 'info'); el.textContent = text; }
function clr(id) { var el = $(id); el.className = 'msg'; el.textContent = ''; }

/* ── 인증 ──────────────────────────────────────────────────────── */
$('searchIc').innerHTML = IC.search;
$('loginBtn').textContent = 'Google로 로그인';
Auth.onAuthChange(function (ok) { if (ok) init(); else go('stepLogin'); });
document.addEventListener('DOMContentLoaded', function () { Auth.tryRestoreSession(); });
$('loginBtn').addEventListener('click', async function () {
  var b = $('loginBtn'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
  try { await Auth.login({ chooseAccount: true }); }
  catch (e) { msg('loginMsg', e.message, 'error'); b.disabled = false; b.textContent = 'Google로 로그인'; }
});

async function init() {
  try { G = await DocGate.fetchProfile(); }
  catch (e) { msg('loginMsg', '프로필 조회 실패: ' + e.message, 'error'); go('stepLogin'); return; }
  try { B = await DocGate.api('bootstrap'); }
  catch (e) {
    if (e.code === 'AUTH') { Auth.logout(); msg('loginMsg', e.message, 'error'); }
    else msg('loginMsg', e.message, 'error');
    go('stepLogin'); return;
  }
  buildIndex();
  if (B.me.isSuper || B.me.managed.length) $('adminLink').style.display = '';
  SAVED = DocGate.getSaved(G.email);
  if (SAVED && SAVED.name && SAVED.dept && SAVED.title) enterMain();
  else openProfile();
}

/* ── 신상 입력 ─────────────────────────────────────────────────── */
function openProfile() {
  var depts = DocGate.deptList(B.depts);
  var s = $('pfDept');
  s.innerHTML = '<option value="">선택하세요</option>' + depts.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join('') + '<option value="__etc">직접 입력</option>';
  $('pfName').value = SAVED ? SAVED.name : '';   // 구글 이름은 채우지 않음(실명 입력 유도)
  $('pfTitle').value = SAVED ? SAVED.title : '';
  if (SAVED && SAVED.dept) {
    if (depts.indexOf(SAVED.dept) >= 0) s.value = SAVED.dept;
    else { s.value = '__etc'; $('pfDeptEtc').value = SAVED.dept; }
  }
  $('pfDeptEtc').style.display = s.value === '__etc' ? '' : 'none';
  clr('profileMsg'); go('stepProfile');
  $('pfName').focus();
}
$('pfDept').addEventListener('change', function () {
  var etc = $('pfDept').value === '__etc';
  $('pfDeptEtc').style.display = etc ? '' : 'none';
  if (etc) $('pfDeptEtc').focus();
});
$('pfSave').addEventListener('click', function () {
  var name = $('pfName').value.trim(), title = $('pfTitle').value.trim();
  var dept = $('pfDept').value === '__etc' ? $('pfDeptEtc').value.trim() : $('pfDept').value;
  if (!name) return msg('profileMsg', '신청자명을 입력하세요', 'error');
  if (!dept) return msg('profileMsg', '부서를 선택하세요', 'error');
  if (!title) return msg('profileMsg', '직함을 입력하세요', 'error');
  SAVED = { name: name, dept: dept, title: title };
  DocGate.setSaved(G.email, SAVED);
  enterMain();
});
$('editProfile').addEventListener('click', openProfile);
['pfName', 'pfDeptEtc', 'pfTitle'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pfSave').click(); });
});

/* ── 인덱스 ────────────────────────────────────────────────────── */
function buildIndex() {
  IDX = { byId: {}, kids: {}, secName: {}, count: {} };
  B.sections.forEach(function (s) { IDX.secName[s.id] = s.name; IDX.count[s.id] = 0; });
  B.items.forEach(function (it) {
    IDX.byId[it.id] = it;
    var k = it.sectionId + '|' + it.parentId;
    (IDX.kids[k] = IDX.kids[k] || []).push(it);
    if (it.type === 'doc') IDX.count[it.sectionId]++;
  });
  Object.keys(IDX.kids).forEach(function (k) {
    IDX.kids[k].sort(function (a, b) { return a.order - b.order || a.name.localeCompare(b.name, 'ko'); });
  });
}
function docsIn(secId, folderId) {            // 폴더 하위 서류 수
  var n = 0;
  (IDX.kids[secId + '|' + folderId] || []).forEach(function (it) { n += it.type === 'doc' ? 1 : docsIn(secId, it.id); });
  return n;
}

/* ── 메인 ──────────────────────────────────────────────────────── */
function enterMain() {
  $('whoText').innerHTML = '신청자 <b>' + esc(SAVED.name) + '</b> · ' + esc(SAVED.dept) + ' / ' + esc(SAVED.title);
  V = { mode: 'home', sec: '', folder: '' }; SEL = null;
  $('q').value = ''; $('qClear').style.display = 'none';
  clr('mainMsg'); go('stepMain'); render();
}

function render() {
  var q = $('q').value.trim(), h = '';
  $('qClear').style.display = q ? '' : 'none';
  if (q) { renderSearch(q); } else if (V.mode === 'sec') { renderSection(); } else if (V.mode === 'all') { renderAll(); } else { renderHome(); }
  updateBar();
}

function docRow(it, withSec) {
  var sel = SEL === it.id;
  return '<div class="row' + (sel ? ' sel' : '') + '" data-doc="' + esc(it.id) + '" role="button" tabindex="0">' +
    '<span class="dot"></span><span class="ic">' + IC.file + '</span>' +
    '<span class="nm">' + esc(it.name) + '</span>' +
    (withSec ? '<span class="tag">' + esc(IDX.secName[it.sectionId] || '') + '</span>' : '') +
    (it.updatedAt ? '<span class="meta">' + esc(String(it.updatedAt).slice(0, 10)) + '</span>' : '') + '</div>';
}

function renderHome() {
  if (!B.sections.length) {
    $('main').innerHTML = '<div class="empty">열람할 수 있는 서류가 없습니다.<br>접근 권한이 필요하면 서식 담당자에게 문의하세요.</div>';
    return;
  }
  var tiles = B.sections.map(function (s) {
    return '<button class="tile" type="button" data-sec="' + esc(s.id) + '"><span class="ic">' + IC.folder + '</span>' +
      '<div class="t">' + esc(s.name) + '</div><div class="n">서류 ' + IDX.count[s.id] + '건</div></button>';
  }).join('');
  var pop = B.items.filter(function (i) { return i.type === 'doc' && i.dl > 0; })
    .sort(function (a, b) { return b.dl - a.dl; }).slice(0, 5);
  $('main').innerHTML =
    '<div class="sec-title"><span>어떤 서류가 필요하세요?</span><span class="view-toggle"><button class="on" type="button" data-view="home">섹션별</button><button type="button" data-view="all">전체 목록</button></span></div>' +
    '<div class="grid">' + tiles + '</div>' +
    (pop.length ? '<div class="sec-title"><span>많이 받은 서류</span></div><div class="list">' + pop.map(function (i) { return docRow(i, true); }).join('') + '</div>' : '');
}

function renderAll() {
  var h = '<div class="sec-title"><span>전체 서류</span><span class="view-toggle"><button type="button" data-view="home">섹션별</button><button class="on" type="button" data-view="all">전체 목록</button></span></div><div class="list">';
  var any = false;
  B.sections.forEach(function (s) {
    var docs = B.items.filter(function (i) { return i.sectionId === s.id && i.type === 'doc'; })
      .sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
    if (!docs.length) return;
    any = true;
    h += '<div class="grp">' + esc(s.name) + ' (' + docs.length + ')</div>' + docs.map(function (d) { return docRow(d, false); }).join('');
  });
  $('main').innerHTML = h + (any ? '' : '<div class="empty">등록된 서류가 없습니다.</div>') + '</div>';
}

function renderSection() {
  var crumb = '<div class="crumb"><button type="button" data-home="1">전체</button>' + IC.chev;
  var path = [], cur = V.folder;
  while (cur && IDX.byId[cur]) { path.unshift(IDX.byId[cur]); cur = IDX.byId[cur].parentId; }
  crumb += path.length ? '<button type="button" data-sec="' + esc(V.sec) + '">' + esc(IDX.secName[V.sec]) + '</button>' : '<span class="cur">' + esc(IDX.secName[V.sec]) + '</span>';
  path.forEach(function (f, i) {
    crumb += IC.chev + (i === path.length - 1 ? '<span class="cur">' + esc(f.name) + '</span>' : '<button type="button" data-folder="' + esc(f.id) + '">' + esc(f.name) + '</button>');
  });
  crumb += '</div>';
  var kids = IDX.kids[V.sec + '|' + V.folder] || [], rows = '';
  kids.filter(function (k) { return k.type === 'folder'; }).forEach(function (f) {
    rows += '<div class="row" data-folder="' + esc(f.id) + '" role="button" tabindex="0"><span class="ic">' + IC.folder + '</span>' +
      '<span class="nm">' + esc(f.name) + '</span><span class="meta">' + docsIn(V.sec, f.id) + '건</span><span class="go">' + IC.chev + '</span></div>';
  });
  kids.filter(function (k) { return k.type === 'doc'; }).forEach(function (d) { rows += docRow(d, false); });
  $('main').innerHTML = crumb + '<div class="list">' + (rows || '<div class="empty">이 폴더에는 서류가 없습니다.</div>') + '</div>';
}

function renderSearch(q) {
  var res = DocGate.search(B.items, q);
  $('main').innerHTML = '<div class="sec-title"><span>검색 결과 ' + res.length + '건</span></div><div class="list">' +
    (res.length ? res.map(function (d) { return docRow(d, true); }).join('') :
      '<div class="empty">「' + esc(q) + '」에 맞는 서류가 없습니다.<br>다른 단어로 검색하거나 섹션에서 직접 찾아보세요.</div>') + '</div>';
}

/* ── 이벤트(위임) ──────────────────────────────────────────────── */
$('main').addEventListener('click', function (e) {
  var t = e.target.closest('[data-doc],[data-folder],[data-sec],[data-view],[data-home]');
  if (!t) return;
  if (t.dataset.view) { V = { mode: t.dataset.view === 'all' ? 'all' : 'home', sec: '', folder: '' }; render(); return; }
  if (t.dataset.home) { V = { mode: 'home', sec: '', folder: '' }; render(); return; }
  if (t.dataset.doc) { SEL = SEL === t.dataset.doc ? null : t.dataset.doc; render(); return; }
  if (t.dataset.folder !== undefined && t.dataset.folder) { V.mode = 'sec'; V.sec = V.sec || (IDX.byId[t.dataset.folder] || {}).sectionId; V.folder = t.dataset.folder; }
  else if (t.dataset.sec) { V = { mode: 'sec', sec: t.dataset.sec, folder: '' }; }
  SEL = null; $('q').value = ''; render(); window.scrollTo(0, 0);
});
$('main').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { var t = e.target.closest('.row,.tile'); if (t) { e.preventDefault(); t.click(); } }
});
$('q').addEventListener('input', function () { SEL = null; render(); });
$('qClear').addEventListener('click', function () { $('q').value = ''; SEL = null; render(); $('q').focus(); });

function updateBar() {
  var it = SEL && IDX.byId[SEL];
  if (!it) { $('actbar').classList.remove('show'); return; }
  $('selName').textContent = it.name;
  $('issueBtn').textContent = '다운로드 링크 발급';
  syncIssue();
  $('actbar').classList.add('show');
}
function syncIssue() {                        // 사용 목적이 비어 있으면 발급 불가
  var ok = $('reason').value.trim().length > 0;
  $('issueBtn').disabled = !ok;
  $('reason').classList.toggle('need', !ok);
}
$('reason').addEventListener('input', syncIssue);
$('reason').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('issueBtn').disabled) $('issueBtn').click(); });

/* ── 링크 발급 → 다운로드 ──────────────────────────────────────── */
$('issueBtn').addEventListener('click', async function () {
  if (!SEL) return;
  clr('mainMsg');
  var reason = $('reason').value.trim();
  if (!reason) { $('reason').focus(); return; }
  var b = $('issueBtn'); b.disabled = true; b.innerHTML = '<span class="spinner"></span> 확인 중…';
  try {
    var r = await DocGate.issue(SEL, { name: SAVED.name, title: SAVED.dept + ' / ' + SAVED.title }, reason);
    ticket = r.ticket; dlUsed = false;
    showDownload(r.fileName, r.ttl || DocGate.TOKEN_TTL);
  } catch (e) {
    if (e.code === 'AUTH') { Auth.logout(); return; }
    msg('mainMsg', e.message, 'error'); b.textContent = '다운로드 링크 발급'; syncIssue();
    window.scrollTo(0, 0);
  }
});

function showDownload(fileName, ttl) {
  go('stepDl'); clr('dlMsg');
  $('fileBadge').innerHTML = IC.file + '<span>' + esc(fileName) + '</span>';
  var dl = $('dlBtn'), circle = $('timerCircle');
  dl.disabled = false; dl.style.display = ''; dl.style.background = '';
  dl.innerHTML = IC.download + ' 파일 다운로드';
  if (timerIv) clearInterval(timerIv);
  timerIv = DocGate.startTimer(ttl, function (n) {
    circle.textContent = n; circle.classList.toggle('urgent', n <= 10);
  }, function () {
    ticket = null; dl.style.display = 'none';
    msg('dlMsg', '링크가 만료되었습니다. 다시 신청해 주세요.', 'error');
  });
}
$('dlBtn').addEventListener('click', async function () {
  if (dlUsed || !ticket) return;
  var b = $('dlBtn'); b.disabled = true; b.innerHTML = '<span class="spinner"></span> 다운로드 중…';
  try {
    await DocGate.downloadFile(ticket);
    dlUsed = true; clearInterval(timerIv); ticket = null; $('reason').value = '';
    b.innerHTML = IC.check + ' 다운로드 완료'; b.style.background = 'var(--green)';
    msg('dlMsg', '다운로드가 완료되었습니다. 신청 내역이 기록되었습니다.', 'success');
  } catch (e) {
    b.disabled = false; b.innerHTML = IC.download + ' 파일 다운로드';
    msg('dlMsg', '다운로드 실패: ' + e.message, 'error');
  }
});
$('backBtn').addEventListener('click', function () {
  if (timerIv) clearInterval(timerIv);
  ticket = null; SEL = null; $('reason').value = ''; go('stepMain'); render();
});
</script>
</body>
</html>
